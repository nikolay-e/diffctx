minimum_pre_commit_version: '3.5.0'
default_stages: [pre-commit]
default_language_version:
  python: python3.12
  node: system

fail_fast: false

repos:
  # ============================================================================
  # README AUTO-GENERATION
  # ============================================================================
  - repo: local
    hooks:
      - id: update-readme-usage
        name: Auto-generate README usage section
        language: python
        entry: python scripts/update_readme_usage.py
        pass_filenames: false
        always_run: true

  # ============================================================================
  # BASIC FILE QUALITY CHECKS (baseline hygiene)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^datasets/dcbench/v1/instances/.*/patch\.diff$
      - id: end-of-file-fixer
        exclude: ^datasets/dcbench/v1/instances/.*/patch\.diff$
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^datasets/dcbench/v1/instances/.*/patch\.diff$
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-ast
      - id: debug-statements
      - id: name-tests-test
        args: ["--pytest-test-first"]
        exclude: |
          (?x)^(
            tests/(utils|conftest|framework/.*|garbage_data|scoring)\.py
            |crates/diffctx-native/tests/fixtures/garbage/.*\.py
          )$
      - id: fix-byte-order-marker
      - id: detect-private-key

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject
        name: validate-pyproject (PEP 621 schema)

  # ============================================================================
  # PYPROJECT.TOML FORMATTING
  # ============================================================================
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "v2.18.1"
    hooks:
      - id: pyproject-fmt
        name: pyproject-fmt (normalize pyproject.toml)

  # ============================================================================
  # GITHUB ACTIONS VALIDATION
  # ============================================================================
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.35.0
    hooks:
      - id: check-github-workflows
        name: Validate GitHub workflows
        args: ['--verbose']
      - id: check-dependabot
        name: Validate Dependabot config

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: Lint GitHub Actions

  # renovate.json holds python below the next minor because ci.yml's matrix
  # tops out one below it. That coupling used to live in a comment and nothing
  # else: raise the matrix and the pin keeps silently blocking every python
  # update, with the two files still looking individually correct.
  - repo: local
    hooks:
      - id: python-pin-matches-ci-matrix
        name: renovate python pin matches the CI matrix
        entry: >-
          bash -c 'top=$(grep -E "python-version: \[" .github/workflows/ci.yml
          | grep -o "3\.[0-9][0-9]*" | sort -V | tail -1);
          want="<3.$(( ${top#3.} + 1 ))";
          have=$(sed -n "/\"matchDepNames\": \[\"python\"\]/,/}/s/.*\"allowedVersions\":
          \"\([^\"]*\)\".*/\1/p" renovate.json);
          [ "$have" = "$want" ] ||
          { echo "renovate allows \"$have\", ci.yml matrix tops at $top (expected \"$want\")"; exit 1; }'
        language: system
        pass_filenames: false
        files: ^(\.github/workflows/ci\.yml|renovate\.json)$

  # ============================================================================
  # CODE FORMATTING
  # ============================================================================
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        name: pyupgrade (auto-upgrade Python syntax)
        args: ['--py310-plus']
        files: ^src/.*\.py$

  # ============================================================================
  # STATIC TYPING
  # ============================================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        name: mypy (strict mode)
        additional_dependencies:
          - types-PyYAML
          - PyYAML
          - pathspec
        files: ^src/

  # ============================================================================
  # LINTING (Ruff for speed + correctness)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        name: ruff (correctness-focused checks)
        args: ["--fix", "--unsafe-fixes"]

  # ============================================================================
  # SECURITY & VULNERABILITY DETECTION
  # ============================================================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # packaging/ and bucket/ hold generated release manifests whose SHA-256
        # digests of public artifacts read as high-entropy strings; datasets/
        # is a read-only benchmark corpus of third-party diffs whose commit
        # hashes did the same — 1354 of the baseline's 1360 entries came from
        # there, so approving a real secret-scan change meant scrolling past
        # 10k lines of noise.
        exclude: ^(packaging|bucket|datasets)/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.1
    hooks:
      - id: gitleaks
        name: Scan for secrets (gitleaks)
        exclude: ^datasets/dcbench/v1/instances/

  - repo: https://github.com/semgrep/pre-commit
    rev: v1.149.0
    hooks:
      - id: semgrep
        name: semgrep (AST-based security & policy)
        args:
          [
            "--config=p/security-audit",
            "--config=p/python",
            "--error",
            "--skip-unknown-extensions",
            "--metrics=off",
          ]
        files: ^src/

  # ============================================================================
  # COMPLEXITY ANALYSIS
  # ============================================================================
  - repo: https://github.com/yunojuno/pre-commit-xenon
    rev: cc59b0431a5d072786b59430e9b342b2881064f6
    hooks:
      - id: xenon
        name: xenon (cyclomatic complexity)
        args:
          - "--max-absolute=C"
          - "--max-modules=B"
          - "--max-average=A"
          - "src/"
        pass_filenames: false

  # ============================================================================
  # DEAD CODE DETECTION
  # ============================================================================
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.14
    hooks:
      - id: vulture
        name: vulture (dead code)
        args: ["--min-confidence=80", "src/"]
        files: ^src/
        pass_filenames: false

  # ============================================================================
  # ARCHITECTURE ENFORCEMENT
  # ============================================================================
  - repo: local
    hooks:
      - id: lint-imports
        name: import-linter (architecture contracts)
        entry: lint-imports
        language: system
        pass_filenames: false
        types: [python]

  # ============================================================================
  # CODE DUPLICATION DETECTION
  # ============================================================================
  - repo: https://github.com/PyCQA/pylint
    rev: v4.0.8
    hooks:
      - id: pylint
        name: pylint (duplicate code detection)
        args:
          [
            "--disable=all",
            "--enable=duplicate-code",
            "--min-similarity-lines=6",
            "--ignore-comments=yes",
            "--ignore-docstrings=yes",
            "--ignore-imports=yes",
          ]
        files: ^src/

  # ============================================================================
  # YAML LINTING
  # ============================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - "-d"
          - >-
            {extends: default, rules:
            {line-length: {max: 120}, document-start: disable,
            indentation: disable, comments: disable}}
        exclude: ^(tests/cases/diff/|datasets/dcbench/v1/instances/)

  # ============================================================================
  # SHELL LINTING
  # ============================================================================
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        name: shfmt (shell script formatting)
        args: [-w, -i, '2']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: shellcheck (shell script linting)
        args: [-x]

  # ============================================================================
  # MARKDOWN LINTING
  # ============================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: ['--fix']
        files: \.(md|markdown)$
        # commands/ holds Claude Code plugin slash-command prompts: frontmatter
        # + instruction body, no document heading.
        exclude: ^commands/

  # ============================================================================
  # RUST QUALITY (fmt, clippy, test, audit)
  # ============================================================================
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (Rust formatting)
        language: system
        entry: bash -c 'cd crates/diffctx-native && cargo fmt -- --check'
        pass_filenames: false
        files: ^(Cargo\.(toml|lock)|crates/diffctx-native/)
        types: [file]

      - id: cargo-clippy
        name: cargo clippy (Rust linting)
        language: system
        # pipefail: without it `| tail` swallows clippy's exit code and the hook
        # can never fail. --all-targets: --lib alone left the standalone binary
        # and the integration tests unlinted.
        entry: >-
          bash -c 'set -o pipefail; cd crates/diffctx-native &&
          cargo clippy --release --all-targets 2>&1 | tail -5'
        pass_filenames: false
        files: ^(Cargo\.(toml|lock)|crates/diffctx-native/)
        types: [file]

      - id: cargo-test
        name: cargo test (Rust unit tests)
        language: system
        # Dev profile for the harness-based targets (lib, native_cli): the
        # release profile sets panic = "abort", and pulling the binary into a
        # libtest target there mixes abort and unwind artifacts in
        # target/release, which then breaks the harness-free yaml_cases build.
        # yaml_cases stays on release (harness = false, so abort-safe).
        entry: |
          bash -c '
          cd crates/diffctx-native &&
          cargo test --lib --features python &&
          cargo test --test native_cli &&
          DIFFCTX_YAML_CASES_LIMIT=48 cargo test --release --test yaml_cases'
        pass_filenames: false
        # 48 >= the corpus's stratum count, so round 0 of the stratified sample
        # reaches every directory; at 20 the same first case of the first
        # twenty strata ran on every commit and the rest never did. Case edits
        # under tests/cases must run it too, or a case lands with no run.
        files: ^(Cargo\.(toml|lock)|crates/diffctx-native/|tests/cases/)
        types: [file]

      - id: cargo-audit
        name: cargo audit (dependency vulnerabilities)
        language: system
        # A real advisory must fail the hook. The previous entry was
        # `... && cargo audit || true`, which swallowed a non-zero exit AND
        # silently passed when cargo-audit was absent — which it is on GitHub
        # runners, so this check had never once executed while reporting green.
        # Missing tool now says so out loud instead of masquerading as a pass;
        # the authoritative run is the cargo-audit job in ci.yml, which
        # installs it.
        entry: >-
          bash -c 'if command -v cargo-audit >/dev/null 2>&1; then
          cargo audit; else
          echo "cargo-audit not installed locally - skipping (ci.yml gates this)"; fi'
        pass_filenames: false
        files: ^(Cargo\.(toml|lock)|crates/diffctx-native/Cargo\.toml)$
        types: [file]

  # ============================================================================
  # COMMIT MESSAGE QUALITY
  # ============================================================================
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.9.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # commitizen validates the conventional-commit FORM, not the length. Counted
  # in CHARACTERS, not bytes: subjects here routinely carry an em-dash (3 bytes)
  # or Cyrillic. `wc -m` only counts characters under a UTF-8 locale and the
  # hook inherits whatever the caller has, so python does the counting.
  # Subject line only; a body may carry a long URL.
  - repo: local
    hooks:
      - id: commit-subject-length
        name: commit subject fits 72 chars
        entry: >-
          bash -c 'n=$(head -1 "$1" | python3 -c "import sys; print(len(sys.stdin.read().rstrip(chr(10))))");
          [ "$n" -le 72 ] || { echo "subject is $n chars, limit 72"; exit 1; }' --
        language: system
        stages: [commit-msg]
