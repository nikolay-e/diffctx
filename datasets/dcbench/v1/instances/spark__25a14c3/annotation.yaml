curation:
  source: TOANALYZE-2026-07-07
  n_files: 20
  description: Add date time functions to Scala, Python and Connect (part 1) with golden files
notes: >-
  Exposes four already-SQL-only date/time functions (`dateadd`, `date_diff`, `day` —
  all pre-existing FunctionRegistry aliases of `date_add`/`datediff`/`dayofmonth` — and
  `date_from_unix_date`, wrapping the pre-existing `DateFromUnixDate` expression) as
  first-class Scala, Python and Spark-Connect DataFrame APIs; no new expression
  semantics are added. Verified via git grep that `FunctionRegistry.scala` already
  registered all four names (`setAlias = true` for three of them) before this commit
  and is untouched by the diff — genuine nontrivial gold explaining why the PR is purely
  additive wrapper/fixture code across 20 files. string_indirection is true both because
  FunctionRegistry resolves these names by string key and because the Spark Connect
  client sends the same function name as a string (`Column.fn("dateadd", ...)`) over
  the wire for server-side resolution.
