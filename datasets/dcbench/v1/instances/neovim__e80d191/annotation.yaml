    rationale: 'defines the new `nvim_open_tabpage(Buffer buffer, Dict(tabpage_config) *config, Error *err)` entrypoint: validates the buffer handle, branches on `enter` between win_new_tabpage() (existing) and the new win_new_tabpage_noenter(), then sets the target buffer via TRY_WRAP(win_set_buf(...)).'
  - path: src/nvim/window.c
    tier: essential
    role: definition
    in_diff: true
    rationale: 'adds win_new_tabpage_noenter(after, err), a close line-for-line mirror of the pre-existing (unchanged, same file) win_new_tabpage() — same alloc_tabpage()/leave_tabpage()/win_alloc_firstwin()/position-insertion logic — but skipping enter_tabpage() at the end and firing only WINNEW/TABNEW autocmds (no WINENTER/TABENTER), since it must NOT switch the current tabpage.'
  - path: src/nvim/api/keysets_defs.h
    tier: essential
    role: definition
    in_diff: true
    rationale: 'adds `typedef struct { OptionalKeys is_set__tabpage_config_; Boolean enter; Integer after; } Dict(tabpage_config);`, the opts struct nvim_open_tabpage''s HAS_KEY_X(config, enter)/HAS_KEY_X(config, after) checks are typed against.'
  - path: test/functional/api/tabpage_spec.lua
    tier: helpful
    role: test
    in_diff: true
    rationale: 302-line addition covering enter/after semantics, positioning edge cases (after=1, after beyond last tab, before a middle tab), autocmd firing in the new tabpage's context, and buffer-deleted/tabpage-closed-by-autocmd error paths — pins the exact ordering behavior described only informally in the doc-comment.
  - path: runtime/lua/vim/_meta/api_keysets.lua
    tier: helpful
    role: doc
    in_diff: true
    rationale: 'adds the generated `vim.api.keyset.tabpage_config` class stub (`enter?: boolean`, `after?: integer`) mirroring keysets_defs.h, the user-facing type surface for the new opts dict.'
