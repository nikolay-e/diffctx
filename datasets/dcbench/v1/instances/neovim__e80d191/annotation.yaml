notes: 'Adds nvim_open_tabpage(buffer, {enter, after}) to create a tabpage and optionally set its buffer without necessarily switching to it. The new low-level win_new_tabpage_noenter() in window.c is a deliberate near-duplicate of the pre-existing win_new_tabpage() in the same file (confirmed via grep: same helper calls, same position-insertion logic), omitting only the final enter_tabpage()/WINENTER/TABENTER steps — since that sibling function lives in the same already-gold file, no separate external nontrivial gold entry is needed, but it is called out in window.c''s rationale as the key structural precedent.'
