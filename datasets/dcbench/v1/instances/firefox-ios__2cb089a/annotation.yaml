gold:
  - path: Client-Bridging-Header.h
    tier: essential
    role: definition
    in_diff: true
    rationale: Removes the raw-source import lines for SDWebImage, Adjust and OnePasswordExtension
      from Carthage/Checkouts, which is the root cause forcing every Swift consumer to gain an
      explicit `import WebImage`/`import AdjustSdk`/`import OnePasswordExtension`.
  - path: Client/Application/AdjustIntegration.swift
    tier: essential
    role: caller
    in_diff: true
    rationale: Sole consumer of the `Adjust`/`AdjustDelegate`/`ADJConfig` API removed from the
      bridging header; gains the new `import AdjustSdk` line that replaces it.
  - path: Client/Extensions/UIImageViewExtensions.swift
    tier: essential
    role: caller
    in_diff: true
    rationale: Defines the `setIcon`/`sd_setImageWithURL` wrapper on UIImageView using SDWebImage
      symbols (SDImageCacheType, SDWebImageOperation) that now require `import WebImage` instead
      of the bridging-header source import.
  - path: Client/Frontend/Share/ShareExtensionHelper.swift
    tier: essential
    role: caller
    in_diff: true
    rationale: Sole consumer of `OnePasswordExtension.sharedExtension()`, which requires the new
      `import OnePasswordExtension` line replacing the removed bridging-header import.
  - path: Client.xcodeproj/project.pbxproj
    tier: essential
    role: config
    in_diff: false
    rationale: Already declares WebImage.framework, AdjustSdk.framework and OnePasswordExtension.framework
      as PBXFileReference/PBXBuildFile entries pointing at Carthage/Build/iOS/*.framework and wires
      them into the Frameworks and "Copy Frameworks" build phases — this is why the fix is to import
      them as proper Swift modules rather than raw sources via the bridging header.
  - path: Cartfile
    tier: helpful
    role: config
    in_diff: false
    rationale: Declares `rs/SDWebImage` "3.7.4", `adjust/ios_sdk` "v4.5.0" and, notably,
      `AgileBits/onepassword-extension` pinned to the "add-framework-support" branch — explaining
      why these three (and only these three) Carthage dependencies now ship as linkable frameworks
      needing native `import` statements.
