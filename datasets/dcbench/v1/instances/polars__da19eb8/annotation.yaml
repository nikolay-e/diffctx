curation:
  source: TOANALYZE-2026-07-07
  n_files: 4
  description: Expose fixed-size rolling window exprs in Python visitor — rs visitor + py cuda test
notes: >-
  Previously the IR node-visitor returned `PyNotImplementedError` for any
  `IRFunctionExpr::RollingExpr` node, blocking external engines (cudf-polars) from
  handling fixed-size rolling-window expressions during query-plan traversal. This
  adds a `PyRollingFunction` pyclass mirroring `IRRollingFunction`'s variants and
  serializes `RollingOptionsFixedWindow`'s fields into a tuple, bumping the visitor
  protocol's minor version. CorrCov/Map rolling functions remain unimplemented.
