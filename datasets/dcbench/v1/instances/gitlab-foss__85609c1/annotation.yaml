notes: >
  Adds a `variable_type` enum (env_var/file) to all four CI variable models via the
  shared `HasVariable` concern, exposed end-to-end: four identical migrations + schema,
  a helper/view select control, JS row-input wiring, strong-params updates across four
  controllers, and API entity/param changes across three endpoints. string_indirection
  is true because the UI select's string option values ('env_var'/'file') from
  `ci_variables_helper.rb` must match the `HasVariable` enum keys by name, not by static
  reference. Gold includes the out-of-diff `Maskable#to_runner_variable`, whose `super`
  chaining is what lets the new `file:` key survive the module include order in
  Ci::Variable/Ci::GroupVariable.
