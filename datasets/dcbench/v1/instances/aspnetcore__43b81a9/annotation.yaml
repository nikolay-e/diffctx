gold:
  - path: src/Components/Web/src/Media/MediaComponentBase.cs
    tier: essential
    role: definition
    in_diff: true
    rationale: New abstract base class implementing IComponent/IHandleAfterRender/IAsyncDisposable that owns the load/cache/dispose lifecycle shared by Image, Video, and FileDownload; it calls JSRuntime.InvokeAsync("Blazor._internal.BinaryMedia.setContentAsync", ...), the central mechanism the whole commit generalizes.
  - path: src/Components/Web/src/Media/MediaSource.cs
    tier: essential
    role: definition
    in_diff: true
    rationale: Renamed/generalized from Image/ImageSource.cs; defines the MediaSource type (byte[]/Stream + MimeType + CacheKey) that MediaComponentBase.Source and all three components consume - the shared input contract for the whole suite.
  - path: src/Components/Web/src/Media/MediaContext.cs
    tier: essential
    role: definition
    in_diff: true
    rationale: Defines the MediaContext (ObjectUrl/IsLoading/HasError/Element) passed into the RenderFragment<MediaContext> ChildContent of Image and Video, and is the base class FileDownloadContext extends for FileDownload - the shared child-content API surface.
  - path: src/Components/Web.JS/src/Rendering/BinaryMedia.ts
    tier: essential
    role: definition
    in_diff: true
    rationale: Renamed/rewritten from BinaryImageComponent.ts; implements setContentAsync and downloadAsync, the exact JS methods MediaComponentBase.cs and FileDownload.cs invoke by the string "Blazor._internal.BinaryMedia.<method>" via IJSRuntime - the only link between the C# and TS halves of the feature.
  - path: src/Components/Web/src/Media/Image.cs
    tier: essential
    role: definition
    in_diff: true
    rationale: Concrete MediaComponentBase subclass (TargetAttributeName "src") demonstrating the generalized pattern the commit title calls out ("Generalize Image component"); shows the ChildContent/default-render split every subclass follows.
  - path: src/Components/Web/src/Media/FileDownload.cs
    tier: essential
    role: definition
    in_diff: true
    rationale: New component that overrides ShouldAutoLoad=false and defines its own OnClickAsync/FileDownloadContext, invoking "Blazor._internal.BinaryMedia.downloadAsync" directly rather than the base class's setContentAsync path - the most divergent of the three new components and central to the "add ... FileDownload" half of the commit.
  - path: src/Components/Web.JS/src/GlobalExports.ts
    tier: helpful
    role: config
    in_diff: true
    rationale: Swaps the exported BinaryImageComponent for BinaryMedia on the Blazor._internal object, which is the JS-side registration point that makes the "Blazor._internal.BinaryMedia.*" interop string calls in MediaComponentBase.cs/FileDownload.cs resolvable at runtime.
  - path: src/Components/Web/src/PublicAPI.Unshipped.txt
    tier: helpful
    role: config
    in_diff: true
    rationale: Roslyn public-API-tracking file removing the old Microsoft.AspNetCore.Components.Web.Image.* surface and adding the full Media namespace surface (MediaComponentBase, MediaSource, MediaContext, Image, Video, FileDownload, FileDownloadContext) - the authoritative list of the new public API this commit introduces.
forbidden:
