  description: Generalize Image component; add Video and FileDownload components
notes: 'Generalizes the old Image/ImageSource pair into a Media namespace: MediaComponentBase
  (shared load/cache/dispose lifecycle) + MediaSource + MediaContext, with Image,
  Video, and FileDownload as thin subclasses, all bridged to the browser via a
  renamed/rewritten BinaryMedia.ts that the C# side calls purely by interop string
  ("Blazor._internal.BinaryMedia.setContentAsync"/"downloadAsync") - hence
  string_indirection: true. Searched git grep at the pinned commit for any
  consumer of Components.Web.Image.*/BinaryImageComponent or
  Blazor._internal.BinaryMedia outside the 25-file diff and found none: this is
  a brand-new, self-contained feature suite with no external callers yet, so
  no_nontrivial_context is set and gold is the 8-file semantic core (3 shared
  primitives, 2 representative subclasses, JS interop counterpart, and the two
  coupled config/registration files) rather than all 25 touched paths (tests
  and remaining testasset/E2E files omitted as repetitive of the same pattern).'
