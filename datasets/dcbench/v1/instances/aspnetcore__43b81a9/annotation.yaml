    reason: name looks like the parent of MediaComponentBase but MediaComponentBase implements IComponent/IHandleAfterRender directly and does not inherit from this class.
  - path: src/Components/Web/src/Virtualization/Virtualize.cs
    reason: sibling component in the same Web project with a comparable JS-interop-plus-disposal shape, but it renders lists via IAsyncEnumerable and is untouched by this commit.
  - path: src/Components/Web.JS/src/Services/NavigationEnhancement.ts
    reason: same Web.JS/src tree and does browser-side interop, but it is about client-side navigation/enhanced-nav caching, not media streaming, and is not part of this diff.
  - path: src/Components/Server/src/Circuits/CircuitHost.cs
    reason: bm25 hit on "streaming"/render-batch terminology, but it manages SignalR circuit lifecycle server-side and has no relation to the browser-side media/object-URL caching this commit adds.
