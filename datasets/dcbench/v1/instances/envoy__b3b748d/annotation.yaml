candidates_from: [agent-exploration]
notes: >
  Adds a new envoy.formatter.dynamic_modules CommandParserFactory that lets dynamic modules
  (Rust/C/Go) implement custom %COMMAND% access-log and header formatting operators; it also
  extracts the access-logger's ABI callback plumbing into a shared ContextAccessor
  (abi_context_accessors.{h,cc}) that both extensions now use, explaining the 478-line deletion
  in source/extensions/access_loggers/dynamic_modules/abi_impl.cc within the same commit.
  string_indirection is true on two independent axes: %COMMAND% tokens are matched by name at
  format-string parse time (substitution_formatter.cc), and the module's callback symbols are
  resolved by string name via dlsym/dlopen (dynamic_module->getFunctionPointer("envoy_dynamic_module_on_formatter_...")).
