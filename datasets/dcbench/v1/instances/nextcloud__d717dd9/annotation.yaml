  description: OCP Consumable vs Implementable API attributes — 21 lib/public files + autoload regeneration
notes: >
  Introduces a new OCP\AppFramework\Attribute family (Consumable/Implementable/Listenable/
  Catchable/Dispatchable/ExceptionalImplementable, all extending ASince) to replace the
  plain '@since X.Y.Z' docblock convention with a machine-checkable declaration of whether
  apps may only call an API or are also expected to implement/extend/listen-to it. Piloted
  on lib/public/Notification/* and Calendar\CalendarEventStatus, gated by a path check in
  the psalm plugin build/psalm/OcpSinceChecker.php, which is itself essential context for
  why exactly this file set was converted. Fully self-contained within the diff.
