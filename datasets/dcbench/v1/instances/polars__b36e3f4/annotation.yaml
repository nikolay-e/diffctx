curation:
  source: TOANALYZE-2026-07-07
  n_files: 69
  description: Move (almost) all join code polars-core → polars-ops
notes: >-
  Relocates nearly all hash-join and asof-join implementation code from polars-core
  into polars-ops. Beyond mechanical file moves and `_`-prefixing previously-public
  hashing helpers (signaling crate-private), the real content is architectural: since
  DataFrame/Series are defined in polars-core, polars-ops cannot add inherent impls to
  them (Rust orphan rule), so the former `impl DataFrame`/`impl Series` join methods
  become extension traits (`JoinDispatch: IntoDf`, `SeriesJoin: SeriesSealed`) mirroring
  a pattern already used elsewhere in polars-ops (`DataFrameOps: IntoDf`).
