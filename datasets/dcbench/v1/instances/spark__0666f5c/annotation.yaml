  description: Add bit/octet_length APIs to Scala, Python and R simultaneously
notes: >-
  Exposes the existing SQL-only `bit_length`/`octet_length` expressions as first-class
  Scala, Python and R DataFrame APIs; no new expression semantics are added. Verified
  via git grep at the pinned commit that `BitLength`/`OctetLength` (stringExpressions.scala)
  and their `FunctionRegistry` string-key registrations already existed before this
  commit and are untouched by the diff — they are genuine nontrivial gold explaining
  why the PR is purely additive wrapper code. string_indirection is true because
  FunctionRegistry links "bit_length"/"octet_length" to the case classes by string key,
  and the R wrappers reach the Scala functions object by JVM class-name string via
  `callJStatic("org.apache.spark.sql.functions", ...)`.
