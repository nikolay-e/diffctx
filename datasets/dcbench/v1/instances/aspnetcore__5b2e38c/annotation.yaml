curation:
  source: TOANALYZE-2026-07-07
  n_files: 50
  description: Add Blazor WebAssembly Service Defaults template — max extension diversity
notes: >-
  Adds a 'blazor-wasm-servicedefaults' dotnet template wiring OpenTelemetry/service
  discovery/resilience into a Blazor WASM app, plus a new BrowserConfiguration model
  that carries server config to the client via a DOM comment (hosted mode) or a
  '_blazor/_configuration' fetch (standalone mode), replacing the old
  WebAssemblySettingsEmitter header mechanism. string_indirection=true because the
  standalone JS reads a magic '_blazor/_configuration' URL string and the hosted DOM
  comment is parsed by prefix ('Blazor-Configuration:') rather than a static reference.
