  description: Remove virtual rollups for persisted consolidated sites — refactor with module deletion
    ripple
notes: Replaces the synthetic, in-memory "rollup" Site struct (id 0, ETS-cached team site_ids) with a
  real persisted `consolidated` Site row backed by Plausible.ConsolidatedView.Cache; renames
  rollup_site_ids to consolidated_site_ids end-to-end through query parsing, legacy query building, and
  SQL where-clause construction, and simplifies public-API/site-access authorization since consolidated
  sites no longer need special "rollup:" domain-prefix handling.
