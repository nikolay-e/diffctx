notes: 'Extracts the EndpointSlice reconciler/topologycache/metrics/util code from internal pkg/controller into a new standalone staging module k8s.io/endpointslice, so it can be vendored by out-of-tree consumers. Not a pure rename: previously-unexported symbols (reconciler, deleteService, reconcile, managedByController, managedByChanged, controllerName) were exported (Reconciler, DeleteService, Reconcile, ManagedByController, ManagedByChanged, GetReconcilerName) to form the new package''s public API, and the ownership label written via discovery.LabelManagedBy is now sourced from GetReconcilerName() by string. pkg/controller/util/endpointslice only partially moved (endpointset.go/endpointslice_tracker.go relocated, utils.go deleted, errors.go left behind), which is easy to misread as a stray leftover rather than an intentional split.'
