curation:
  source: TOANALYZE-2026-07-07
  n_files: 14
  description: 'feat(api): combined highlights in nvim_eval_statusline() — C↔Lua boundary + docs'
notes: >
  Adds a `groups` (stacked-highlight) array to nvim_eval_statusline()'s
  `highlights` return value and applies the same combined-highlight logic to
  'statuscolumn' sign/numhl rendering, unifying logic previously duplicated
  across api/vim.c, drawline.c and statusline.c (StlFlag/stl_hlrec_t.item is
  the shared vocabulary). The three nontrivial (out-of-diff) files are the
  primitives the new code depends on but doesn't redefine: hl_combine_attr()
  (what "combine" means), the HLF_* highlight-file enum (which builtin groups
  are combined), and get_default_stl_hl() (how the base/default group is
  chosen).
