curation:
  source: TOANALYZE-2026-07-07
  n_files: 15
  description: Add IPersistentComponentStateSerializer<T> extensibility interface
notes: >-
  Adds an extensibility point letting developers register a
  PersistentComponentStateSerializer<T> (implementing internal
  IPersistentComponentStateSerializer) via DI to override JSON serialization
  for specific [PersistentState] property types; PersistentStateValueProvider
  now resolves a per-type serializer from IServiceProvider and falls back to
  JSON when none is registered. Type-keyed DI lookup (typeof(T) -> service),
  not string-keyed, so string_indirection is false.
