notes: >-
  Adds a new `array_prepend(array, element)` builtin (Snowflake-parity): a brand-new
  `ArrayPrepend` catalyst expression + string-keyed FunctionRegistry entry + Scala/PySpark
  API wrappers + catalyst-unit and DataFrame-integration tests + SQL golden tests. Unlike
  the bit/octet_length case, the expression itself is new here (not pre-existing), so the
  whole implementation is self-contained within this commit's 12-file diff; the base
  traits ArrayPrepend extends (BinaryExpression, ImplicitCastInputTypes,
  ComplexTypeMergingExpression, QueryErrorsBase) are generic shared framework used by
  hundreds of unrelated expressions, not specific context for this change, so
  no_nontrivial_context is set instead of padding gold with them. string_indirection is
  true because FunctionRegistry links "array_prepend" to `ArrayPrepend` by string key.
