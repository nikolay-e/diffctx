  installer/pkg/cluster/checks.go, and a content-service test file — pulled in from unrelated components,
  i.e. mild over-selection creeping in even on an ''ok'' run. Terraform module-block granularity (whole
  module{} definitions) is a reasonable fragment size, so md_tokens=19112 vs yaml_tokens=20542 (markdown
  ~7% leaner) is not egregious for a hierarchy-wide variable-threading refactor, but the unrelated 7 files
  mean it''s not clean either.'
