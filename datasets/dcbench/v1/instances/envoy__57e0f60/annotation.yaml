notes: >-
  Removes the deprecated TLS enforce_rsa_key_usage config option and the was_key_usage_invalid
  stat/BoringSSL check, since BoringSSL is dropping SSL_set_enforce_rsa_key_usage and
  SSL_was_key_usage_invalid and Envoy has enforced key-usage validation unconditionally for
  months. The two in-repo bssl-compat shim files were surfaced via git grep on the exact BoringSSL
  symbol names named in the commit message; they are not required to compile/read the diff but
  directly substantiate the "why" the commit message asserts.
