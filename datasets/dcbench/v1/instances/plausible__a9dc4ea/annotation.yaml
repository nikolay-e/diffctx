notes: >-
  Deletes the standalone /team/select page: the topbar team-switcher
  dropdown now shows every setup-complete team (pinned active team on top,
  scrollable list, no more three-item cap), and the sites-page empty-state
  "Go to team sites" button routes directly to the team's sites (or opens an
  inline dropdown when there's more than one) instead of navigating to the
  now-removed page. Both the conn-pipeline (auth_plug.ex) and LiveView
  (auth_context.ex) code paths that feed @teams are updated in lockstep so
  behavior stays identical between controller- and LiveView-rendered pages.
  string_indirection is true because RequireAccountPlug's exception
  allowlist matches raw path segments, not named routes.
