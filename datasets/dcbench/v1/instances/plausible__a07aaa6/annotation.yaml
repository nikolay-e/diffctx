notes: >-
  Adds a team-wide "force 2FA" policy: owners can require all members to
  enable TOTP, which RequireAccountPlug enforces on every request (except a
  small allowlist of 2FA-setup/team-select paths) by redirecting
  non-compliant users to an auto-submitting interstitial, then to the normal
  2FA setup flow with an explanatory notice. Enabling notifies all non-guest
  members by email (except the enabler); disabling requires the owner's
  password and is itself audit-logged. The Team.policy embed is un-gated
  from EE-only so CE also gets it. string_indirection is true because
  RequireAccountPlug's exception list matches raw conn.path_info segment
  lists rather than named route references.
