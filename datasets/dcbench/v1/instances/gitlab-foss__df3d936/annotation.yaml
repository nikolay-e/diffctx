notes: 'Aligns the frontend LastCommit Vue component and its GraphQL query with field names that already existed on the backend Tree/Commit GraphQL types (lastCommit/sha/latestPipeline), switches its transport to a non-batched single request, and flips _files.html.haml to mount the Vue widget behind the pre-existing vue_file_list feature flag instead of server-rendering the commit well. string_indirection is true because the rendering path switch is gated by Feature.enabled?(:vue_file_list, @project), a name-based flag lookup.'
