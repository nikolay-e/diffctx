gold:
  - path: app/assets/javascripts/repository/components/last_commit.vue
    tier: essential
    role: definition
    in_diff: true
    rationale: Rewrites the apollo update() to read data.project.repository.tree.lastCommit (was .commit) and template/computed to use commit.sha and commit.latestPipeline (was commit.id/commit.pipeline).
  - path: app/assets/javascripts/repository/queries/pathLastCommit.query.graphql
    tier: essential
    role: definition
    in_diff: true
    rationale: Query fields renamed from commit{id,pipeline{...}} to lastCommit{sha,latestPipeline{...}} to match the real backend GraphQL schema field names.
  - path: app/views/projects/_files.html.haml
    tier: essential
    role: config
    in_diff: true
    rationale: Switches the last-commit block from `if commit` (server-rendered shared/commit_well) to `if vue_file_list_enabled?` mounting the new `#js-last-commit` Vue+GraphQL widget.
  - path: app/assets/javascripts/repository/index.js
    tier: essential
    role: definition
    in_diff: true
    rationale: Removes the `if (commitEl)` guard, now unconditionally mounting the LastCommit Vue app onto #js-last-commit since _files.html.haml always renders that element when vue_file_list_enabled?.
  - path: app/assets/javascripts/lib/graphql.js
    tier: essential
    role: definition
    in_diff: true
    rationale: "ApolloLink.split condition adds || operation.getContext().isSingleRequest, which last_commit.vue's new context: { isSingleRequest: true } apollo option relies on to route the query away from request batching."
  - path: app/graphql/types/tree/tree_type.rb
    tier: essential
    role: definition
    in_diff: false
    rationale: Defines `field :last_commit, Types::CommitType` on the Tree GraphQL type; this is the backend field pathLastCommit.query.graphql's renamed `lastCommit` selection actually targets.
  - path: app/graphql/types/commit_type.rb
    tier: essential
    role: definition
    in_diff: false
    rationale: Defines `field :sha` and `field :latest_pipeline` on the Commit GraphQL type; these are the pre-existing backend field names the frontend query/component are updated to match instead of the old id/pipeline names.
  - path: app/helpers/projects_helper.rb
    tier: helpful
    role: config
    in_diff: false
    rationale: "Defines vue_file_list_enabled? as `Gitlab::Graphql.enabled? && Feature.enabled?(:vue_file_list, @project)`, the feature-flag check _files.html.haml now branches on to pick the Vue/GraphQL last-commit path over the legacy server-rendered one."
