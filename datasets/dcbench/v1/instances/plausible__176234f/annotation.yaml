notes: >-
  Adds a new "24h" (rolling last-24-hours) time period across the whole
  stack: TS dashboard picker/labels, Stats API v2 parsing, dashboard legacy
  query parsing, QueryBuilder's datetime-range construction, Comparisons'
  window arithmetic for three compare modes, interval defaults, the EE
  consolidated-view simplification, and the public JSON schema. The atom
  :"24h" is a literal Elixir atom used consistently as a static value (not a
  dynamic string lookup), so string_indirection is false; the one
  out-of-diff file is the Query struct definition that all the pattern
  matches target.
