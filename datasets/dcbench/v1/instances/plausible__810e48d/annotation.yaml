notes: >-
  Adds a "Goal / Conversions" section to the weekly/monthly e-mail digest by
  rewriting the report-building worker to query top goals (dimension
  event:goal) alongside the existing pageview/visitor aggregates, top pages,
  and top sources, all now built through Stats.Query.build/4 +
  Stats.query/2 instead of the deleted Plausible.Stats.EmailReport module
  and the old Query.from/Query.set API. Assign names sent to the MJML
  template are renamed in lockstep across the worker, the mailer, and the
  template. string_indirection is false: assigns flow through compile-time
  bound template variables and direct function calls, not name-based
  lookup.
