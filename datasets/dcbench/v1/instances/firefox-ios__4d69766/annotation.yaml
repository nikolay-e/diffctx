notes: "Adds ModernAction (Sendable protocol with Mirror-based auto description) and a generic Either<Left,Right> utility, then reworks Store's actionQueue to carry Either<Action, ModernAction> tuples with a WindowUUID so a future dispatch(_ action:forWindowUUID:) path can coexist with the legacy dispatch(_ action:) path; the .modern branch is a TODO stub (no reducer/middleware wired yet). Purely additive/self-contained: no other type in the repo conforms to DispatchStore and nothing outside this package references ModernAction or Either yet, so no compile-time consumer coupling exists beyond what's in the diff."
