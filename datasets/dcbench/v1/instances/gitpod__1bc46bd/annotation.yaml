notes: Another total hang on an 86-file DevOps refactor (GCP service-account auth removed in favor of
  Workload Identity, previewctl install-context simplified, several Go/shell files deleted). Unlike commit
  002 this diff is mostly genuine substantive changes rather than boilerplate regeneration, so there is
  no obvious single 'garbage' file to blame — this looks like an intrinsic scaling problem in the selection/parsing
  pipeline on ~86 heterogeneous files (YAML actions, Dockerfiles, shell scripts, Go, Terraform) rather
  than a specific pathological file. Zero output means zero comprehension delivered; this is a pure regression,
  not a bloat issue.
