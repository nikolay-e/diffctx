gold:
  - path: homeassistant/helpers/service.py
    tier: essential
    role: definition
    in_diff: true
    rationale: Central diff file — widens async_get_config_entry's entry_id param to str | None and adds _async_get_single_loaded_config_entry, which looks up the sole loaded, non-ignored, non-disabled config entry for a domain (raising ServiceValidationError with translation_key service_found_no/multiple_config_entry_for_domain or service_config_entry_not_loaded).
  - path: tests/helpers/test_service.py
    tier: essential
    role: test
    in_diff: true
    rationale: test_get_service_config_entry_none exercises every branch of the new fallback — none found, single loaded, ignored/disabled entries skipped, multiple found, and found-but-not-loaded — pinning the exact semantics of the new None-entry_id path.
  - path: homeassistant/components/abode/services.py
    tier: essential
    role: caller
    in_diff: true
    rationale: First real consumer — _get_abode_system collapses its manual `hass.config_entries.async_loaded_entries(DOMAIN)` + empty-check + ServiceValidationError into one call to service.async_get_config_entry(hass, DOMAIN, None), the pattern this helper exists to replace.
  - path: homeassistant/components/ness_alarm/services.py
    tier: essential
    role: caller
    in_diff: true
    rationale: Second consumer — both handle_panic and handle_aux duplicated the same async_loaded_entries(DOMAIN)[0]-or-raise logic; both are rewritten to call service.async_get_config_entry(call.hass, DOMAIN, None), eliminating the duplication and the integration-local "no_config_entry" translation key.
  - path: homeassistant/components/homeassistant/strings.json
    tier: helpful
    role: config
    in_diff: true
    rationale: Adds the service_found_multiple_config_entry_for_domain and service_found_no_config_entry_for_domain translation keys that _async_get_single_loaded_config_entry raises by translation_key, under the shared "homeassistant" domain so any integration reusing the helper gets a consistent message for free.
  - path: homeassistant/components/ness_alarm/strings.json
    tier: helpful
    role: config
    in_diff: true
    rationale: Removes the now-dead per-integration "no_config_entry" exception string, since ness_alarm's handlers no longer raise it directly and instead rely on the shared homeassistant-domain translation keys.
