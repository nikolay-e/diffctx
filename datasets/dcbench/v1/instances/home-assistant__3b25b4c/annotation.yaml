notes: 'Self-contained 6-file commit: extends the existing helpers/service.py::async_get_config_entry with a None-entry_id fallback that finds the single loaded config entry for a domain, and migrates its first two consumers (abode, ness_alarm) off their hand-rolled async_loaded_entries(DOMAIN)[0] patterns onto it. string_indirection is true because the raised errors are linked to their user-facing text purely via translation_key strings resolved against homeassistant/strings.json. All context needed to understand the change is already within the 6 diffed files (no_nontrivial_context: true); several sibling integrations (hue, dynalite, downloader) still use the old pattern and were deliberately left forbidden as not-yet-migrated look-alikes.'
