notes: 'Bulk removal of [Obsolete] Blazor Components APIs across 5 assemblies (Router.PreferExactMatches, EditContext validation helpers, RemoteBrowserFileStreamOptions, WebEventCallbackFactoryEventArgsExtensions, WebRenderer.RendererId init, InternalCalls.InvokeJS, JSInteropMethods.NotifyLocationChanged, AccessTokenResult ctor/RedirectUrl, RemoteAuthenticationService ctor overload, SignOutSessionStateManager), each mirrored by a PublicAPI.Unshipped.txt *REMOVED* entry. Most removals are self-contained; the one real logic change is in RemoteAuthenticatorViewCore.ProcessLogOut, which drops the SignOutSessionStateManager fallback and relies solely on Navigation.HistoryEntryState, so gold focuses on that WebAssembly.Authentication sign-out cluster plus its NavigationManager/PublicAPI support rather than every mechanically-deleted member across all 20 files.'
