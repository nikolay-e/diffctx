curation:
  source: TOANALYZE-2026-07-07
  n_files: 129
  description: Move unified validation APIs to separate package — 100+ file package extraction
notes: >-
  Extracts the unified-validation APIs (IValidatableInfo, ValidationOptions,
  ValidatableTypeInfo, the ValidationsGenerator source generator, etc.) out of
  Http.Abstractions/Http.Extensions into a brand-new Microsoft.Extensions.Validation
  package under src/Validation/, renamespacing Microsoft.AspNetCore.Http.Validation ->
  Microsoft.Extensions.Validation. Exhaustive git grep for the old and new namespace
  across both the base and pinned commits shows every real consumer (Routing,
  the sample, the benchmark) and every build-wiring file (eng/*.props, TestData.cs,
  the two PublicAPI baselines) is already part of this diff — no outside-the-diff
  file needed updating, hence nontrivial_gold_count: 0. string_indirection is true
  because the shared-framework/package wiring (eng/SharedFramework.Local.props,
  eng/ProjectReferences.props, TestData.cs) links the new package by string assembly
  name via MSBuild item groups, not by a static code reference.
