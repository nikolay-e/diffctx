notes: 'Deletes ~16 Lua functions that were `vim.deprecate(..., ''0.12'')`-marked (vim.tbl_add_reverse_lookup, vim.tbl_islist, vim.loader.disable, vim.lsp.get_active_clients/buf_get_clients/for_each_buffer_client/with, vim.lsp.buf.completion/execute_command, vim.lsp.diagnostic.get_line_diagnostics, vim.lsp.util.set_lines/jump_to_location/trim_empty_lines/try_trim_markdown_code_blocks/lookup_section/_get_offset_encoding), plus the position_encoding-nil fallback path built on the last one. Grepped the base commit for every removed function/field name across the whole runtime/ tree and found only internal callers already covered by the diff — all vim.lsp.util.make_*_params() callers already pass client.offset_encoding explicitly, so the removed nil-fallback never fires internally. One stale, non-functional loose end (vim.lsp.handlers.lua''s @deprecated doc-comment examples still show `vim.lsp.with(...)`) is left unaddressed by this commit but does not affect understanding it.'
