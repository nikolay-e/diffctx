notes: >
  Renames epics.state to epics.state_id via GitLab's standard two-phase
  concurrent-column-rename (regular migration + post-deployment cleanup
  migration), matching the earlier issues/merge_requests state_id convention.
  ee/app/models/epic.rb (the real Epic model with the state enum) is not
  present in this foss-only checkout, so the linkage is annotated through the
  generic migration helper and its documented pattern instead of the EE
  model. The migrate/post_migrate pairing and the FK-ignore-list match are
  coupled only by shared column-name strings/timestamps, not static
  references, hence string_indirection: true.
