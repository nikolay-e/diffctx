curation:
  source: TOANALYZE-2026-07-07
  n_files: 86
  description: Add Components.Testing E2E test infrastructure — code + MSBuild + solution files
notes: >
  Migrates blazor-e2e's Playwright/xUnit-v3 E2E harness into src/Components/Testing:
  a runtime library (ServerFixture/ServerInstance/E2EManifest) driven by a
  build-time MSBuild task (GenerateE2EManifest) wired through Microsoft.AspNetCore.Components.Testing.targets,
  plus a combined TestApp/TestApp.Client/TestApp.E2E.Tests exercising it. Gold favors
  the 5 core infra files plus solution/slnf wiring (in-diff), and 3 out-of-diff Arcade
  eng/ convention files that the commit message and in-file comments explicitly
  reference (ResolveReferences.targets, FunctionalTestWithAssets.props, root
  Directory.Build.props) over the ~75 net-new testassets/test files, which are mostly
  mechanical consumers of the same handful of core APIs.
