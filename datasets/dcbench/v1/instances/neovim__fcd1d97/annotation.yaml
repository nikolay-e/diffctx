    in_diff: true
    rationale: adds a new 'vim.isnil' test block, renames the 'vim.F.if_nil' describe block to 'vim.nonnil' (same assertions against the new name), and adds a new 'vim.npcall' test covering both the success and error-returns-nil paths.
