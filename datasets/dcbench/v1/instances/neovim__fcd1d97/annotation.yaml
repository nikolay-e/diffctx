notes: 'Promotes vim.F.if_nil/npcall to top-level vim.nonnil/vim.npcall, adds a new vim.isnil (absorbing the duplicate vim._core.util.isnil, which is deleted outright rather than deprecated), and deprecates the vim.F.* originals as thin vim.deprecate()-wrapped shims. Grepped the base commit for every `vim.F.if_nil/npcall/ok_or_nil/nil_wrap` and `vim._core.util.isnil` caller and confirmed all are updated within the 22-file diff, so the change is self-contained; vim.F.* itself is kept working (not removed) so any external plugin caller outside this tree is unaffected.'
