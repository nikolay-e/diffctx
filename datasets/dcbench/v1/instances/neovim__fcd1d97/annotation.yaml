gold:
  - path: runtime/lua/vim/_core/shared.lua
    tier: essential
    role: definition
    in_diff: true
    rationale: 'adds the three new global functions: vim.isnil(t) (`t == nil or t == vim.NIL`, absorbing the old vim._core.util.isnil), vim.nonnil(...) (moved verbatim from vim.F.if_nil), and vim.npcall(fn, ...) (reimplemented pcall-wrapper) — the actual new public API this commit introduces.'
  - path: runtime/lua/vim/F.lua
    tier: essential
    role: definition
    in_diff: true
    rationale: 'F.if_nil/F.ok_or_nil/F.npcall/F.nil_wrap are marked `@deprecated`, each calling `vim.deprecate(''vim.F.x'', replacement, ''0.14'')` and delegating to vim.nonnil()/vim.npcall(), the shim layer that keeps old callers working while steering them to the new names.'
  - path: runtime/lua/vim/_core/util.lua
    tier: essential
    role: definition
    in_diff: true
    rationale: 'removes the duplicate `M.isnil(value)` helper (identical body to the new vim.isnil) entirely — NOT kept as a deprecated shim, unlike vim.F.* — so every caller of `require(''vim._core.util'').isnil` had to be migrated in this same commit (completion.lua, lsp/util.lua) or it would break.'
  - path: runtime/lua/vim/lsp/util.lua
    tier: helpful
    role: caller
    in_diff: true
    rationale: drops the `local isnil = require('vim._core.util').isnil` alias and migrates three call sites (symbols_to_items' deprecated/tags/containerName checks, show_document's `focus` default) to vim.isnil()/vim.nonnil(), the most substantial caller migration.
  - path: runtime/lua/vim/diagnostic/_jump.lua
    tier: helpful
    role: caller
    in_diff: true
    rationale: 'renames its local `local api, if_nil = vim.api, vim.F.if_nil` alias to `local api, nonnil = vim.api, vim.nonnil`, representative of the same alias-rename pattern repeated in diagnostic/_float.lua.'
  - path: test/functional/lua/vim_spec.lua
    tier: helpful
