  description: Split `py-polars` crate → polars-python extraction, 88 crates/ + 81 py-polars/ files
notes: >-
  Extracts the bulk of py-polars's PyO3 binding code into a new reusable library
  crate `crates/polars-python`, leaving `py-polars` as a thin cdylib wrapper that
  re-exports and registers the pymodule. Almost every file move is a 100%-similarity
  git rename; the only real restructuring is splitting `series/mod.rs` and
  `lazyframe/mod.rs` each into a `mod.rs` (struct definition) plus a `general.rs`
  (methods), needed because the struct now must be visible to sibling submodules in
  the new crate layout. Everything needed to understand the change is inside the
  diff (old path, new path, and the Cargo.toml/feature-forwarding wiring), so no
  nontrivial (out-of-diff) gold was found — set no_nontrivial_context: true.
