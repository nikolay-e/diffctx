    role: cochange
    in_diff: true
    rationale: Adds acquisition_channel_has_category_ai_assistants matching the literal string 'SOURCE_CATEGORY_AI_ASSISTANTS' used by acquisition.ex, so a one-off ClickHouse backfill categorizes historical events identically to live ingestion.
