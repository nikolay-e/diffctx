  - path: lib/plausible_web/plugs/favicon.ex
    tier: essential
    role: cochange
    in_diff: true
    rationale: Adds @custom_icons entries (Claude, ChatGPT, DeepSeek, Grok, Google Gemini, etc.) so the new canonical source names introduced in custom_sources.json get a favicon instead of falling through to the placeholder.
  - path: priv/data_migrations/AcquisitionChannel/sql/acquisition_channel_functions.sql.eex
