notes: Adds a new "AI Assistants" acquisition channel (ChatGPT, Claude, Gemini, Copilot, DeepSeek, Grok,
  Phind, Perplexity) plus subdomain-suffix source matching (officeapps.live.com, wikipedia.org), renaming
  Source.src/1 and Source.parse/1 to from_custom_sources/1 and from_referrer/1 and fixing the GA4-import
  path to reuse from_referrer/1 for identical normalization. string_indirection is true because the
  category label "SOURCE_CATEGORY_AI_ASSISTANTS" is duplicated as a bare string between the Elixir
  module attribute and the ClickHouse SQL/dictGet migration function, and because acquisition.ex's
  category-lookup keys must match the lowercased canonical names produced by source.ex's
  from_custom_sources/1.
