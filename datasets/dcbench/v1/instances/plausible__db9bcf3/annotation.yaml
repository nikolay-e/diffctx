    tier: helpful
    role: test
    in_diff: true
    rationale: New cases assert suffix-based matching (officeapps.live.com, wikipedia.org subdomains) and that Source.from_referrer/1 normalizes RefInspector aliases identically to resolve/1, covering the bug this refactor fixes for the GA4 import path.
