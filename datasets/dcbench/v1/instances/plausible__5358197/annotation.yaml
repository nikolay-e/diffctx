notes: >-
  Re-enables and fixes scroll-depth support that had been temporarily
  disabled: switches scroll-depth aggregation from per-visitor (user_id) to
  per-session (session_id) across native queries, imports, and exports;
  renames the "pageleave" event/drop-reason to "engagement" throughout
  ingestion; renames imported columns scroll_depth/pageleave_visitors to
  total_scroll_depth/total_scroll_depth_visits; fixes a CSV-import bug where
  SELECT * silently broke on reordered/extra columns; and factors sampling
  math into a shared scale_sample/1 macro. Linkage is via direct
  function/macro calls and Ecto field names, not strings, so
  string_indirection is false.
