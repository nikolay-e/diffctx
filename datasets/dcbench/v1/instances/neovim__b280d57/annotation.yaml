notes: 'Moves the bulk of the ruby provider''s logic from Vimscript (runtime/autoload/provider/ruby.vim) into a new Lua module (runtime/lua/vim/provider/ruby.lua), leaving only thin `v:lua.require''vim.provider.ruby''...` shims in the .vim file. string_indirection is true both for the `v:lua.require''vim.provider.ruby''` Lua-module-by-name resolution and for host.vim''s `function(''provider#ruby#Require'')` Funcref-by-name registration, which is why that one function name had to be preserved verbatim in Vimscript.'
