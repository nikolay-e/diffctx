notes: 'Unlike RN-008, the file selection here is largely on-target: the 60 ctx_files include the 40 diff
  files plus a genuinely relevant extra 20 (ShadowNodeFamily.h, ComponentDescriptor.h, AttributedString.h,
  yoga''s Baseline.cpp, test files) that a reader would want to understand baseline alignment on shadow
  nodes. The defect is token bloat, not file selection: React Native''s generated feature-flag files (Kt/C++/JS
  accessor/provider boilerplate) get rendered as large near-complete file dumps or long runs of near-identical
  16-line ''changed'' chunks despite the actual code change being a single new flag threaded through ~1-2
  lines per file. That inflates 628 lines of real diff into 47k tokens. A tool optimizing comprehension-per-token
  should collapse repetitive generated-flag boilerplate to just the new/changed entries rather than re-rendering
  entire accessor tables.'
