notes: >-
  Adds a self-service "Leave Team" flow: a new Teams.Memberships.Leave
  service (guards the last-owner case, deletes the membership, cleans up
  owned segments, deletes SSO users, emails the departing member), a
  controller action + route wired to a new settings-page button, and an
  email template. string_indirection is true because the router binds the
  "/team/leave" URL path string to the :leave_team controller action, which
  templates then reference via the Routes.settings_path helper rather than a
  static function reference.
