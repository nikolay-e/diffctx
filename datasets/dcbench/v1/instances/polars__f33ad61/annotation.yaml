curation:
  source: TOANALYZE-2026-07-07
  n_files: 46
  description: Implement {Expr,Series}.rolling_rank() — FFI feature + Cargo.toml/lock coupling
notes: >-
  Implements rolling_rank (average/min/max/dense/random tie-breaking methods) for
  both fixed-size and dynamic (by-time) rolling windows. Built on a new in-house
  `OrderStatisticTree` (polars-utils) that replaces the external `skiplist` crate
  dependency (removed from Cargo.lock/Cargo.toml) so the existing rolling-quantile
  sorted-buffer code and the new rank window can share one data structure. Threads
  through polars-compute kernels, polars-plan DSL/IR, polars-time Series dispatch,
  PyO3 bindings, and Python Expr/Series wrappers. Self-contained: no nontrivial
  out-of-diff context was needed.
