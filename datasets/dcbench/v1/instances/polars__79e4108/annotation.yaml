  - path: py-polars/tests/unit/operations/test_rolling.py
    tier: essential
    role: test
    in_diff: true
    rationale: test_rolling_window_size_zero_23434 parametrizes over all affected rolling_* methods, asserting window_size=0 matches "the aggregation of an empty series" — 0.0 for sum, None for the rest.
  - path: crates/polars-compute/src/rolling/sum.rs
    tier: helpful
    role: caller
    in_diff: false
    rationale: Defines SumWindow, whose running total starts at (and never drops below) zero — this is why rolling_sum at window_size=0 evaluates to 0.0 in the new test while every other aggregation (which has no zero-element identity) evaluates to None; also a caller of det_offsets/det_offsets_center via rolling_apply_agg_window.
