notes: >-
  Adds a new envoy.filters.http.sse_to_metadata response-encoder filter that parses SSE
  (text/event-stream) bodies via Http::Sse::SseParser and delegates content extraction to a
  pluggable envoy.content_parsers.* extension (envoy/content_parser/{parser,factory,config}.h),
  resolved by TypedExtensionConfig name, with envoy.content_parsers.json as the sole existing
  implementation reused for LLM token-usage extraction. Both the filter interface and the JSON
  parser predate this commit and are not in the diff, which is the core nontrivial context here.
