notes: 'Same shape as RN-018: file selection is reasonable (the 11 extra ctx_files beyond the 29 diff
  files -- CdpMetricsReporter.cpp, PerformanceEntry.h, PerformanceObserver.cpp, feature-flag test files,
  primitives.h -- are legitimately related companions/definitions for the new perf-issue reporting path),
  so recall is decent. But 47,533 md_tokens for a 322-insertion/74-deletion diff is a ~100x blow-up driven
  by full or near-full dumps of the generated cross-platform feature-flag files (Kt/C++/JS accessor, provider,
  interop layers) that this repo regenerates for every new flag. The single new flag (enable perf-issue
  reporting) touches one line in each of a dozen boilerplate files, but diffctx renders large surrounding
  stretches of each as ''changed''.'
