notes: >
  Replaces a runtime fallback (email-change permission defaulting to the display-name-change
  setting when unset) with a one-time DB migration that copies the value forward, then
  simplifies the three call sites that used to compute the fallback live. All coupling is
  through the bare string literal 'allow_user_to_change_email' (no shared PHP constant),
  independently hardcoded in the migration, User::canChangeEmail(), and both
  UsersController call sites, hence string_indirection: true.
