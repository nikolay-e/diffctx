  description: Refactor HtmlRenderer layering — architectural refactor with baseline
notes: >-
  Splits the old ComponentPrerenderer (which wrapped a separate HtmlRenderer instance)
  into EndpointHtmlRenderer, a partial class across 3 files that directly subclasses
  the newly-public StaticHtmlRenderer (renamed from internal HtmlRendererCore) and
  implements IComponentPrerenderer, collapsing two DI-registered services into one and
  updating the PublicAPI.Unshipped.txt baseline accordingly. DI wiring is via normal
  typed service registration, not string-keyed, so string_indirection is false.
