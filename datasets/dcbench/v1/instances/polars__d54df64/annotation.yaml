notes: >-
  Fixes skip_batches (statistics-based batch pruning) to correctly handle `~col(A)`
  (IRBooleanFunction::Not) on a Boolean column with nulls, which previously fell
  through to no skip-predicate at all (silent under-optimization, not incorrectness)
  because no arm matched `Not`. Small self-contained 3-file diff: the fix, a new
  targeted skip-predicate test, and re-enabling a previously-disabled delta-lake
  regression test (#26290) that now passes.
