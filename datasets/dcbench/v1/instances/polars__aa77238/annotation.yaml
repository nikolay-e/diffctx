notes: >-
  Adds Expr.cat.to (convert physical -> categorical/enum) and Expr.cat.physical
  (extract physical codes) through the full Rust DSL -> IR -> dispatch -> PyO3 ->
  Python chain. The Series-level Python methods are empty stubs whose real bodies
  are injected at class-definition time by the `expr_dispatch` decorator, which
  matches method names/signatures against ExprCatNameSpace by string/introspection
  rather than a static call — hence string_indirection: true.
