notes: >-
  Lets a user accepting a site-ownership transfer skip carrying over the
  site's existing guest members/invitations when doing so would push them
  over their plan's team-member limit, via a skip_site_members_transfer?
  option threaded from a new UI dropdown through the controller,
  Sites.Transfer.accept/4, Invitations.ensure_can_take_ownership/3
  (as skip_team_member_limit_check?), and transfer_site_ownership/4. Also
  renames Quota's ignore_pageview_limit option to skip_pageview_limit_check?
  for naming consistency with the new skip options. string_indirection is
  true because the controller dispatches on a raw
  "skip_site_members_transfer" request parameter string rather than a typed
  value.
