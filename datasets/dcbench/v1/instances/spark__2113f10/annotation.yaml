curation:
  source: TOANALYZE-2026-07-07
  n_files: 13
  description: Introduce TVF `collations()`, remove SHOW COLLATIONS (grammar + code + docs)
notes: >-
  Replaces the `SHOW COLLATIONS [LIKE pattern]` command with a queryable table-valued
  function `collations()` (`SELECT * FROM collations() WHERE LANGUAGE = ...`), removing
  the grammar rule, lexer token, `ShowCollationsCommand`, `SparkSqlParser.visitShowCollations`
  and `SessionCatalog.listCollations` in favor of a new `Collations` Generator expression
  registered in `TableFunctionRegistry`. `CollationFactory`/`CollationMeta`
  (common/unsafe/.../CollationFactory.java) back both the old command and the new TVF
  identically and are large pre-existing shared infrastructure unrelated to this specific
  change, so no_nontrivial_context is set instead of padding gold with them.
  string_indirection is true because `TableFunctionRegistry` links "collations" to
  `Collations` by string key.
