notes: 'Worst over-selection ratio of the three over_dump samples: 70 ctx_files against only 22 files
  actually in the diff (3.2x), for a change that is mostly a mechanical relocation of NetworkReporter
  out of jsinspector-modern into a new react/networking module (674 insertions/428 deletions). Dozens
  of unrelated headers get pulled in purely by jsinspector-modern/ReactCommon co-location (RCTImageCache.h,
  RCTAssert.h, HostAgent.h, TracingAgent.h, PerformanceObserver.h, ShadowViewMutation.h, cocoapods ruby
  build scripts) with no textual or symbol connection to NetworkReporter/NetworkHandler. On top of the
  file-count blowup, the sampled head shows the entire 628-line Package.swift dumped as one fragment to
  represent a 13-line addition (one new `reactNetworking` target block) — same whole-file-chunk pattern
  seen in the other over_dump cases. 47383 tokens for what a reader needs is maybe 15 real files at moderate
  granularity.'
