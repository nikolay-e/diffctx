curation:
  source: TOANALYZE-2026-07-07
  n_files: 217
  description: 'Move AnalysisException to sql/api: 13 scala files + 203 golden .out files (noise stress)'
notes: >-
  Moves `AnalysisException` from sql/catalyst to sql/api so `ParseException` (already in
  sql/api) can extend it directly again; since sql/api cannot depend on `LogicalPlan`
  (sql/catalyst), the `plan` field is extracted into a new `ExtendedAnalysisException`
  subclass that `Analyzer.checkAnalysis` and other internal throw sites now use instead.
  The semantic core is 6-9 Scala files; the other ~203 changed files are golden
  `sql-tests/analyzer-results/*.sql.out` outputs that mechanically flip
  `org.apache.spark.sql.AnalysisException` to
  `org.apache.spark.sql.catalyst.ExtendedAnalysisException` because
  `SQLQueryTestHelper.scala` records `a.getClass.getName` verbatim — traced that
  mechanism explicitly (`nontrivial_gold_count: 0`, only one representative `.out` file
  kept as gold, several near-duplicates marked forbidden) rather than padding gold with
  redundant golden diffs. string_indirection is true because MimaExcludes keys its
  binary-compat exclusion on the fully-qualified class-name string, and the golden-file
  blast radius itself is driven by a stringified class name (`getClass.getName`).
