gold:
  - path: lib/gitlab/database.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: Defines `self.mysql?`/`self.postgresql?`/`self.human_adapter_name`, the exact predicates whose `mysql?` branch is removed and whose call sites are stripped across the other 60+ files in the diff.
  - path: lib/gitlab/database/migration_helpers.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: Largest behavioral rewrite in the patch — `add_concurrent_foreign_key`, `disable_statement_timeout`, `install_rename_triggers`, `replace_sql`, and `mysql_compatible_index_length` all drop their `Database.mysql?`/`Database.postgresql?` branches to become PostgreSQL-only.
  - path: Gemfile
    tier: essential
    role: config
    in_diff: true
    rationale: Removes the `mysql2` and `peek-mysql2` gems, the dependency-level trigger that makes every `Gitlab::Database.mysql?` code path genuinely unreachable and therefore removable.
  - path: app/models/concerns/routable.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: "`find_by_full_path`/`where_full_path_in` lose their `Gitlab::Database.mysql?`-gated BINARY-cast and case-sensitive-vs-insensitive branches, collapsing to a single always-LOWER()-cast query — a real semantic simplification, not just deletion."
  - path: config/initializers/active_record_data_types.rb
    tier: helpful
    role: config
    in_diff: true
    rationale: Drops the `elsif Gitlab::Database.mysql?` branch that registered `MysqlDateTimeWithTimeZone`, leaving only the PostgreSQL `DateTimeWithTimeZone` OID type registration.
  - path: lib/tasks/gitlab/setup.rake
    tier: helpful
    role: caller
    in_diff: true
    rationale: "Removes `Rake::Task[\"add_limits_mysql\"].invoke`, the string-keyed Rake task lookup that was the sole caller of the deleted `lib/tasks/migrate/add_limits_mysql.rake` task (`task add_limits_mysql: :environment do`)."
  - path: spec/lib/gitlab/database/migration_helpers_spec.rb
    tier: helpful
    role: test
    in_diff: true
    rationale: Covering spec for `migration_helpers.rb` — its MySQL-branch examples (542 changed lines) are deleted alongside the corresponding `Database.mysql?` code paths, showing which behaviors were considered safe to drop.
  - path: doc/development/verifying_database_capabilities.md
    tier: helpful
    role: doc
    in_diff: false
    rationale: Documents `Gitlab::Database.mysql?` as a supported public helper ("returns `true` if MySQL is being used") but is not updated by this commit, so it is now stale — a reader needs it to see the (no-longer-accurate) API contract the patch is unwinding.
  - path: doc/update/mysql_to_postgresql.md
    tier: helpful
    role: doc
    in_diff: false
    rationale: States "Support for MySQL was removed in GitLab 12.1", giving the product-level rationale for why this cross-cutting dead-code removal happened.
