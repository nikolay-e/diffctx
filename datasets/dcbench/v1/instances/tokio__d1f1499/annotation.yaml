notes: 'Companion migration to #7621 (io-uring): replaces the ad hoc `--cfg tokio_taskdump` RUSTFLAGS convention with a real (still tokio_unstable-gated) Cargo feature `taskdump`, so the backtrace dependency becomes optional and activated via `--features taskdump` instead of out-of-band RUSTFLAGS. The rename touches every `tokio_taskdump` cfg predicate across runtime/task, runtime/scheduler, sync::notify, and task::local — all mechanical once macros/cfg.rs and Cargo.toml are understood; all needed context is within the diff.'
