curation:
  source: TOANALYZE-2026-07-07
  n_files: 13
  description: Remove the Types Framework feature flag (flag removal ripples through SQL)
notes: >-
  Removes the internal `spark.sql.types.framework.enabled` kill switch (on under tests,
  off in production, never GA) so the Types Framework (TimeType, nanosecond timestamp
  types) is unconditionally the single dispatch path in TypeOps/TypeApiOps/ConnectTypeOps,
  collapsing the legacy flag-off serializer/deserializer branches in
  Serializer/DeserializerBuildHelper. The TIME-type-enabled check that used to live only
  on that now-deleted legacy path is relocated into TimeTypeOps.createSerializer/
  createDeserializer (checkTimeTypeEnabled), preserving UNSUPPORTED_TIME_TYPE behavior —
  pinned by the new TimeTypeOpsSuite. string_indirection is true because the config's
  audit-allowlist entry (configs-without-binding-policy-exceptions) matches configs by
  their plain string name, not a static reference.
