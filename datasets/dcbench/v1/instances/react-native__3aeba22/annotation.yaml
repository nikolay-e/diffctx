notes: 'Less severe file-count over-selection than the other two over_dump samples here (45 ctx_files
  vs 35 real diff files, 10 extras like RCTNetworking.mm, JSExecutor.h, jsi.h, CSSFilter.h that have no
  real bearing on IntersectionObserver/event-loop integration). The dominant bloat driver instead is fragment
  granularity: the sampled head shows the entire ~200-line ReactNativeFeatureFlags.kt file dumped as a
  single ''_chunk_'' fragment to show a 6-line addition (one new flag accessor plus its doc comment) —
  the same whole-file-chunk pattern repeats across every one of the ~13 boilerplate feature-flag-plumbing
  files this diff touches (each just adds one flag to a long alphabetical list), which is most of the
  47389 tokens. A tighter tool would slice just the touched flag block in each of those files.'
