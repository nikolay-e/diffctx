notes: 'Implements the `needs:` CI keyword (DAG support): new ci_build_needs table/model, YAML-processor parsing/validation of needs (including parallel-job name expansion), and a new BuildProcessWorker that re-triggers ProcessPipelineService per completed build so downstream jobs with matching needs can start out of stage order. string_indirection is true because the whole out-of-order evaluation path is gated by Feature.enabled?(:ci_dag_support, project), a name-based flag lookup with no static reference.'
