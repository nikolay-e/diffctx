    in_diff: true
    rationale: Adds has_many :needs / accepts_nested_attributes_for :needs, and dependencies() now filters to options[:needs] in addition to options[:dependencies].
  - path: app/models/commit_status.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: "Adds the with_needs scope (EXISTS against Ci::BuildNeed.scoped_build) used by ProcessPipelineService#process_builds_with_needs, and switches PipelineProcessWorker.perform_async(pipeline_id) to BuildProcessWorker.perform_async(id) on completion."
  - path: app/services/ci/process_pipeline_service.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: Core DAG orchestration; process_builds_with_needs/process_build_with_needs evaluate a completed build's dependents via with_needs and Ci::ProcessBuildService, gated by Feature.enabled?(:ci_dag_support, project).
  - path: app/workers/build_process_worker.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: New worker calling build.pipeline.process!(build.name), the entry point that feeds trigger_build_name into ProcessPipelineService#execute after each build completes.
  - path: lib/gitlab/ci/yaml_processor.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: "Builds needs_attributes from job[:needs] for accepts_nested_attributes_for :needs, and validate_job_needs! enforces that a need refers to a job in a prior stage."
  - path: lib/gitlab/ci/config/entry/job.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: Adds needs to ALLOWED_KEYS/attributes/helpers and validates it as an array of strings, plus a cross-check that dependencies is a subset of needs, the actual YAML-level parsing of the new keyword.
  - path: lib/gitlab/ci/config/normalizer.rb
    tier: helpful
    role: definition
    in_diff: true
    rationale: "expand_names now expands both dependencies and needs job-name lists when a referenced job is parallelized, so needs: still resolves correctly against parallel job instances."
  - path: app/services/ci/process_build_service.rb
    tier: essential
    role: definition
    in_diff: false
    rationale: Defines the schedule/actionize/enqueue-or-skip logic that ProcessPipelineService#process_build_with_needs calls via Ci::ProcessBuildService.new(project, user).execute(subject, current_status).
  - path: app/models/concerns/has_status.rb
    tier: helpful
    role: definition
    in_diff: false
    rationale: Defines COMPLETED_STATUSES, the constant process_build_with_needs checks (HasStatus::COMPLETED_STATUSES.include?(current_status)) before evaluating a dependent build.
