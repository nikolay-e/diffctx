curation:
  source: TOANALYZE-2026-07-07
  n_files: 106
  description: Split common-utils Java code into new module (build + 100-file restructure)
notes: >-
  Splits the Java portion of common/utils into a new common/utils-java module (except
  StorageLevelMapper.java/SparkThrowable.java) so common/network-yarn's shaded shuffle
  jar no longer transitively depends on scala-library. Several utility methods
  previously only in Scala (SparkFileUtils.contentEquals, SparkStreamUtils.toString,
  SparkSystemUtils's OS-detection vals) are reimplemented as static methods on the
  relocated JavaUtils.java, and the Scala traits are rewritten to delegate to them —
  inverting the old Java-calls-into-Scala-object direction. Of 106 changed files, ~30
  are 100%-identical `git mv` renames of independent interfaces/classes (verified via
  the patch's `similarity index 100%` rename headers) carrying no information about the
  split's purpose; gold focuses on the module/dependency wiring and the handful of
  files with real content changes. string_indirection is true because MimaExcludes
  keys its exclusions on fully-qualified class-name strings and the Maven/SBT module
  graph links network-common to the new module by artifact-coordinate string
  (`spark-common-utils-java_${scala.binary.version}`).
