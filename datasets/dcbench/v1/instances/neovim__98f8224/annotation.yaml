notes: 'Adds two new experimental Lua modules, vim.pos (Pos: row/col[/buf] with comparison operators) and vim.range (Range: start/end_ Pos pair with has()/intersect()), registers them in the `vim._submodules` lazy-load table, and wires their doc comments into the vimdoc generator. The lazy-load mechanism itself (string_indirection: true) lives in runtime/lua/vim/_init_packages.lua, not touched by this diff, and is required to understand why adding two boolean table entries in _editor.lua is sufficient to expose `vim.pos`/`vim.range` at runtime.'
