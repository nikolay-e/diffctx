curation:
  source: TOANALYZE-2026-07-07
  n_files: 16
  description: Add from_xml/schema_of_xml to SQL, PySpark and Spark Connect + docs
notes: >-
  Exposes the pre-existing `XmlToStructs`/`SchemaOfXml` catalyst expressions (already
  used internally by the native XML datasource) as first-class SQL/Scala/PySpark/Connect
  `from_xml`/`schema_of_xml` functions — part of a series of PRs adding native XML
  support (SPARK-44265). Unlike the bit_length/dateadd precedents where FunctionRegistry
  was untouched, here the registration itself is new and in-diff, so no external
  nontrivial gold was needed; xmlExpressions.scala is genuinely part of the diff (gains
  `@ExpressionDescription` annotations). string_indirection is true because
  FunctionRegistry links "from_xml"/"schema_of_xml" to their expressions by string key,
  and the Connect client sends the same names as strings over the wire.
