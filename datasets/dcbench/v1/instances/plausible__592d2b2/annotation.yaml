notes: >-
  Pure refactor (no UX change): moves the /settings/billing/subscription page
  from a SettingsController action + template into a SubscriptionSettings
  LiveView rendered directly from the router, extracts its view helpers into
  Components.Billing.Helpers so they work without @conn, and adds a
  CurrentPath plug plus a SettingsContext on_mount hook so the shared
  settings sidebar/layout can work for both conn-based and LiveView-based
  pages via a path string instead of a %Plug.Conn{}. string_indirection is
  true because is_current_tab/2 now matches sidebar entries against
  @current_path with String.ends_with?/2, a string comparison rather than a
  static reference.
