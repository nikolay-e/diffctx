    rationale: SchemeGroupVersion.Version literal flips from "v1beta2" to "v1" — this is the crux of the API graduation, since that string drives the /apis/resource.k8s.io/<version>/ REST path.
  - path: staging/src/k8s.io/api/resource/v1/types.go
    tier: essential
    role: definition
    in_diff: true
    rationale: package clause changes from `package v1beta2` to `package v1`; the canonical DeviceClass/ResourceClaim/ResourceSlice struct definitions now formally live in the v1 package that every generated file in this diff regenerates from.
  - path: staging/src/k8s.io/client-go/kubernetes/scheme/register.go
    tier: essential
    role: config
    in_diff: true
    rationale: adds `resourcev1 "k8s.io/api/resource/v1"` and `resourcev1.AddToScheme` to localSchemeBuilder, so the generated clientset actually recognizes and can serve/decode the new v1 group-version alongside the still-present v1beta2/v1beta1/v1alpha3.
  - path: pkg/apis/resource/v1/register.go
    tier: essential
    role: definition
    in_diff: true
    rationale: internal API's SchemeGroupVersion also flips its Version string to "v1", keeping the internal<->external conversion path aligned with the external group-version bump in the staging register.go.
  - path: api/api-rules/violation_exceptions.list
    tier: helpful
    role: config
    in_diff: true
    rationale: adds names_match exceptions for k8s.io/api/resource/v1,{DeviceAttribute,NetworkDeviceData} fields — required for the new v1 group to pass the API linter, evidence the rename isn't purely mechanical find/replace.
  - path: hack/lib/init.sh
