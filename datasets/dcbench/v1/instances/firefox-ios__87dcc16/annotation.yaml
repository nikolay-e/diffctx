notes: 'Removes the searchBarPosition/bottomSearchBar Nimbus custom feature flag (and its NimbusSearchBarLayer/HasNimbusSearchBar plumbing), replacing it with UserFeaturePreferenceManager-backed userPreferences.searchBarPosition, and migrates addressBarMenu checks from LegacyFeatureFlagsManager to the new FeatureFlaggable/featureFlagsProvider DI path. Linkage runs through string-keyed Prefs (SearchBarPositionUsersPrefsKey) and NSNotification.Name (SearchBarPositionDidChange) consumed by several untouched files, hence string_indirection: true. No candidates.yaml present for this instance.'
