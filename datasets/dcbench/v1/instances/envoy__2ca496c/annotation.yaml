notes: 'Mechanical rename of ~15 external Bazel repos (zlib_ng->zlib-ng, com_google_protoconverter->proto-converter, ocp->ocp-diag-core, etc.) to align workspace-mode names with their bzlmod/BCR module names, propagated to ~30 consumer BUILD files. Linkage is indirect: consumers reference deps by string label (@old_name// vs @new_name//), and repositories.bzl decouples the new `name` from the old REPOSITORY_LOCATIONS_SPEC key via a new `location_name` kwarg on external_http_archive/envoy_http_archive — hence string_indirection: true and envoy_http_archive.bzl as essential nontrivial context.'
