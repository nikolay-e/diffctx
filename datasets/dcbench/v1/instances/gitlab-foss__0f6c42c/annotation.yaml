    rationale: Base concern `included do include BoardsActions end` in the new MultipleBoardsActions — defines #index, #show, #board, #boards memoization and the base serialize_as_json that MultipleBoardsActions overrides/extends; not modified by the patch but required to understand what is being layered on top of.
  - path: app/assets/javascripts/boards/services/board_service.js
    tier: essential
    role: caller
    in_diff: false
    rationale: Frontend BoardService already constructs `this.recentBoardsEndpoint = \`${recentBoardsEndpoint}.json\`` and consumes the endpoint this patch's new :recent route/action finally makes non-nil for projects (boards_helper.rb's recent_boards_endpoint key), showing the frontend was already waiting on this backend change.
