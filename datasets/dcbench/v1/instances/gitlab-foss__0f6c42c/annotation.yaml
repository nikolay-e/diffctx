notes: 'Backend-only move of multi-board support for Projects from EE to CE: swaps BoardsActions for a new MultipleBoardsActions concern on Projects::BoardsController, flips Project#multiple_issue_boards_available? to true, adds create/update/destroy services plus a :recent route+finder, and grants :admin_board via policy. Frontend (board_service.js) already consumed the recent-boards endpoint before this change; this patch is what makes it functional for projects.'
