    rationale: New Boards::VisitsFinder (replacing deleted Boards::Visits::LatestService) used by MultipleBoardsActions#recent and #redirect_to_recent_board.
  - path: app/models/project.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: Flips Project#multiple_issue_boards_available? from false to true, the actual feature-gate flip that this whole commit exists to make.
  - path: config/routes/project.rb
    tier: essential
    role: config
    in_diff: true
    rationale: Adds :create/:update/:destroy actions and the collection :recent route to the project boards resource, required for MultipleBoardsActions' new actions to be routable.
  - path: app/policies/project_policy.rb
    tier: helpful
    role: config
    in_diff: true
    rationale: Adds `enable :admin_board` to reporter/developer/maintainer rules, the ability checked by authorize_admin_board! in the new concern.
