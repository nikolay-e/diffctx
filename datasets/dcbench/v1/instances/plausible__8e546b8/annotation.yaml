notes: >-
  Introduces a new internal POST /:domain/query endpoint that lets the
  dashboard's Top Stats panel use the same Stats-API-v2-shaped query
  contract (date_range/metrics/include) as the public API, replacing the
  bespoke /top-stats endpoint and its ad hoc query-string parsing. This
  requires a from-scratch rewrite of Dashboard.QueryParser (now a map-based
  parse/1 reusing ApiQueryParser's shared clauses) and a parallel FE rewrite
  (stats-query.ts + fetch-top-stats.ts + api.stats) that reshapes field
  names (graph_metric->metric, top_stats->topStats, etc.) throughout
  top-stats.js/visitor-graph.js. A secondary, more mechanical change
  (dropping the now-unused dashboard_metric_labels feature in favor of
  drop_unavailable_time_on_page) rides along in query_include.ex/
  query_optimizer.ex/metrics.ex/query_result.ex. string_indirection is false
  — the endpoint is reached via a normal Phoenix route, and FE/BE field
  names are matched structurally, not looked up by name.
