  description: panic→error sorting object dtype — polars-core fix, py-side tests
notes: >-
  Sorting a column of Python `object` dtype previously hit `SeriesTrait::arg_sort`'s
  default `invalid_operation_panic!` macro (a real Rust panic, crashing the process)
  because ObjectChunked never overrides arg_sort. This commit adds an explicit
  object-dtype check with a proper `PolarsResult` error at the two sort entry points
  (`arg_sort` free function and `DataFrame`'s by-column sort), converting a crash
  into a catchable `InvalidOperationError`, and updates the one existing test whose
  expected error message changed as a result.
