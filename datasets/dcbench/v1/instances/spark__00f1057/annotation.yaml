notes: >-
  Adds a Hive-compatible `quote` builtin (backslash-escape single quotes, wrap in
  single quotes): Quote expression + ExpressionImplUtils runtime helper + string-keyed
  FunctionRegistry entry + Scala/PySpark/Connect API parity + SQL golden tests. Verified
  via git grep that the whole implementation and its parity siblings are self-contained
  within this commit's 12-file diff; the base traits Quote extends (UnaryExpression,
  RuntimeReplaceable, DefaultStringProducingExpression) are generic shared framework
  infrastructure used by hundreds of unrelated expressions, not specific context for
  understanding this change, so no_nontrivial_context is set instead of padding gold
  with them. string_indirection is true because FunctionRegistry links "quote" to
  `Quote` by string key.
