notes: >-
  Adds a fallback Cloak vault + Ecto field (totp_secret_fallback) so TOTP
  secrets can be re-encrypted under a new vault key without breaking existing
  users mid-rotation; validate_code now falls back to the secondary secret
  and reports decode failures to Sentry. Two new data-migration scripts
  (backfill, overwrite) implement the operator-driven rotation steps, and
  rotation_test.exs is an integration test of the whole procedure. Linkage is
  entirely via static module references (Cloak.Vault name, Ecto type, config
  keys), not strings, so string_indirection is false.
