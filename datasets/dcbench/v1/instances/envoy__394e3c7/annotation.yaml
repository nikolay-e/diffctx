  description: 'New http filter_chain filter: 4 api proto files + source + test + docs + changelog + tools'
notes: 'Adds a new envoy.filters.http.filter_chain HTTP filter that wraps a configurable
  chain of sub-filters, selectable per-route via typed_per_filter_config (falling
  back to a filter-level default chain) or passing through if none is configured.
  Sub-filter wiring goes through the global NamedHttpFilterConfigFactory registry
  by string name (Config::Utility::getAndCheckFactory + per-route lookup via
  filterConfigName()), so the key linkage is name-based DI rather than static
  references.'
