notes: 'Raises the workspace MSRV from 1.70 to 1.71, mechanically bumping rust-version across all publishable crate manifests and the CI rust_min env var. The interesting payoff is that Rust 1.71 stabilized `BuildHasher::hash_one`, letting three call sites (loom/std/mod.rs, tokio-util join_map.rs, tokio-stream stream_map.rs) drop hand-rolled build_hasher/hash/finish boilerplate (and, in join_map.rs, an entire local `hash_one` helper function). All sibling Cargo.toml bumps are mechanical duplicates of tokio/Cargo.toml and excluded from gold; README badge and other manifest files add no further understanding.'
