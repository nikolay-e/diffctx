    + code coupling'
notes: 'DelayQueue moves from tokio::time to tokio_util::time as part of unblocking the tokio 0.3 release (deferring a full refactor). Because DelayQueue is backed by the same hashed timing-wheel data structure that tokio''s internal Timer driver uses (tokio/src/time/wheel/{mod,level,stack}.rs), and that wheel is crate-private, the commit duplicates the wheel source verbatim into tokio-util/src/time/wheel/ rather than exposing it — tokio/src/time/wheel/mod.rs is genuinely necessary, out-of-diff context to understand why tokio-util/src/time/wheel/mod.rs exists byte-for-byte identical.'
