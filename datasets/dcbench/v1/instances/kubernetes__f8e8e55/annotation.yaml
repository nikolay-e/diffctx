notes: 'Graduates VolumeAttributesClass to GA-locked-true at 1.36 and switches its etcd storage version from v1beta1 to v1 by dropping the explicit APIStorageVersionOverrides entry. Most touched files are test call-site cleanups now that the gate defaults/locks to true (SetFeatureGateEmulationVersionDuringTest added to keep pre-1.35 gate-disabled test paths working). No codegen involved; gold covers the feature-gate definition, the storage-factory override removal, the storage-hash/etcd-fixture updates, and the untouched REST registration file that shows both API versions stay served regardless of storage version.'
