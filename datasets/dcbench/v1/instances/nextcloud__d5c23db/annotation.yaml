notes: >
  Promotes OC\Cache\CappedMemoryCache to a public OCP\Cache\CappedMemoryCache (identical
  implementation, deprecating the private original) since third-party apps
  (groupfolders, deck, user_oidc) were already relying on it despite it being private
  API. The 22 touched call sites across files_external/files_sharing/user_ldap/lib/private
  are each a one-line 'use' statement swap with no behavior change, so gold picks the two
  class definitions, three representative call sites across different apps, and the test,
  rather than every touched file.
