notes: >-
  Adds shadow_mode to the HTTP ext_authz filter: on deny/error the filter no longer sends a
  local reply, instead writing a new ShadowDecisionObject (FilterState::Object subclass) under
  the string key "<filterConfigName>.shadow" so a downstream filter or access-log formatter can
  read it; both unit and integration tests confirm the string-keyed lookup. The two
  nontrivial-gold files are the generic FilterState::Object base class and the existing
  ext_authz client Response/CheckStatus types the new code builds on.
