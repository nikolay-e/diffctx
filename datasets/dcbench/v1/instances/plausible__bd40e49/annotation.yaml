notes: >-
  Adds a "Path / URL" breakdown-mode toggle to the Pages/Entry pages/Exit
  pages reports: URL mode groups by hostname+page (event:hostname +
  event:page, or the visit:*_page_hostname equivalents) instead of just
  page, reusing the entry_page_hostname/exit_page_hostname filter
  dimensions that already existed in filters.ex but had no GROUP BY
  support. Requires coordinated changes across the query engine
  (select_dimension, split-query renaming, table routing, exit_rate
  validation) and the React report/detail-modal/drilldown-link components,
  plus new external-link and search-by-page-not-hostname behavior.
  string_indirection is true — dimension names ("visit:exit_page_hostname",
  "event:hostname") are matched as strings/map keys throughout the query
  engine, not through static references.
