notes: 'Adds FE plumbing (help paths, ClusterStore.environments, Clusters#initEnvironments) to mount an Environments Vue component and an EE-only group_cluster_environments partial on the cluster show page. In this CE/foss repo both are gated to no-ops: render_if_exists silently skips the missing EE partial, and webpack NormalModuleReplacementPlugin swaps the ee_component import for empty_component.js — understanding the change requires seeing that CE/EE indirection, not just the diff.'
