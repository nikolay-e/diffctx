    in_diff: false
    rationale: Defines `render_if_exists`/`partial_exists?` (using `lookup_context.exists?`), the helper show.html.haml calls for `clusters/clusters/group_cluster_environments`, which silently no-ops because that EE-only partial does not exist in this repo.
  - path: doc/development/ee_features.md
