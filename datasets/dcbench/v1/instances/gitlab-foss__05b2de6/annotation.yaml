    rationale: "The literal fallback module (`export default { render: () => null }`) that config/webpack.config.js substitutes for `ee_component/clusters/components/environments.vue` in this CE repo, so the new Environments mount renders nothing here."
  - path: app/helpers/application_helper.rb
    tier: essential
