notes: 'Small feature-parity PR: exposes the inverse hyperbolic trig functions acosh/asinh/atanh (already present in the Scala functions API since SPARK-33061) to PySpark and SparkR. Both parity wrappers reach the pre-existing Scala method purely through string-keyed reflection -- Python via getattr(sc._jvm.functions, name) and R via callJStatic("org.apache.spark.sql.functions", name, ...) -- so this is a clean string_indirection case; the untouched sql/core/.../functions.scala Scala definitions are the one nontrivial external-context file.'
