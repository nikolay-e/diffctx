notes: >
  Migrates every direct 'new \OCP\Template(...)' construction (deprecated concrete class)
  to the pre-existing OCP\Template\ITemplateManager::getTemplate() factory, returning
  the OCP\Template\ITemplate interface instead. Touches the framework's own
  TemplateResponse/base.php/TemplateManager plus two representative app-level
  IProvider/IDelegatedSettings implementers gaining constructor-injected
  ITemplateManager. ITemplateManager/ITemplate themselves are pre-existing and not
  touched by this diff, but are essential nontrivial context since they define the
  target API surface every call site now migrates to. Type-based constructor DI
  throughout, no string indirection.
