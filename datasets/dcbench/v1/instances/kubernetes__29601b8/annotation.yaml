notes: 'Adds a new alpha DRA API, ResourcePoolStatusRequest (KEP-5677), a CertificateSigningRequest-style request/response type for querying DRA resource-pool availability, gated by a new DRAResourcePoolStatus feature gate. "Validation" here is declarative (struct-tag markers in types.go feeding a validation-gen codegen pass), not a hand-written validation.go, so the essential hand-written surface is the two types.go files, kube_features.go, and defaults.go; register.go/fuzzer.go/defaulting_test.go are the boilerplate wiring every new API type needs. No REST-storage/registry wiring is present at this commit — that is left to a later commit.'
