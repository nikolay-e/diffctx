notes: >
  Adds an admin UI to toggle Windows-compatible-filename (WCF) enforcement and run a
  background job that sanitizes existing filenames, replacing the old single-field
  declarative settings form with a full custom admin page plus a sanitization-progress
  panel. Linkage runs through several string layers: appinfo.xml's class-string settings
  registration, addScript()/webpack entry names, template mount-point ids, initial-state
  keys, and OCS route URLs called via generateOcsUrl - hence string_indirection: true.
  Fully self-contained within the diff; no external nontrivial context needed.
