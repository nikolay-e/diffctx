notes: >-
  Vendors four istio proxy extensions (alpn, istio_stats, peer_metadata,
  metadata_exchange, plus shared workload_discovery/metadata_object helpers) from
  the external istio/proxy repo into envoy's contrib/, with matching api protos,
  docs, and build/registry wiring (CODEOWNERS, api/BUILD, api/versioning/BUILD,
  contrib_build_config.bzl, extensions_metadata.yaml, docs index, spelling
  dictionary, type_whisperer nonstandard-package list). diff-tree shows 45 adds
  and only 10 modifies, zero deletes — none of these paths existed in this repo
  at base_commit, confirming this is a fresh vendor-in, not an in-repo file move.
  Searched the generic consumers of the touched registries (contrib/BUILD,
  contrib/all_contrib_extensions.bzl, contrib/exe/BUILD, test/exe/all_extensions_build_test.cc,
  bazel/repositories.bzl) and CI config for istio-specific coupling outside the
  diff; found none — those files iterate CONTRIB_EXTENSIONS/extensions_metadata.yaml
  generically for every contrib extension and are unchanged by and non-specific to
  this migration, so no_nontrivial_context: true. string_indirection is true because
  contrib_build_config.bzl and extensions_metadata.yaml are linked to each other,
  and ultimately to the runtime `Registry::FactoryCategoryRegistry`, purely through
  matching extension-name strings (e.g. "envoy.filters.http.istio_stats"), not a
  static code reference.
