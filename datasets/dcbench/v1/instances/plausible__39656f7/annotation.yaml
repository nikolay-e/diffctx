notes: >-
  Bundles two related changes: (1) unifies the account/site/team settings
  sidebar rendering into shared Layout.settings_sidebar components
  (replacing two near-duplicate HEEx partials) so a sidebar entry can now
  have a nested submenu, and (2) uses that new submenu capability to add a
  "SSO Sessions" page listing and revoking active SSO user sessions for a
  team. string_indirection is true because routing ("/sso/sessions") and the
  AuthorizeTeamAccess plug's action-name matching (`action in
  [:team_sessions, :delete_session]`) are the linking mechanisms, not static
  function references.
