notes: "Wide 23-file PR porting Aspire's Gateway.cs.in production-readiness (typed BlazorGatewayOptions gating HSTS/HTTPS-redirect/health-checks/OTel telemetry, shutdown-aware liveness, WebApplicationBuilder split for testability) into Microsoft.AspNetCore.Components.Gateway, plus a matching WASM client-side OTel fix (skip wiring when OTEL_EXPORTER_OTLP_ENDPOINT unset, avoiding a CircularDependencyException). Gold picks the semantic core (gateway src + its new test suite + the WASM template counterpart) over the many mechanical/config-only files (icon, launchSettings inspectUri removal, template rename baseline). string_indirection=true because BlazorGatewayOptions is bound from configuration keys (e.g. 'Gateway:HealthChecks:Enabled', 'BlazorGateway' section name) rather than compile-time references."
