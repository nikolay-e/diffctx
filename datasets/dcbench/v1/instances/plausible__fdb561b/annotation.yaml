curation:
  source: TOANALYZE-2026-07-07
  n_files: 24
  description: Move invitations logic under Teams context — context-module move with alias ripple across
    16 lib files
notes: Pure reorganization commit — moves lib/plausible/site/memberships/*.ex to
  lib/plausible/teams/invitations/*.ex (renaming AcceptInvitation/CreateInvitation/RejectInvitation/
  RemoveInvitation to Accept/InviteToSite/Reject/RemoveFromSite), deletes the now-redundant
  Plausible.Site.Memberships defdelegate facade, and renames the pre-existing
  Plausible.Teams.Invitations.Remove to RemoveFromTeam to avoid colliding with the new RemoveFromSite.
  no_nontrivial_context is true — every symbol needed to understand this move (both endpoints of every
  rename, every call site) is already present in the diff; nothing outside it is required.
