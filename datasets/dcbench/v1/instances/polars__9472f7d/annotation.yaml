  description: Add `Expr.is_sorted` — new expression across Rust/Python boundary
notes: Adds Expr.is_sorted(descending=..., nulls_last=...) where either argument may be None to mean "infer/accept either", backed by a refactored is_sorted_impl + new resolve_sort_options inference in polars-ops, an eager dispatch path, and a genuinely new streaming ComputeNode (IsSortedNode) that checks sortedness online across morsels using the pre-existing reorder_cmp primitive for boundary comparisons. Series.is_sorted() is a separate, older, untouched bool-only API.
