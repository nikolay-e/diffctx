    role: definition
    in_diff: true
    rationale: Adds Series::to_unit_list() (renamed/refactored from the removed Series::as_list, same single-element-per-row semantics) — the low-level primitive that as_list's dispatch relies on.
  - path: crates/polars-core/src/frame/column/mod.rs
    tier: essential
    role: definition
    in_diff: true
    rationale: Column::as_list renamed to Column::to_unit_list, dispatching to either Series::to_unit_list or the new ScalarColumn::to_unit_list scalar fast path.
  - path: crates/polars-core/src/frame/column/scalar.rs
    tier: essential
    role: definition
    in_diff: true
    rationale: Adds ScalarColumn::to_unit_list(), a scalar-optimized path avoiding materialization when packing a scalar column into a unit list.
  - path: crates/polars-plan/src/plans/aexpr/function_expr/schema.rs
    tier: essential
    role: definition
    in_diff: true
    rationale: Adds FieldsMapper::map_to_list_of_dtypes, explicitly documented as NOT unwrapping List inputs (unlike map_to_list_supertype) — the typing rule that makes List(T) inputs produce List(List(T)) output, the key semantic difference from concat_list.
  - path: crates/polars-python/src/functions/lazy.rs
    tier: essential
    role: definition
    in_diff: true
    rationale: PyO3 binding `#[pyfunction(name = "list")] pub fn as_list(...)` — the Rust function is named as_list but exported to Python under the name "list", a string-based rename at the FFI boundary.
  - path: py-polars/src/polars/functions/as_datatype.py
    tier: essential
    role: definition
    in_diff: true
    rationale: Defines the public pl.list() Python function calling plr.list(exprs); also, because this module now defines a top-level `list`, the pre-existing struct() function's `list(schema.keys())` call had to be changed to `[*schema.keys()]` in the same diff to avoid being shadowed by the new function.
  - path: py-polars/tests/unit/functions/as_datatype/test_concat_list.py
    tier: essential
    role: test
    in_diff: true
    rationale: Extends the concat_list test file with list()-specific cases proving list-typed inputs are NOT flattened (List(T) -> List(List(T))), unlike concat_list's flattening behavior.
  - path: crates/polars-ops/src/chunked_array/list/namespace.rs
