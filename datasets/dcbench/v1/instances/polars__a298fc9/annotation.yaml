  description: Add `list` expression — Rust core + PyO3 + python API + stubs + docs in one commit
notes: Adds pl.list(*exprs), which packs each expression's value as one list element without unwrapping List-typed inputs (unlike concat_list, which flattens them) — implemented by unit-listing each column then lst_concat-ing them. The Rust function is named as_list throughout but exported to Python as "list" via #[pyfunction(name = "list")], and defining that name in as_datatype.py forced an incidental fix to a builtin-list() call in the same file's struct() function.
