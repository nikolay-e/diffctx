    rationale: "Adds dsl::as_list(), the Rust DSL builder constructing Expr::Function{function: FunctionExpr::AsList}, placed right next to the pre-existing concat_list() it is contrasted with."
  - path: crates/polars-expr/src/dispatch/misc.rs
    tier: essential
    role: definition
    in_diff: true
    rationale: "Adds the as_list dispatch function, the actual algorithm: wraps each input column in a unit list via Column::to_unit_list() then concatenates them row-wise with lst_concat, producing one list element per input expression regardless of whether the input was itself a list."
  - path: crates/polars-core/src/series/ops/reshape.rs
