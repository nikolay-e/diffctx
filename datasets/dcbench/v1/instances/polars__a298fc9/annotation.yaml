    rationale: Defines ListNameSpaceImpl::lst_concat, the pre-existing row-wise list-concatenation primitive that dispatch::misc::as_list reuses to combine the per-column unit lists into the final output — without seeing this, "unit-list each column then lst_concat" reads as unexplained machinery.
