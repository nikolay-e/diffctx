notes: >
  Adds GleanPingUploader/GleanOhttpUploader/GleanHttpUploader/PingUploaderProtocol to bridge
  A-S's OhttpManager into Glean's PingUploader so telemetry pings can go out over OHTTP with an
  HTTP fallback, wired into TelemetryWrapper.setup behind the new ohttpManagerGleanUploader Nimbus
  flag. Wide 24-file diff dominated by Xcode project registration and a Glean SwiftPM bump; picked
  the four new uploader/protocol files, the TelemetryWrapper call site, the out-of-diff OhttpManager
  definition, the Nimbus feature yaml/layer, and the ohttp test as the semantic core.
  string_indirection: true because the Nimbus feature is looked up by generated accessor
  `ohttpGleanUploaderCapabilityFeature` derived from the yaml's string key
  `ohttp-glean-uploader-capability-feature`, and PingCapabilities are matched via
  CapablePingUploadRequest.capable(["http"/"ohttp"]) string tokens rather than static references.
