  description: Funnel exploration logic + UI prototype — Elixir query modules + HEEx + React/JS in one
    commit
notes: Adds a new "exploration" feature letting superadmins interactively pick pageview journeys and see
  next-step suggestions plus a dropoff funnel, spanning a new ClickHouse query module
  (Plausible.Stats.Exploration), two new gated API endpoints, and a new React column-picker UI wired
  into the existing Behaviours tab/mode system. string_indirection is true because router.ex dispatches
  to controller actions by atom name and the SuperAdminOnlyPlug gate is applied via an `action in [...]`
  guard rather than a static call.
