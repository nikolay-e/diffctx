    tier: essential
    role: definition
    in_diff: true
    rationale: New FunnelExploration React component (ExplorationColumn, fetchColumnData) that calls the /exploration/next API and renders the journey-picker UI shown in the Behaviours tab.
  - path: lib/plausible/stats/util.ex
    tier: essential
    role: definition
    in_diff: true
    rationale: percentage/2 is extracted here from extra/lib/plausible/stats/funnel.ex and imported by both funnel.ex and exploration.ex to compute dropoff_percentage.
  - path: lib/plausible_web/router.ex
    tier: essential
    role: config
    in_diff: true
    rationale: Adds `get "/:domain/exploration/next"` and `/exploration/funnel` routes wiring StatsController.exploration_next/2 and :exploration_funnel by atom action name.
  - path: assets/js/dashboard/stats/behaviours/modes-context.tsx
    tier: essential
    role: definition
    in_diff: true
    rationale: Adds Mode.EXPLORATION with isAvailableKey/optedOutKey set to nil, and changes getInitiallyAvailableModes to treat a nil optedOutKey as "always available" — the mechanism that makes the exploration tab unconditionally offered once explorationAvailable is true.
  - path: assets/js/dashboard/stats/behaviours/index.js
    tier: essential
    role: caller
    in_diff: true
    rationale: renderExploration/0 mounts <FunnelExploration/> and the new TabButton is gated on `!site.isConsolidatedView && site.explorationAvailable`, the actual UI integration point for the new component.
  - path: lib/plausible_web/controllers/stats_controller.ex
    tier: essential
    role: caller
    in_diff: true
    rationale: Computes exploration_available? = Plausible.Auth.is_super_admin?(current_user) and passes it to stats.html.heex as data-exploration-available, the server-rendered flag site-context.tsx reads into explorationAvailable.
  - path: lib/plausible_web/plugs/super_admin_only_plug.ex
    tier: helpful
    role: definition
    in_diff: false
    rationale: Defines the plug module referenced by name in api/stats_controller.ex's `plug PlausibleWeb.SuperAdminOnlyPlug when action in [...]` — the actual enforcement behind "Only allow superadmins to query exploration API for now" from the commit message.
  - path: lib/plausible/stats/base.ex
