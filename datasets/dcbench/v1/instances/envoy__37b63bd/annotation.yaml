  description: Bazel refactor of cargo workspace for builtin Rust extensions (Starlark+Cargo coupling)
notes: >
  Consolidates Bazel's Rust crates_repository from a per-crate index scoped to
  source/extensions/dynamic_modules/sdk/rust's own Cargo.lock/toml into a single
  repo-root index (envoy_rust_crate_index) spanning both Rust crates via the
  pre-existing root Cargo workspace, deleting the now-redundant per-crate
  Cargo.Bazel.lock/Cargo.lock and rustfmt.toml symlinks. The linkage between the
  crates_repository name string and its load("@name//:defs.bzl", ...) consumers
  is string-based (Bazel external-repo naming), hence string_indirection: true.
  Most of the raw diff size (~3000 of ~3136 lines) is the deleted generated
  lockfiles, not semantic content; the real change is 4 small config edits.
