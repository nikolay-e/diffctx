    rationale: Renames the crates_repository from dynamic_modules_rust_sdk_crate_index to envoy_rust_crate_index, switches cargo_lockfile from the per-crate source/extensions/dynamic_modules/sdk/rust:Cargo.lock to the root :Cargo.lock, and expands manifests to list both Rust crates' Cargo.toml plus the root Cargo.toml -- this is the core of the refactor.
