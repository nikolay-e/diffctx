notes: Converts the legacy YAML-only SMTP notify integration to a config flow, modeling each recipient as a config subentry, while still forwarding to the unconverted notify.py platform via discovery.async_load_platform; existing YAML configs are auto-imported and flagged via the shared HOMEASSISTANT_DOMAIN "deprecated_yaml" repair issue rather than a smtp-local one.
