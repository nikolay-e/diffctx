notes: '''Decouple commit from mount on Android'' touches 35 files but ctx pulls in 95 — full recall (every
  diff file present) but ~60 extra files beyond the diff. Some extras are genuinely useful (ShadowTree.h,
  MountingCoordinator.h, ConcreteShadowNode.h — headers for the touched .cpp/.h pairs), but many are unrelated
  to shadow-tree mount/commit decoupling: full JSI engine internals (jsi.cpp/jsi.h/testlib), TurboModule
  binding plumbing, inspector/tracing interop files. This looks like an import-graph traversal that over-reaches
  past direct callers into generic core infrastructure, roughly doubling token cost without adding proportional
  understanding.'
