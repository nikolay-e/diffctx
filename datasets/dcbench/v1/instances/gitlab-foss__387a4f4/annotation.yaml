notes: >
  Removes the legacy (pre-ci_job_artifacts) CI artifact storage path: deletes the
  ArtifactMigratable prepend module and LegacyArtifactUploader class, inlines their
  interface directly onto Ci::Build backed solely by Ci::JobArtifact, drops the
  ci_enable_legacy_artifacts feature-flag branch, and marks the now-dead DB columns
  ignored. A full-tree grep at the pinned commit confirms zero remaining references
  to legacy_artifacts_file/metadata, LegacyArtifactUploader, ArtifactMigratable, or
  ci_enable_legacy_artifacts outside this commit's own deletions, i.e. the removal is
  complete. string_indirection: true because job_artifacts_archive/job_artifacts_metadata
  (consumed by the new inline methods) are metaprogrammed via
  `has_one :"job_artifacts_#{key}", ...` over Ci::JobArtifact.file_types in build.rb
  itself, not statically defined methods a plain symbol search would surface.
