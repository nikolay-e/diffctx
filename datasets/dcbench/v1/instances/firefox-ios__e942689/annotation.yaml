notes: >-
  Pure module-extraction: ~50 files under firefox-ios/Shared and
  firefox-ios/ThirdParty (Deferred, Result, Reachability) are git-renamed
  (R096-R100) into the new BrowserKit/Sources/Shared/ SPM target with no
  behavioral changes; project.pbxproj/scheme/swiftlint updated for the new
  package boundary, and a handful of test files gain explicit "import
  Shared". The link is static (module/product name "Shared" is preserved end
  to end, no string-keyed indirection); the one genuine out-of-diff gotcha is
  firefox-ios-tests/Tests/SharedTests/ left entirely unmigrated and still
  using "@testable import Shared", which is why Package.swift needed the
  -enable-testing unsafe flag.
