gold:
  - path: homeassistant/components/snapcast/media_player.py
    tier: essential
    role: definition
    in_diff: true
    rationale: Core of the change - deletes SnapcastGroupDevice/SnapcastBaseDevice split and the custom async_join/async_unjoin/deprecation-issue methods, merging everything into a single SnapcastClientDevice that implements the standard async_join_players/async_unjoin_player/group_members protocol.
