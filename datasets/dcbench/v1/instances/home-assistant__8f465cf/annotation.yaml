    tier: essential
    role: definition
    in_diff: true
    rationale: Removes GROUP_PREFIX/GROUP_SUFFIX/SERVICE_JOIN/SERVICE_UNJOIN/ATTR_MASTER, the string constants that media_player.py, services.yaml and strings.json all keyed off of for the deleted group entity and custom join/unjoin services.
  - path: homeassistant/components/snapcast/services.yaml
    tier: essential
    role: config
    in_diff: true
    rationale: Removes the join/unjoin custom-service schemas (string-keyed to SERVICE_JOIN/SERVICE_UNJOIN in const.py) now that grouping is handled by the standard media_player join/unjoin actions.
  - path: homeassistant/components/snapcast/strings.json
    tier: helpful
    role: config
    in_diff: true
    rationale: Removes the deprecated_group_entities/deprecated_grouping_actions issue strings and join/unjoin service translations, string-keyed to the issue_registry translation_key and service names deleted from media_player.py/services.yaml.
  - path: homeassistant/components/snapcast/icons.json
    tier: helpful
    role: config
    in_diff: true
    rationale: Removes the join/unjoin service icon entries, string-keyed by service name to the schemas deleted from services.yaml.
  - path: tests/components/snapcast/test_media_player.py
    tier: essential
    role: test
    in_diff: true
    rationale: Removes test_legacy_join_issue and test_deprecated_group_entity_issue (the deprecation-issue coverage) and switches to importing SERVICE_JOIN/SERVICE_UNJOIN from homeassistant.components.media_player instead of the deleted snapcast-specific service.
  - path: tests/components/snapcast/snapshots/test_media_player.ambr
    tier: helpful
    role: test
    in_diff: true
    rationale: Deletes the syrupy snapshot entries for the now-removed snapcast_group_* entities (test_group_1/test_group_2), matching the SnapcastGroupDevice removal.
  - path: tests/components/snapcast/const.py
    tier: helpful
    role: test
    in_diff: true
    rationale: Removes TEST_GROUP_ENTITY_ID, the test constant for the deleted group entity id, keeping test fixtures in sync with the client-only entity model.
  - path: homeassistant/components/media_player/__init__.py
    tier: essential
    role: definition
    in_diff: false
    rationale: Defines the core SERVICE_JOIN/SERVICE_UNJOIN actions and the async_join_players/async_unjoin_player/group_members contract gated by MediaPlayerEntityFeature.GROUPING that SnapcastClientDevice now implements natively, explaining why the custom snapcast.join/unjoin services and their deprecation issues could be deleted.
