notes: 'Removes the deprecated Snapcast "group" media_player entities and the custom snapcast.join/unjoin services (and their deprecation issues), collapsing everything onto a single SnapcastClientDevice that implements the standard core media_player join/unjoin/grouping protocol. Linkage from const.py service name constants to services.yaml/icons.json/strings.json is string-keyed (service names), so string_indirection is true.'
