  description: Mirror-sync mega-commit — 275 files, 11 ext types, full stack incl. migrations
notes: >
  This is a GitLab-Bot mirror-sync commit ("Add latest changes from
  gitlab-org/gitlab@master") that squashes dozens of unrelated upstream MRs into one
  275-file commit — there is no single coherent "change" to explain. Per protocol
  guidance for wide diffs ("pick the semantic core, not every touched file"), gold
  focuses on the single largest, most tightly-coupled cluster: extending the work-items
  board card with milestone/iteration/weight/health/parent/relationship metadata gated
  by per-board hidden-metadata preferences (work_item_card.vue is the biggest hunk at
  175 lines, with a matching 265-line spec). The other ~10 unrelated feature clusters in
  this commit (granular webhook tokens, structured webhook logging, super-sidebar
  restructuring, duo-workflow websocket streaming, CI build/pipeline changes, DB
  migrations, and ~150 files of pure doc-link churn) are treated as noise and sampled
  into the forbidden list rather than gold.
