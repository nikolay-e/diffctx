notes: This is a mechanical fork/rename of an entire directory (hermes/inspector -> hermes/inspector-modern)
  where git recorded only one file (CMakeLists.txt) as a detected rename and treated ~60 near-duplicate
  files as brand-new adds (15319 insertions total), so md_tokens=45605 is 'proportionate' to the raw diff
  size but not to the actual information content — most of Connection.cpp (1667 lines), MessageTypes.cpp
  (1948 lines) and ConnectionTests.cpp (2955 lines) are copies of pre-existing code under a new namespace.
  A comprehension-optimized tool should detect the near-duplicate/fork pattern and summarize it (rename
  + the handful of real integration-point diffs in HermesExecutorFactory.cpp/HermesInstance.cpp) rather
  than reproduce ~15k lines of copied protocol/message code verbatim; dumping it wholesale is technically
  'complete' (high recall on paths) but very low comprehension-per-token, which is diffctx's core stated
  metric. changed_frags=512/515 total suggests nearly everything was marked 'changed' rather than being
  deduplicated against the original inspector/ content.
