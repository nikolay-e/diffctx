notes: 'Real diff.stat is only 187 insertions/72 deletions across 79 files (a mechanical .m -> .mm rename
  plus a handful of podspec/include-path edits), but ctx.md renders 49013 tokens across 140 files because
  non-tree-sitter-friendly file types (Ruby podspecs, .mm) collapse into a single ''chunk'' fragment spanning
  the entire file, so a 1-line podspec edit drags in a 124-line full dump, and a renamed .mm file with
  a tiny header tweak drags in its full 387-line body. The 1001-1480 line dump of the generated Podfile.lock
  is pure noise with zero semantic value for a reader. File-level selection recall is good (renamed files
  are all listed) but content-level precision is poor: comprehension-per-token is far below what a rename-focused
  diff should need.'
