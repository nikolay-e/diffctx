  - path: app/services/git/base_hooks_service.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: New shared base class defining execute/push_data/create_events/create_pipelines/execute_project_hooks and the commits/hook_name template methods that BranchHooksService and TagHooksService now implement.
  - path: app/services/git/branch_hooks_service.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: New Git::BranchHooksService < Git::BaseHooksService moving all branch-specific hook logic (commits, branch_create/update/remove_hooks, gpg signature enqueue) out of BranchPushService.
  - path: app/services/git/tag_hooks_service.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: New Git::TagHooksService < Git::BaseHooksService moving tag-specific push-data building (tag/tag_commit/event_message) out of TagPushService.
  - path: app/services/git/branch_push_service.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: Stripped down to delegate execute_related_hooks to BranchHooksService.new(project, current_user, params).execute, keeping only merge-request/mirror/housekeeping/environment concerns.
  - path: app/services/git/tag_push_service.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: Stripped down to delegate to TagHooksService.new(project, current_user, params).execute instead of building push data and firing hooks/pipelines itself.
  - path: app/models/gpg_signature.rb
    tier: helpful
    role: definition
    in_diff: true
    rationale: Adds GpgSignature.unsigned_commit_shas(commit_shas), extracted from the inline SQL previously in BranchPushService#update_signatures and now called from BranchHooksService#enqueue_update_gpg_signatures.
  - path: app/services/delete_branch_service.rb
    tier: helpful
    role: definition
    in_diff: true
    rationale: Drops the unused build_push_data method now that branch deletion push-data/hooks are handled uniformly through the git-hook-driven BranchPushService/BranchHooksService path.
  - path: app/workers/post_receive.rb
    tier: essential
    role: caller
    in_diff: false
    rationale: "Constructs Git::TagPushService.new(project, user, oldrev:, newrev:, ref:, push_options:).execute and the equivalent for BranchPushService; this is the origin of the params[:oldrev]/params[:newrev]/params[:ref] keys every new hooks service reads."
  - path: lib/gitlab/data_builder/push.rb
    tier: helpful
    role: definition
    in_diff: false
    rationale: Defines Push.build(project, user, oldrev, newrev, ref, commits, message, commits_count:, push_options:), the exact positional/keyword signature BaseHooksService#push_data now calls uniformly for both branches and tags.
forbidden:
