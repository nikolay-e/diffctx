    reason: generic superclass used by hundreds of services; only its project/current_user/params accessors matter here and those are already visible at each call site
  - path: app/workers/create_gpg_signature_worker.rb
    reason: async worker enqueued via perform_async; its own implementation isn't needed to follow the synchronous service-layer extraction
  - path: app/models/repository.rb
    reason: huge model providing after_push_commit/after_create_branch/etc.; only the fact that these methods exist matters, not their internals
