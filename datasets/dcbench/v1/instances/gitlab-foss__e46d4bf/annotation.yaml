notes: 'Extracts the shared push-hook logic (events, pipelines, project hooks, cache invalidation, push-data building) out of Git::BranchPushService and Git::TagPushService into a new Git::BaseHooksService, with branch/tag-specific behavior in BranchHooksService/TagHooksService; AfterBranchDeleteService is deleted and its stop_environments logic inlined into BranchPushService. All linkage is static Ruby inheritance/method calls; no string-based indirection.'
