  description: Add `map_sort` function across SQL/Scala + PySpark + R + Connect (cross-language parity)
notes: >-
  Adds a new `map_sort(map[, asc])` builtin (enables sorting maps by key, a prerequisite
  for GROUP BY on map types): a brand-new `MapSort` catalyst expression + string-keyed
  FunctionRegistry entry + Scala/PySpark/R/Connect API parity + catalyst-unit and
  DataFrame-integration tests + Connect golden plan fixtures. The expression is new
  (not pre-existing), so the whole implementation is self-contained within this
  commit's 19-file diff; the base traits MapSort extends (BinaryExpression,
  NullIntolerant, QueryErrorsBase) are generic shared framework used by hundreds of
  unrelated expressions, so no_nontrivial_context is set instead of padding gold with
  them. string_indirection is true because FunctionRegistry links "map_sort" to
  `MapSort` by string key, and the Connect client sends the same name as a string over
  the wire.
