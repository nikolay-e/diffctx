notes: Adds a feature-gated check that TokenRequest.UID matches the target ServiceAccount's UID, returning a Conflict when mismatched (or a warning+audit-annotation when the gate is off); TokenREST also newly implements SubresourceObjectMetaPreserver so the generic create handler stops wiping the request UID before Create ever sees it — that handler is the key nontrivial-gold link since it silently determines whether req.UID is even populated.
