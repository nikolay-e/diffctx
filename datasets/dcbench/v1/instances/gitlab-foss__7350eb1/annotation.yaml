gold:
  - path: lib/gitlab/wiki_file_finder.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: New `WikiFileFinder < FileFinder` class overriding `search_filenames` to match wiki page titles via `repository.ls_files(ref)` + regex, the core of the "search wiki titles" feature.
  - path: lib/gitlab/file_finder.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: Refactors `find_by_filename` to extract `search_filenames`/`blobs`/`blob_refs` as overridable methods, specifically so `WikiFileFinder` can override `search_filenames` alone.
  - path: lib/gitlab/project_search_results.rb
    tier: essential
    role: caller
    in_diff: true
    rationale: '`wiki_blobs` now calls `Gitlab::WikiFileFinder.new(project, ref).find(query)` instead of the removed `project_wiki.search_files(query)`.'
  - path: app/models/project_wiki.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: Removes the old `search_files(query)` method that only searched content, now superseded by `Gitlab::WikiFileFinder`, which searches titles too.
  - path: app/helpers/search_helper.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: Adds `find_project_for_result_blob`, `parse_search_result`, and `search_blob_title` helpers consumed by the new shared `_blob_data` partial.
  - path: app/views/search/results/_blob_data.html.haml
    tier: essential
    role: definition
    in_diff: true
    rationale: New shared partial factored out of `_blob.html.haml`/`_wiki_blob.html.haml`, rendering both blob and wiki-blob results uniformly via the new helper methods.
  - path: app/views/search/results/_blob.html.haml
    tier: helpful
    role: caller
    in_diff: true
    rationale: Rewritten to delegate to the new `_blob_data` partial instead of inlining markup, showing one caller of the refactor.
  - path: app/views/search/results/_wiki_blob.html.haml
    tier: helpful
    role: caller
    in_diff: true
    rationale: Rewritten to delegate to the new `_blob_data` partial with `project_wiki_path`, the other caller demonstrating the unification.
  - path: spec/lib/gitlab/wiki_file_finder_spec.rb
    tier: essential
    role: test
    in_diff: true
    rationale: New spec exercising `WikiFileFinder#find` for both title and content matches via the shared `'file finder'` example.
  - path: lib/gitlab/search_results.rb
    tier: helpful
    role: definition
    in_diff: false
