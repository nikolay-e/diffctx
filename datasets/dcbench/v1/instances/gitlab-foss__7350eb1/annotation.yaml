notes: >
  Adds wiki-title search by introducing `Gitlab::WikiFileFinder`, a subclass of the
  refactored `FileFinder` that overrides filename search to grep wiki page titles
  instead of content; unifies the blob/wiki-blob search result views behind a shared
  `_blob_data` partial and new SearchHelper methods. Gold trimmed from 14 diff files to
  the mechanism's semantic core; boilerplate changelog and low-level repository search
  internals excluded.
