notes: >-
  Deletes the standalone /billing/invoices page and folds its content into
  the /billing/subscription page as an extra tile (visible only when a
  subscription exists), removing the now-redundant sidebar link and route.
  A side effect (dropping the invoice table's column headers) required a
  small CSS fix in the shared table component for tables without a thead,
  which in turn required compensating gap spacing in two unrelated LiveView
  list components that also render thead-less tables. string_indirection is
  true because the sidebar-highlighting mechanism (is_current_tab) matches
  string path segments like "billing/subscription", not static references.
