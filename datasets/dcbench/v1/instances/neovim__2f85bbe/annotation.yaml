notes: >
  Full rewrite of :TOhtml from Vimscript (autoload/tohtml.vim +
  syntax/2html.vim + plugin/tohtml.vim, ~3270 lines deleted) into a single Lua
  module runtime/lua/tohtml.lua (1335 lines) wired up by plugin/tohtml.lua via
  require('tohtml') — a string-keyed module-path indirection. Every file
  needed to understand the migration (old implementation, new implementation,
  new tests, doc regeneration wiring, doc content) is already inside the
  11-file diff; a genuine search turned up no external symbol/caller/config
  dependency the reader would need beyond it, hence no_nontrivial_context.
