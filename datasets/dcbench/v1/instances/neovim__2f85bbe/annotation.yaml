    rationale: the new file — a from-scratch Lua reimplementation of the entire TOhtml conversion (tohtml() function, vim.tohtml.opt/state classes) replacing the deleted Vimscript.
  - path: runtime/plugin/tohtml.lua
    tier: essential
    role: definition
    in_diff: true
    rationale: new plugin entry point — nvim_create_user_command('TOhtml', ...) now calls require('tohtml').tohtml() instead of sourcing autoload/tohtml.vim.
  - path: runtime/autoload/tohtml.vim
    tier: essential
    role: definition
    in_diff: true
    rationale: deleted old implementation (tohtml#Convert2HTML, tohtml#GetUserSettings, encoding/charset tables) that the new Lua module replaces — needed to see what behavior/options were dropped.
  - path: runtime/syntax/2html.vim
    tier: essential
    role: definition
    in_diff: true
    rationale: deleted core :runtime syntax/2html.vim converter script that the old autoload/tohtml.vim sourced — the other half of the legacy implementation being replaced wholesale.
  - path: runtime/plugin/tohtml.vim
    tier: helpful
    role: definition
    in_diff: true
    rationale: deleted old plugin file that previously defined the :TOhtml command and its changelog/version string, superseded by plugin/tohtml.lua.
  - path: test/functional/plugin/tohtml_spec.lua
    tier: helpful
    role: test
    in_diff: true
    rationale: new functional test suite covering the rewritten tohtml() behavior — the only test coverage for this migration.
  - path: runtime/doc/syntax.txt
    tier: helpful
    role: doc
    in_diff: true
    rationale: strips out ~430 lines of old 2html.vim/g:html_* option documentation, replaced by "documentation has been moved to |:TOhtml|", confirming which legacy options are no longer supported.
  - path: scripts/gen_vimdoc.lua
    tier: helpful
    role: config
    in_diff: true
    rationale: "registers 'tohtml.lua' and its module/helptag naming (\"Lua module: tohtml\", *tohtml*) in the vimdoc generator config, which is what turns tohtml.lua's @brief block into the runtime/doc/lua.txt entry."
  - path: runtime/doc/lua.txt
    tier: helpful
    role: doc
    in_diff: true
    rationale: generated output showing the new :TOhtml and tohtml.tohtml({winid},{opt}) signatures, i.e. the documented contract for the rewritten function.
