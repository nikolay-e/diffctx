  n_files: 7
  description: 'docs(generators): bake into cmake — build system + generator scripts'
notes: >
  Moves :help doc generation (gen_vimdoc.py + gen_eval_files.lua) from an ad-hoc
  Makefile/CI two-step invocation into a proper cmake `doc` custom_target with
  file-level DEPENDS/OUTPUT tracking, replacing the old `api-metadata` target.
  gen_vimdoc.py no longer shells out to gen_eval_files.lua itself; cmake now
  depends on both directly. The one nontrivial external file is
  cmake/InstallHelpers.cmake, which defines the glob_wrapper() helper the new
  target relies on for live source-list dependency tracking.
