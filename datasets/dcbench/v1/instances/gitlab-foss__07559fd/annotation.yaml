notes: 'Splits the polling MR-status endpoint (/merge_requests/1.json?serializer=widget) into a dedicated cacheable /merge_requests/1/widget.json route/controller, renaming the frontend statusPath prop into two explicit paths and moving a shared before_action up to the base controller. string_indirection=true because the route-to-controller link (get :widget, to: "merge_requests/content#widget") and the serializer dispatch (opts[:serializer] == "widget" string key in MergeRequestSerializer) are both name/string based rather than static references.'
