  description: Move Buffer/SharedStorage to polars-buffer crate — crate split stress
notes: Unlike a purely mechanical crate split, this one required a real dependency-inversion fix — SharedStorage's InternalArrowArray-owning variant (which referenced polars-arrow's ffi module) was replaced by a generic from_slice_with_owner/ForeignOwner mechanism, and the Splitable/ArrayAccessor trait impls for Buffer had to move into polars-arrow (orphan-rule requirement) since polars-buffer can no longer depend on polars-arrow. ~90 of the 110 changed files are pure `crate::buffer::` / `crate::storage::` -> `polars_buffer::` import-path swaps.
