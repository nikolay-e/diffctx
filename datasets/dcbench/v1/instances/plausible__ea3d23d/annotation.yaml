    tier: helpful
    role: test
    in_diff: true
    rationale: Asserts strict_order persists across create/update and, critically, that a strict-order funnel records 0 visitors at a step reached only via an intervening unrelated event, proving the windowFunnel('strict_order') behavior.
  - path: test/plausible_web/live/funnel_settings_test.exs
    tier: helpful
