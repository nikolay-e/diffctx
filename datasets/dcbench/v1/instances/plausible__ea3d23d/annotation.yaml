curation:
  source: TOANALYZE-2026-07-07
  n_files: 6
  description: Strict order funnels — Ecto schema field coupled with ClickHouse funnel query logic
notes: Adds an opt-in strict_order flag to funnels so that steps must occur consecutively (no
  intervening events) to count, implemented by switching the ClickHouse windowFunnel aggregate to its
  'strict_order' mode and threading the flag through the funnel context API and settings LiveView. The
  backing DB column was added by an earlier, separate migration commit not part of this diff.
