    rationale: defines createValidationService(), the orchestration entry point imported by Boot.Web.ts that composes ErrorDisplay, EventManager, DomScanner and ValidationEngine.
  - path: src/Components/Web.JS/src/Validation/DomScanner.ts
    tier: essential
    role: definition
    in_diff: true
    rationale: scans the DOM for validatableElementSelector (elements carrying data-val="true") and registers them with the ValidationEngine - the client-side counterpart of the server's data-val-* attribute emission.
  - path: src/Components/Web.JS/src/Validation/ValidationEngine.ts
    tier: essential
    role: definition
    in_diff: true
    rationale: implements the validation state machine (ElementState, validateElement/validateForm) that CoreValidators and DomScanner operate on.
  - path: src/Components/Web.JS/src/Validation/CoreValidators.ts
    tier: essential
    role: definition
    in_diff: true
    rationale: registerCoreValidators() maps rule-name strings (required, length, range, regex, email, url, phone, creditcard, equalto, fileextensions) to validator functions - these exact names are the data-val-<name> suffixes generated server-side by DefaultClientValidationService.AddAttributes.
  - path: src/Components/Web/src/Forms/InputBase.cs
    tier: essential
    role: caller
    in_diff: false
    rationale: MergeClientValidationAttributes() (line ~396-404) fetches IClientValidationService.GetClientValidationAttributes(FieldIdentifier) and merges the data-val-* attributes into AdditionalAttributes so they end up on the rendered <input>, which DomScanner.ts's validatableElementSelector then finds.
  - path: src/Components/Web/src/Forms/ValidationMessage.cs
    tier: essential
    role: caller
    in_diff: false
    rationale: RenderForClientValidation() emits data-valmsg-for and data-valmsg-replace attributes on the message <div> when an IClientValidationService is registered; ErrorDisplay.ts's findMessageElements (via DomUtils.ts) queries `[data-valmsg-for="<name>"]` to locate this exact element.
  - path: src/Components/Forms/src/ClientValidation/DefaultClientValidationService.cs
    tier: essential
    role: definition
    in_diff: false
    rationale: ComputeAttributes()/AddAttributes() reflect over DataAnnotations ValidationAttribute subclasses (Required, StringLength, Range, RegularExpression, Compare, EmailAddress, Url, Phone, CreditCard, FileExtensions) and emit the exact data-val-<name>[-param] attribute vocabulary that CoreValidators.ts's registry keys and the individual Validators/*.ts files consume.
  - path: src/Components/Forms/src/ClientValidation/IClientValidationAdapter.cs
    tier: helpful
    role: definition
    in_diff: false
    rationale: extensibility hook checked in DefaultClientValidationService.AddAttributes' default branch, letting custom ValidationAttribute subclasses emit their own data-val-* rules consumed by the same JS registry mechanism.
