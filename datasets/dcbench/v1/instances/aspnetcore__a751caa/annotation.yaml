notes: >
  Adds a new client-side validation JS/TS library (src/Components/Web.JS/src/Validation/*)
  wired into Boot.Web.ts for SSR Blazor forms; it is activated on demand when a form has
  data-val="true" fields. The nontrivial coupling is server-side: pre-existing C# code in
  src/Components/Forms/src/ClientValidation and InputBase.cs/ValidationMessage.cs already
  emits the data-val-*/data-valmsg-for HTML attribute vocabulary that this new JS scans and
  binds to by string name - none of that C# is touched by this commit but it defines the
  entire contract the new JS depends on.
