curation:
  source: TOANALYZE-2026-07-07
  n_files: 27
  description: TempData support for Blazor — cross-project feature with csproj edits
notes: >
  Adds TempData support to Blazor SSR: a cascading `ITempData` (Get/Peek/Keep,
  case-insensitive, tracks which keys survive to the next request) backed by
  a pluggable `ITempDataProvider` (cookie via `ChunkingCookieManager`+DataProtection,
  or session storage), wired in through `AddTempData()`/`TryAddCascadingValue`.
  Two shared-source files (ChunkingCookieManager, ISpanDataProtector) are newly
  pulled into the Endpoints project purely via csproj `Compile Include` with no
  textual diff of their own, so they only surface through cross-file grep, not
  the patch text.
