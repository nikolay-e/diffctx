notes: >
  Mechanical rename of the VoiceSearchKit SPM module (and its VoiceSearchCoordinator /
  NimbusFeatureFlagID.voiceSearch / nimbus-features/voiceSearchFeature.yaml call sites)
  to QuickAnswersKit / .quickAnswers / quickAnswersFeature.yaml, via git-mv-style file
  renames plus the pbxproj/test-plan bookkeeping. Verified via git grep at the pinned
  commit that every functional reference to the old names (VoiceSearchKit,
  VoiceSearchCoordinator, voiceSearchFeature, .voiceSearch) inside Swift/YAML sources is
  already covered by this commit's own 65-file diff-tree, except two auto-regenerable
  Xcode `.xcscheme` files that still say "VoiceSearchKit" (listed as forbidden, not
  gold: they don't help explain the change, they're leftover scheme cruft). No genuine
  external gold exists, so no_nontrivial_context is set instead of padding.
  string_indirection is true because the core Nimbus-flag linkage
  (`quick-answers-feature` YAML id -> generated `nimbus.features.quickAnswersFeature`
  Swift accessor) is FML-codegen-by-name, not a static reference — even though both
  sides of that link happen to already be inside this diff.
