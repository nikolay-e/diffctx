notes: >-
  Pure mechanical API rename: ComponentPlatform.cs is deleted and replaced by
  RendererInfo.cs (same shape, primary-constructor syntax), and every
  reference (ComponentBase.Platform, RenderHandle.Platform,
  Renderer.ComponentPlatform, plus the four host overrides in
  RemoteRenderer/StaticHtmlRenderer/WebAssemblyRenderer/WebViewRenderer and
  the two PublicAPI.Unshipped.txt baselines) is updated in the same commit.
  Verified via `git grep RendererInfo` and `git grep ComponentPlatform` across
  all of src at the pinned commit that no file outside the 14-file diff
  references either the old or new type/property name — the only leftover
  "ComponentPlatform" strings are an unrelated E2E test page route/name
  (src/Components/test/testassets/.../Pages/ComponentPlatform.razor,
  InteractiveHostRendermodeTest.cs's Navigate URL) that is not the renamed
  symbol. no_nontrivial_context is set accordingly; gold is the semantic core
  (type definition, the three propagation points, the four renderer-host
  overrides, and both PublicAPI baselines) rather than the three
  test-asset .razor call sites which are mechanical property-name swaps of
  the same pattern already shown in the core files.
