notes: 'Adds nvim_win_resize(win, width, height, {anchor}) letting callers choose which edge of a window stays fixed when resizing, implemented by threading a new from_top/from_left bool through win_setheight_win/win_setwidth_win and frame_setheight/frame_setwidth in window.c; nvim_win_set_height/set_width are deprecated and relocated to deprecated.c as thin from_top=true/from_left=true wrappers. Grepped the base commit for all remaining callers of the resized low-level functions (win_config.c, ex_docmd.c) and confirmed both are already updated within the 17-file diff, so the change is self-contained.'
