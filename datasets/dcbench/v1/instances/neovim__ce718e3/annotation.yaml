    reason: only updates two call sites of win_setwidth_win/win_setheight_win to pass the new trailing bool (always true/top-left), a mechanical ripple rather than part of the anchor mechanism's definition.
  - path: runtime/doc/api.txt
    reason: auto-generated help text mirroring nvim_win_resize's doc-comment already visible in src/nvim/api/window.c; adds no information beyond the source.
  - path: runtime/lua/vim/lsp/completion.lua
