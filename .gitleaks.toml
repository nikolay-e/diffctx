[extend]
useDefault = true

[allowlist]
# Paths, not fingerprints, and a directory rather than a file list. Both
# earlier forms rotted: a corpus reorganisation moved every case under
# algorithm/ infrastructure/ languages/, which left 13 of 16 path regexes and
# all 18 .gitleaksignore fingerprints matching nothing — the hook kept passing
# only because pre-commit scans changed files, so touching one fixture would
# have gone red with no working suppression. tests/cases/diff holds generated
# corpus cases whose "secrets" are synthetic by construction; detect-secrets
# scans the same tree with no exclusion and carries the real net.
paths = [
    '''datasets/dcbench/v1/instances/''',
    '''\.secrets\.baseline''',
    '''tests/cases/diff/''',
]
