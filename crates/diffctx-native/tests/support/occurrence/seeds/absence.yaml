# The name is spelled in a file of the group, and every spelling is one the
# contract explains: a comment is no occurrence, a string literal is a mention
# and a local that shadows the name is not the definition. The answer is still
# a clean absence. A language with no string class (shell: a word is code) has
# no string seed.
- name: python_comment
  family: python
  kind: comment
  files:
    shop/notes.py: |
      # total is computed elsewhere


      def note():
          return 1
- name: python_string
  family: python
  kind: string
  files:
    shop/labels.py: |
      LABEL = "total"


      def label():
          return "the total"
- name: python_local
  family: python
  kind: local
  files:
    shop/local.py: |
      def run(items):
          total = 0
          for n in items:
              total += n
          return total
- name: typescript_comment
  family: typescript
  kind: comment
  files:
    src/notes.ts: |
      // total is computed elsewhere
      export function note() {
        return 1;
      }
- name: typescript_string
  family: typescript
  kind: string
  files:
