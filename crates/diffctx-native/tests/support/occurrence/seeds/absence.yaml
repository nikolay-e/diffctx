- name: rust_local
  family: rust
  kind: local
  files:
    src/lib.rs: |
      pub mod local;
      pub mod pricing;
      pub mod util;
    src/local.rs: |
      pub fn run(items: &[i64]) -> i64 {
          let mut total = 0;
          for n in items {
              total += n;
          }
          total
      }
