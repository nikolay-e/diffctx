# One changed definition per family, with no user anywhere: the control of
# `support/families.rs`, as data, so the class tests build their seeds from the
# same file the probes of the classes read. `base` is the first commit, `change`
# the files the second one rewrites. A seed adds a user of `symbol`, or a
# mention of it, and the answer to the change is read for that file.
python:
  definition: shop/pricing.py
  symbol: total
  base:
    pyproject.toml: |
      [project]
      name = "shop"
      version = "0.1.0"
    shop/util.py: |
      def helper(x):
          return x
    shop/pricing.py: |
      def total(items):
          return sum(items)
  change:
    shop/pricing.py: |
      def total(items):
          return sum(items) * 2
typescript:
  definition: src/pricing.ts
  symbol: total
  base:
    package.json: |
      {
        "name": "shop",
        "version": "1.0.0"
      }
    tsconfig.json: |
      {
        "compilerOptions": {}
      }
    src/util.ts: |
      export function helper(x: number) {
        return x;
      }
    src/pricing.ts: |
      export function total(items: number[]) {
        return items.reduce((a, b) => a + b, 0);
      }
  change:
    src/pricing.ts: |
      export function total(items: number[]) {
        return items.reduce((a, b) => a + b, 0) * 2;
      }
