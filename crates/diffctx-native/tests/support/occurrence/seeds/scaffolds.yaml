shell:
  definition: scripts/pricing.sh
  symbol: total
  base:
    scripts/notes.sh: |
      echo notes
    scripts/pricing.sh: |
      total() {
        local sum=0
        for n in "$@"; do sum=$((sum + n)); done
        echo "$sum"
      }
  change:
    scripts/pricing.sh: |
      total() {
        local sum=0
        for n in "$@"; do sum=$((sum + n)); done
        printf '%s\n' "$sum"
      }
