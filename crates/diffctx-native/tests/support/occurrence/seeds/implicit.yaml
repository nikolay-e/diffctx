# A definition invoked without its name written: nothing in the repository
# spells a call to `symbol`, and a language construct, a framework, a runner or
# a consumer outside the repository reaches it. The answer is never "nobody
# calls it": it names the definition with the kind of the unknown, or lists it
# as an entry. Kinds are those of the `Implicit` table of the contract note;
# a kind with no seed here fails the suite.
- name: python_dunder_add
  kind: operator
  symbol: __add__
  base:
    pyproject.toml: |
      [project]
      name = "shop"
      version = "0.1.0"
    shop/money.py: |
      class Money:
          def __init__(self, cents):
              self.cents = cents

          def __add__(self, other):
              return Money(self.cents + other.cents)
    shop/checkout.py: |
      from shop.money import Money


      def charge(a, b):
          return Money(a) + Money(b)
  change:
    shop/money.py: |
      class Money:
          def __init__(self, cents):
              self.cents = cents

          def __add__(self, other):
              return Money(self.cents + other.cents + 0)
