[package]
name = "diffctx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Selects the minimum code an LLM needs to review a git diff: walks the dependency graph outward from changed lines and stops when extra context stops paying for itself"
license.workspace = true
repository.workspace = true
homepage = "https://diffctx.com/"
documentation = "https://docs.rs/diffctx"
readme = "../../README.md"
keywords = ["git", "diff", "llm", "context", "tree-sitter"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["tests/**", "examples/**"]

[lib]
name = "_diffctx"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "diffctx"
path = "src/main.rs"

[features]
default = ["lang-core", "lang-extra"]
python = ["pyo3"]

lang-core = [
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-java",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-c-sharp",
    "tree-sitter-ruby",
    "tree-sitter-php",
    "tree-sitter-bash",
    "tree-sitter-html",
    "tree-sitter-css",
    "tree-sitter-json",
    "tree-sitter-yaml",
]

lang-extra = [
    "tree-sitter-haskell",
    "tree-sitter-julia",
    "tree-sitter-ocaml",
    "tree-sitter-r",
    "tree-sitter-elixir",
    "tree-sitter-lua",
    "tree-sitter-zig",
    "tree-sitter-erlang",
    "tree-sitter-nix",
    "tree-sitter-groovy",
    "tree-sitter-objc",
    "tree-sitter-cmake",
    "tree-sitter-make",
    "tree-sitter-hcl",
    "tree-sitter-clojure",
    "tree-sitter-graphql",
    "tree-sitter-dart",
    "tree-sitter-prisma-io",
    "tree-sitter-svelte-ng",
    "tree-sitter-scala",
    "tree-sitter-swift",
    "brokk-tree-sitter-kotlin",
]

[dependencies]
diffctx-base.workspace = true
diffctx-config.workspace = true
diffctx-snapshot.workspace = true
mimalloc = { version = "0.1", default-features = false }
clap = { version = "4", features = ["derive"] }
dunce.workspace = true
tree-sitter = "0.25"
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.25", optional = true }
tree-sitter-scala = { version = "0.26", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
# The fwcd grammar (fwcd's own crate stops at 0.3.8, pinned to tree-sitter
# < 0.23, fwcd#242), as BrokkAi publishes its maintained fork with symbol-
# prefixed C exports. Exact pin: a fork's next release is reviewed, not taken.
# On a 1,036-file Kotlin codebase it lost no type declaration and broke on none;
# tree-sitter-kotlin-sg 0.4.1 silently dropped 7 classes (a bodyless
# annotated class swallowed the next one) and broke 5 Compose files, and
# tree-sitter-kotlin-ng dropped 8 and broke whole classes on `get(...)`.
brokk-tree-sitter-kotlin = { version = "=0.4.6", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-haskell = { version = "0.24", optional = true }
tree-sitter-julia = { version = "0.23", optional = true }
tree-sitter-ocaml = { version = "0.26", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
tree-sitter-r = { version = "1.2", optional = true }
tree-sitter-elixir = { version = "0.3", optional = true }
tree-sitter-lua = { version = "0.5", optional = true }
tree-sitter-zig = { version = "1.1", optional = true }
tree-sitter-erlang = { version = "0.21", optional = true }
tree-sitter-nix = { version = "0.3", optional = true }
tree-sitter-groovy = { version = "0.1", optional = true }
tree-sitter-objc = { version = "3.0", optional = true }
tree-sitter-cmake = { version = "0.7", optional = true }
tree-sitter-make = { version = "1.1", optional = true }
tree-sitter-hcl = { version = "1.1", optional = true }
tree-sitter-clojure = { version = "0.1", optional = true }
tree-sitter-graphql = { version = "0.2", optional = true }
tree-sitter-dart = { version = "0.3", optional = true }
tree-sitter-prisma-io = { version = "1.6", optional = true }
tree-sitter-svelte-ng = { version = "1.0", optional = true }
tiktoken-rs.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
# Config files read as facts, not text (#328): TOML values and sections.
toml.workspace = true
anyhow = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex.workspace = true
once_cell.workspace = true
rustc-hash.workspace = true
similar = "3"
walkdir = "2"
libc.workspace = true
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"], optional = true }
schemars.workspace = true

[dev-dependencies]
diffctx-snapshot = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
libtest-mimic = "0.8"
# Only the diffctx-test example walks case files by pattern; it rode in
# [dependencies] and shipped in the published crate for nothing.
glob = "0.3"
# The hook's command-line generator (#508), seeded and replayable.
proptest = { version = "1.12", default-features = false, features = ["std"] }

[[test]]
name = "yaml_cases"
harness = false

# Reads the sources of every crate in crates/ with the Rust grammar.
[[test]]
name = "module_graph"
required-features = ["lang-core"]

# Reads the public items of every internal crate with the Rust grammar.
[[test]]
name = "public_api"
required-features = ["lang-core"]

# The fingerprints digest the sources of the workspace path dependencies, read
# from the manifests.
[build-dependencies]
toml.workspace = true

[lints]
workspace = true
