[package]
name = "diffctx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Selects the minimum code an LLM needs to review a git diff: walks the dependency graph outward from changed lines and stops when extra context stops paying for itself"
license.workspace = true
repository.workspace = true
homepage = "https://diffctx.com/"
documentation = "https://docs.rs/diffctx"
readme = "../../README.md"
keywords = ["git", "diff", "llm", "context", "tree-sitter"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["tests/**", "examples/**"]

[lib]
name = "_diffctx"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "diffctx"
path = "src/main.rs"

[features]
default = ["lang-core", "lang-extra"]
python = ["pyo3"]

lang-core = ["diffctx-facts/lang-core"]

lang-extra = ["diffctx-facts/lang-extra"]

[dependencies]
diffctx-base.workspace = true
diffctx-occurrence.workspace = true
diffctx-resolve.workspace = true
diffctx-facts.workspace = true
diffctx-config.workspace = true
diffctx-snapshot.workspace = true
mimalloc = { version = "0.1", default-features = false }
clap = { version = "4", features = ["derive"] }
dunce.workspace = true
tiktoken-rs.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
# Config files read as facts, not text (#328): TOML values and sections.
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex.workspace = true
once_cell.workspace = true
rustc-hash.workspace = true
similar = "3"
walkdir = "2"
libc.workspace = true
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"], optional = true }
schemars.workspace = true

[dev-dependencies]
diffctx-snapshot = { workspace = true, features = ["test-support"] }
tree-sitter.workspace = true
tree-sitter-python.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-go.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-java.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-c-sharp.workspace = true
tree-sitter-ruby.workspace = true
tree-sitter-php.workspace = true
tree-sitter-scala.workspace = true
tree-sitter-swift.workspace = true
brokk-tree-sitter-kotlin.workspace = true
tree-sitter-html.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-css.workspace = true
tree-sitter-json.workspace = true
tree-sitter-haskell.workspace = true
tree-sitter-julia.workspace = true
tree-sitter-ocaml.workspace = true
tree-sitter-yaml.workspace = true
tree-sitter-r.workspace = true
tree-sitter-elixir.workspace = true
tree-sitter-lua.workspace = true
tree-sitter-zig.workspace = true
tree-sitter-erlang.workspace = true
tree-sitter-nix.workspace = true
tree-sitter-groovy.workspace = true
tree-sitter-objc.workspace = true
tree-sitter-cmake.workspace = true
tree-sitter-make.workspace = true
tree-sitter-hcl.workspace = true
tree-sitter-clojure.workspace = true
tree-sitter-graphql.workspace = true
tree-sitter-dart.workspace = true
tree-sitter-prisma-io.workspace = true
tree-sitter-svelte-ng.workspace = true
tempfile.workspace = true
libtest-mimic = "0.8"
# Only the diffctx-test example walks case files by pattern; it rode in
# [dependencies] and shipped in the published crate for nothing.
glob = "0.3"
# The hook's command-line generator (#508), seeded and replayable.
proptest = { version = "1.12", default-features = false, features = ["std"] }

[[test]]
name = "yaml_cases"
harness = false

# Reads the sources of every crate in crates/ with the Rust grammar.
[[test]]
name = "module_graph"
required-features = ["lang-core"]

# Reads the public items of every internal crate with the Rust grammar.
[[test]]
name = "public_api"
required-features = ["lang-core"]

# The fingerprints digest the sources of the workspace path dependencies, read
# from the manifests.
[build-dependencies]
toml.workspace = true

[lints]
workspace = true
