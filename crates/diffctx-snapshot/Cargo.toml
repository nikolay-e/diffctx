[package]
name = "diffctx-snapshot"
version = "2.0.0-dev.0"
edition = "2024"
rust-version = "1.85"
description = "One repository state per question: snapshot readers with admission inside, resolved ranges, the analysis context"
license = "Apache-2.0"
publish = false

[dependencies]
dunce = "1"
libc = "0.2"
rustc-hash = "2"
serde_json = "1"
thiserror = "2"
toml = "1.1"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_closure_for_method_calls = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
items_after_statements = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
implicit_hasher = "allow"
manual_let_else = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
unnested_or_patterns = "allow"
unused_self = "allow"
cargo_common_metadata = "allow"
type_complexity = "allow"
should_implement_trait = "allow"
multiple_crate_versions = "allow"
single_match_else = "allow"
new_without_default = "allow"
# Every module is private and re-exported through lib.rs; `pub(crate)` names the
# items the siblings share without exporting them.
redundant_pub_crate = "allow"
# The table lock is held on purpose while the listing is built.
significant_drop_tightening = "allow"
cognitive_complexity = "allow"

[lints.rust]
unsafe_code = "deny"
