[package]
name = "diffctx-facts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The facts layer of diffctx: a file's text into definitions, imports and references per language with tree-sitter, and the facts cache"
license.workspace = true
repository.workspace = true
homepage = "https://diffctx.com/"
readme = "../../README.md"
keywords = ["git", "diff", "llm", "context", "tree-sitter"]
categories = ["development-tools"]

[features]
default = ["lang-core", "lang-extra"]
lang-core = [
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-java",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-c-sharp",
    "tree-sitter-ruby",
    "tree-sitter-php",
    "tree-sitter-bash",
    "tree-sitter-html",
    "tree-sitter-css",
    "tree-sitter-json",
    "tree-sitter-yaml",
]
lang-extra = [
    "tree-sitter-haskell",
    "tree-sitter-julia",
    "tree-sitter-ocaml",
    "tree-sitter-r",
    "tree-sitter-elixir",
    "tree-sitter-lua",
    "tree-sitter-zig",
    "tree-sitter-erlang",
    "tree-sitter-nix",
    "tree-sitter-groovy",
    "tree-sitter-objc",
    "tree-sitter-cmake",
    "tree-sitter-make",
    "tree-sitter-hcl",
    "tree-sitter-clojure",
    "tree-sitter-graphql",
    "tree-sitter-dart",
    "tree-sitter-prisma-io",
    "tree-sitter-svelte-ng",
    "tree-sitter-scala",
    "tree-sitter-swift",
    "brokk-tree-sitter-kotlin",
]

[dependencies]
diffctx-base.workspace = true
diffctx-config.workspace = true
diffctx-snapshot.workspace = true
once_cell.workspace = true
regex.workspace = true
rustc-hash.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tree-sitter.workspace = true
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
tree-sitter-cpp = { workspace = true, optional = true }
tree-sitter-c-sharp = { workspace = true, optional = true }
tree-sitter-ruby = { workspace = true, optional = true }
tree-sitter-php = { workspace = true, optional = true }
tree-sitter-scala = { workspace = true, optional = true }
tree-sitter-swift = { workspace = true, optional = true }
brokk-tree-sitter-kotlin = { workspace = true, optional = true }
tree-sitter-html = { workspace = true, optional = true }
tree-sitter-bash = { workspace = true, optional = true }
tree-sitter-css = { workspace = true, optional = true }
tree-sitter-json = { workspace = true, optional = true }
tree-sitter-haskell = { workspace = true, optional = true }
tree-sitter-julia = { workspace = true, optional = true }
tree-sitter-ocaml = { workspace = true, optional = true }
tree-sitter-yaml = { workspace = true, optional = true }
tree-sitter-r = { workspace = true, optional = true }
tree-sitter-elixir = { workspace = true, optional = true }
tree-sitter-lua = { workspace = true, optional = true }
tree-sitter-zig = { workspace = true, optional = true }
tree-sitter-erlang = { workspace = true, optional = true }
tree-sitter-nix = { workspace = true, optional = true }
tree-sitter-groovy = { workspace = true, optional = true }
tree-sitter-objc = { workspace = true, optional = true }
tree-sitter-cmake = { workspace = true, optional = true }
tree-sitter-make = { workspace = true, optional = true }
tree-sitter-hcl = { workspace = true, optional = true }
tree-sitter-clojure = { workspace = true, optional = true }
tree-sitter-graphql = { workspace = true, optional = true }
tree-sitter-dart = { workspace = true, optional = true }
tree-sitter-prisma-io = { workspace = true, optional = true }
tree-sitter-svelte-ng = { workspace = true, optional = true }

# The facts fingerprint digests the sources of the workspace path dependencies,
# read from the manifests.
[build-dependencies]
toml.workspace = true

[lints]
workspace = true
