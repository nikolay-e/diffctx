# The oracle's corpus (T10): public repositories under permissive licences, each pinned at a commit.
# Pins were read with `git ls-remote <url> HEAD` on 2026-10-31; licences from the hosting API.
# Indexers are pinned in tools/package.json (npm, with integrity hashes in tools/package-lock.json).

[sampling]
seed = 20261031
commits = 40       # sampled commits per repository (the full corpus)
fast_commits = 10  # sampled commits per repository for the `oracle` label
history = 800      # commits back from the pin the sample is drawn from
max_code_files = 12  # a commit touching more code files says little about one definition
definitions_per_repo = 40  # `--symbol` queries per repository

[completeness]
min_file_ratio = 0.9  # an index covering fewer present code files than this is incomplete

[timeouts]
index_seconds = 1800
diffctx_seconds = 300

# Release binaries, each pinned by version and a SHA-256 per build (the digest GitHub reports for the asset).
# Read 2026-10-31 from the GitHub releases API: scip v0.10.0, rust-analyzer 2026-10-26 (weekly stable), scip-go v0.2.9,
# scip-java v0.13.2.

[tools.scip]
version = "0.10.0"
url = "https://github.com/sourcegraph/scip/releases/download/v{version}/scip-{platform}.tar.gz"
platforms = "os-arch"
archive = "tar.gz"

[tools.scip.sha256]
darwin-amd64 = "e1d5eb355e5fcfc1c6d6479dd94cb9334c24262a34e38ff514dd5a2231b779ec"  # pragma: allowlist secret
darwin-arm64 = "7ea200390e0790b3da8999b7b1cd4e3597700dcb3d354911872523bfe0090779"  # pragma: allowlist secret
linux-amd64 = "eeb28ebbff443c01609fb1691809958f3f0c7a8651af689a5bc8560061cd8ab0"  # pragma: allowlist secret
linux-arm64 = "6ab677dc2c4bf2955975d0530766152e45daaa988f9404068d8adecacd0bb24c"  # pragma: allowlist secret

[tools.rust-analyzer]
