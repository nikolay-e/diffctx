[project]
name = "diffctx-oracle"
version = "0.1.0"
description = "Independent SCIP oracle for measuring diffctx impact and symbol answers"
requires-python = ">=3.12,<3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "tree-sitter==0.25.2",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-python==0.25.0",
  "tree-sitter-typescript==0.23.2",
]

[dependency-groups]
dev = [ "pytest==9.2.0" ]

[tool.uv]
package = false

[tool.black]
target-version = [ "py312" ]
line-length = 130

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py312"
src = [ "." ]

[tool.pyproject-fmt]
column_width = 130
keep_full_version = true

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "." ]
ini_options.addopts = "-p no:cacheprovider"
