version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "10:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
    assignees:
      - "nikolay-e"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      # mcp 2.x is a breaking SDK rewrite; the <2.0 pin in pyproject.toml is a
      # deliberate compatibility decision (see the comment there). PR #219
      # widened the bound mechanically and every test matrix failed at import.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "10:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
    assignees:
      - "nikolay-e"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "10:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
    assignees:
      - "nikolay-e"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
