version: 2
updates:
  # uv.lock only. `versioning-strategy: lockfile-only` keeps this entry off
  # pyproject.toml's ranges, which the pip entry below owns — without the split
  # both ecosystems see the same pyproject and open the same PR twice.
  - package-ecosystem: "uv"
    directory: "/"
    versioning-strategy: "lockfile-only"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "10:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
    assignees:
      - "nikolay-e"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    # Raise a floor only when the declared range genuinely cannot admit the new
    # version. The default (`increase`) rewrites the floor to the newest
    # resolvable version on every run, and when that version already IS the
    # floor the rewrite is a no-op that dependabot-core raises
    # `Expected content to change!` on — numpy and scipy in the `eval`
    # dependency group hit exactly that (their newest release supporting
    # this project's `requires-python = ">=3.10"` floor is the version already
    # written there), failing every weekly pip run since 2026-08-15. Security
    # updates still get through: a fix that the range excludes IS necessary.
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "10:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
    assignees:
      - "nikolay-e"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      # mcp 2.x is a breaking SDK rewrite; the <2.0 pin in pyproject.toml is a
      # deliberate compatibility decision (see the comment there). PR #219
      # widened the bound mechanically and every test matrix failed at import.
      # `versions` in addition to `update-types`: a "update requirement" range
      # widening is not classified as semver-major (PR #224 got through), the
      # explicit range is what actually blocks it.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
        versions: [">=2.0.0"]
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "10:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
    assignees:
      - "nikolay-e"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "10:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
    assignees:
      - "nikolay-e"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
