name: eval-image

# Keeps ghcr.io/nikolay-e/diffctx-eval:latest in sync with main so
# eval-sweep never provisions against a stale or missing image (the
# May-2026 rebrand renamed the image reference without republishing it;
# every full sweep died at cloud-init for seven weeks).

'on':
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - Dockerfile.eval
      - requirements-eval.txt
      - requirements-eval.lock
      - pyproject.toml
      - src/**
      - crates/diffctx-native/src/**
      - crates/diffctx-native/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - eval/**
      - datasets/**
      - scripts/bake_eval_cache.py
      - .github/workflows/eval-image.yml

concurrency:
  group: eval-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Login to ghcr
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.eval
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/diffctx-eval:latest
            ghcr.io/${{ github.repository_owner }}/diffctx-eval:main-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/diffctx-eval:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/diffctx-eval:buildcache,mode=max
