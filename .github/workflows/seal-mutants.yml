name: seal-mutants

'on':
  push:
    branches: [ci/seal-probe]

permissions:
  contents: read

jobs:
  mutants:
    name: cargo mutants ${{ matrix.target }} ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
        target: [occurrence, answer]
        include:
          - {target: occurrence, package: diffctx-occurrence, file: 'crates/diffctx-occurrence/src/**/*.rs'}
          - {target: answer, package: diffctx-answer, file: 'crates/diffctx-answer/src/decide/**/*.rs'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"

      # Restore only: a save per shard would evict the head check's cache from the repository's
      # 10 GB, and no shard is the warm job.
      - name: Restore Cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-rust-${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-rust-${{ runner.os }}-release-
            cargo-${{ runner.os }}-

      - name: Install cargo-mutants
        run: cargo install --locked --version 27.1.0 cargo-mutants

      # Two passes. First the mutated package's own tests; then, for the mutants those left alive,
      # the integration suites that read real analyzer runs (--iterate skips what the first pass
      # caught). Mutants run in a random order and each pass has a time box, so a pass that does not
      # finish is a sample, and the outcomes say how many of the mutants it reached.
      - name: Mutate
        continue-on-error: true
        run: |
          set +e
          mkdir -p mutants-out
          timeout 40m cargo mutants --cargo-arg=--locked --in-place \
            --shard ${{ matrix.shard }}/8 --package ${{ matrix.package }} \
            --file '${{ matrix.file }}' --output mutants-out
          timeout 270m cargo mutants --cargo-arg=--locked --in-place --iterate \
            --shard ${{ matrix.shard }}/8 --package ${{ matrix.package }} \
            --file '${{ matrix.file }}' --output mutants-out -- --workspace \
            --test 'occurrence_*' --test 'class_completenes[s]' --test 'gap_reason[s]'

      - name: Keep the outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mutants-${{ matrix.target }}-${{ matrix.shard }}
          path: mutants-out
