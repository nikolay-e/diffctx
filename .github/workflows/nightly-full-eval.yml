---
name: Nightly full eval

# ci.yml already gates the full corpus per-case against
# known_below_threshold.txt and known_false_hedges.txt. This nightly
# re-runs the suite with DIFFCTX_YAML_IGNORE_BASELINE=1 to report the raw
# failure count, so baseline growth/shrinkage is tracked even when every
# per-case verdict matches the checked-in lists.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  yaml-cases-full:
    name: Full yaml_cases suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"

      # Restore only: ci.yml saves the release profile under this key, and one
      # saver per key keeps a second job from racing it. The old prefix is the
      # entry a run before the rename left.
      - name: Restore Cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-rust-${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-rust-${{ runner.os }}-release-
            cargo-${{ runner.os }}-

      # ci.yml now gates every case per-case against the two lists, so an
      # aggregate pass count no longer adds protection — it could not name the
      # regressing case anyway, and an improvement anywhere masked a regression
      # elsewhere. What is still worth a nightly is the size of the lists
      # themselves: with both bypassed, the raw failure count must not exceed
      # the names they list (read as the harness reads them), and shrinking
      # them is the visible work.
      - name: Run full yaml_cases suite with the baseline bypassed
        working-directory: crates/diffctx-native
        env:
          DIFFCTX_YAML_IGNORE_BASELINE: "1"
        run: |
          set -o pipefail
          cargo test --release --locked --test yaml_cases 2>&1 | tee full_eval.log || true
          RESULT_LINE=$(grep -E '^test result:' full_eval.log | tail -1)
          echo "Result: ${RESULT_LINE}"
          FAILED=$(echo "${RESULT_LINE}" | sed -E 's/.* ([0-9]+) failed.*/\1/')
          if ! [ "${FAILED}" -eq "${FAILED}" ] 2>/dev/null; then
            echo "Could not parse failure count from test output" >&2
            exit 1
          fi
          LISTED=$(sed -e 's/#.*//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            tests/known_below_threshold.txt tests/known_false_hedges.txt |
            grep . | sort -u | grep -c .)
          echo "Failing: ${FAILED} (the two lists name ${LISTED})"
          if [ "${FAILED}" -gt "${LISTED}" ]; then
            echo "${FAILED} cases fail, but known_below_threshold.txt and" >&2
            echo "known_false_hedges.txt name ${LISTED} — a case regressed without being recorded." >&2
            exit 1
          fi
          if [ "${FAILED}" -lt "${LISTED}" ]; then
            echo "::notice::the two lists name ${LISTED} but only ${FAILED} still fail —" \
                 "prune tests/known_below_threshold.txt or tests/known_false_hedges.txt"
          fi
