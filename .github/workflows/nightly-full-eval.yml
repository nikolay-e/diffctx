---
name: Nightly full eval

# ci.yml runs only the first 20 yaml cases (DIFFCTX_YAML_CASES_LIMIT=20);
# everything alphabetically after that never executes per-push. This job
# runs the FULL 2700+ case suite nightly and gates on the pass count so a
# ranking regression in the untested tail cannot land silently. The suite
# has a standing baseline of ~463 below-threshold cases (score < 10), so
# the gate is a minimum pass count, not a zero-failure assertion.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  yaml-cases-full:
    name: Full yaml_cases suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: "1.92.0"

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # ci.yml now gates every case per-case against
      # tests/known_below_threshold.txt, so an aggregate pass count no longer
      # adds protection — it could not name the regressing case anyway, and an
      # improvement anywhere masked a regression elsewhere. What is still worth
      # a nightly is the size of the baseline itself: with it bypassed, the raw
      # failure count must not grow, and shrinking it is the visible work.
      - name: Run full yaml_cases suite with the baseline bypassed
        working-directory: crates/diffctx-native
        env:
          DIFFCTX_YAML_IGNORE_BASELINE: "1"
        run: |
          set -o pipefail
          cargo test --release --test yaml_cases 2>&1 | tee full_eval.log || true
          RESULT_LINE=$(grep -E '^test result:' full_eval.log | tail -1)
          echo "Result: ${RESULT_LINE}"
          FAILED=$(echo "${RESULT_LINE}" | sed -E 's/.* ([0-9]+) failed.*/\1/')
          if ! [ "${FAILED}" -eq "${FAILED}" ] 2>/dev/null; then
            echo "Could not parse failure count from test output" >&2
            exit 1
          fi
          BASELINE_SIZE=$(grep -cvE '^\s*(#|$)' tests/known_below_threshold.txt)
          echo "Below threshold: ${FAILED} (baseline file lists ${BASELINE_SIZE})"
          if [ "${FAILED}" -gt "${BASELINE_SIZE}" ]; then
            echo "Below-threshold count ${FAILED} exceeds the ${BASELINE_SIZE} listed in" >&2
            echo "tests/known_below_threshold.txt — a case regressed without being recorded." >&2
            exit 1
          fi
          if [ "${FAILED}" -lt "${BASELINE_SIZE}" ]; then
            echo "::notice::${BASELINE_SIZE} baselined but only ${FAILED} still fail —" \
                 "prune tests/known_below_threshold.txt"
          fi
