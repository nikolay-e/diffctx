# .github/workflows/oracle.yml
name: oracle

# Measures diffctx against the SCIP oracle in eval/oracle: the YAML corpus, the metamorphic suite and the fault sweep,
# and one measure job per corpus repository (the names come from corpus.toml through the plan job, never from this
# file). The last job joins the parts and runs report.py with --gate: its exit is the verdict, red on a failed
# threshold, a safety row nobody decided, or a repository or language lane below the coverage floor of gates.toml.
#
# On pull_request it runs for the label `oracle` (fast subset: one repository per language, ten commits) or
# `oracle:full` (the whole corpus). A push to relay/arch runs the full set too: GitHub shares a cache only down from a
# branch to the pull requests into it, and a pull request's own entries are visible to that request alone, so that
# run is what fills the per-repository index caches every other request then restores.
# workflow_dispatch and schedule are declared for later: GitHub fires both only for a workflow file on the default
# branch.
#
# A push to a pull request cancels that request's run. A push to relay/arch never cancels the run in progress: the
# pending one is replaced by the newest, so a landing every few minutes cannot keep a three-hour measure from finishing.
#
# Every repository's job measures both budgets (default and uncapped) and the report job gates each. The index of a
# repository lives in one cache entry per change: a job restores the latest entry of its repository whatever recipe
# built it, indexes only the snapshots that are missing or failed (--retry-failed), and saves a new entry only when
# it indexed something. The measure step has its own timeout, so the index and the rows are kept when it overruns.
#
# Kotlin and Java are indexed through the repository's own build, which executes build scripts and downloaded code:
# the oracle starts it in a throwaway container (the runner's Docker) and never runs it on the runner itself. The JDKs
# the toolchains name come from actions/setup-java and reach the container by read-only mount.
#
# Nothing here has a secret. Indexing runs third-party tooling, so every job holds a read-only token that is not
# persisted into the checkout, and the oracle hands its indexers a scrubbed environment. The cargo target directory is
# never cached: the indexes alone come close to the 10 GB a repository's caches share.

'on':
  pull_request:
    types: [labeled, synchronize, reopened]
  push:
    branches: [relay/arch]
  workflow_dispatch:
    inputs:
      scope:
        description: 'fast = one repository per language, ten commits | full = the whole corpus'
        required: false
        default: fast
        type: choice
        options: [fast, full]
  schedule:
    - cron: '23 3 * * 1'

concurrency:
  group: oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'oracle')
      || contains(github.event.pull_request.labels.*.name, 'oracle:full')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: eval/oracle/uv.lock

      - name: One matrix entry per corpus repository
        id: plan
        env:
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'oracle:full') }}
          REQUESTED: ${{ github.event.inputs.scope }}
        run: |
          scope=fast
          if [ "$FULL_LABEL" = true ] || [ "$REQUESTED" = full ]; then scope=full; fi
          case "$GITHUB_EVENT_NAME" in schedule | push) scope=full ;; esac
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          matrix="$(uv run --frozen --directory eval/oracle python run.py plan --scope "$scope")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build diffctx
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"

      - name: Cache the Cargo registry (never the target directory); this is the one job that saves it
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-rust-${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-rust-${{ runner.os }}-release-
            cargo-${{ runner.os }}-

      - name: Build the release binary from this head
        run: cargo build --release --locked --bin diffctx

      - name: Hand the binary to the measure jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: diffctx-bin
          path: target/release/diffctx
          retention-days: 2
          if-no-files-found: error

  suites:
    name: YAML corpus, metamorphic and fault suites
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SCOPE: ${{ needs.plan.outputs.scope }}
      REPORT_DIR: ${{ github.workspace }}/oracle-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"

      - name: Cache the Cargo registry (never the target directory); only the build job saves it
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-rust-${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-rust-${{ runner.os }}-release-
            cargo-${{ runner.os }}-

      - name: YAML corpus (impact and symbol strata)
        env:
          DIFFCTX_ORACLE_REPORT: ${{ github.workspace }}/oracle-out/harness.json
        run: |
          mkdir -p "$REPORT_DIR"
          if [ "$SCOPE" = fast ]; then export DIFFCTX_YAML_CASES_LIMIT=48; fi
          cargo test --release --test yaml_cases 2>&1 | tee "$REPORT_DIR/yaml_cases.log"

      - name: Metamorphic suite
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$REPORT_DIR"
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = push ]; then
            export DIFFCTX_METAMORPHIC_SEED="$GITHUB_RUN_ID" DIFFCTX_METAMORPHIC_CASES=1000
            echo "metamorphic stream: seed=$DIFFCTX_METAMORPHIC_SEED cases=$DIFFCTX_METAMORPHIC_CASES"
          fi
          cargo test --release --test metamorphic 2>&1 | tee "$REPORT_DIR/metamorphic.log"

      - name: Fault sweep
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$REPORT_DIR"
          cargo test --release --test git_faults 2>&1 | tee "$REPORT_DIR/faults.log"

      - name: Hook property suite
        if: ${{ !cancelled() }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = push ]; then
            export DIFFCTX_HOOK_PROPERTY_SEED="$GITHUB_RUN_ID"
            echo "hook property stream: seed=$DIFFCTX_HOOK_PROPERTY_SEED"
          fi
          cargo test --release --test hook_property 2>&1 | tee "$REPORT_DIR/hook_property.log"

      - name: Upload the suite logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: oracle-suites
          path: |
            oracle-out/*.json
            oracle-out/*.log
          retention-days: 30
          if-no-files-found: warn

  measure:
    name: Measure ${{ matrix.repo }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Keep the oracle's cache and the binary outside the Cargo workspace
        run: |
          echo "ORACLE_CACHE=${RUNNER_TEMP}/oracle-cache" >> "$GITHUB_ENV"
          echo "DIFFCTX_BIN=${RUNNER_TEMP}/bin/diffctx" >> "$GITHUB_ENV"

      - name: Get the binary built from this head
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: diffctx-bin
          path: ${{ runner.temp }}/bin

      - name: Make it executable
        run: chmod +x "$DIFFCTX_BIN" && "$DIFFCTX_BIN" --version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: eval/oracle/uv.lock

      - name: Set up Node
        if: ${{ matrix.language == 'typescript' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - name: Install Rust
        if: ${{ matrix.language == 'rust' }}
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"

      - name: JDK 8, 11, 17 and 21 for the toolchains of the builds
        if: ${{ matrix.language == 'java' || matrix.language == 'kotlin' }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: |
            8
            11
            17
            21

      - name: Restore the latest index of this repository
        id: index-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/oracle-cache/index/${{ matrix.repo }}
          key: oracle-index-${{ matrix.repo }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: oracle-index-${{ matrix.repo }}-

      - name: Mark the moment the restored index is in place
        run: touch "$RUNNER_TEMP/index-restored"

      - name: Index and measure
        id: measure
        timeout-minutes: 320
        env:
          FAST: ${{ matrix.fast }}
        run: |
          mkdir -p "$ORACLE_CACHE"
          flags=(--retry-failed)
          if [ "$FAST" = true ]; then flags+=(--fast); fi
          uv run --frozen --directory eval/oracle python run.py lane \
            --lane "${{ matrix.lane }}" --repos "${{ matrix.repo }}" \
            --job "$RUNNER_TEMP/job" --out "$RUNNER_TEMP/part" "${flags[@]}"

      - name: What the index cache did
        id: index-changes
        if: ${{ !cancelled() }}
        env:
          MATCHED: ${{ steps.index-cache.outputs.cache-matched-key }}
        run: |
          dir="$ORACLE_CACHE/index/${{ matrix.repo }}"
          indexed="$(find "$dir" -name meta.json -newer "$RUNNER_TEMP/index-restored" 2>/dev/null | wc -l | tr -d ' ')"
          size="$(du -sh "$dir" 2>/dev/null | cut -f1)"
          echo "changed=$([ "$indexed" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ matrix.repo }}"
            echo "- index cache: ${size:-none}, restored from: ${MATCHED:-nothing}"
            echo "- snapshots indexed in this run: ${indexed}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the index when this run changed it, under a new key
        if: ${{ always() && steps.index-changes.outputs.changed == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/oracle-cache/index/${{ matrix.repo }}
          key: oracle-index-${{ matrix.repo }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the default-budget part
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: oracle-part-default-${{ matrix.repo }}
          path: ${{ runner.temp }}/part/default/${{ matrix.lane }}
          retention-days: 30
          if-no-files-found: warn

      - name: Upload the uncapped-budget part
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: oracle-part-uncapped-${{ matrix.repo }}
          path: ${{ runner.temp }}/part/uncapped/${{ matrix.lane }}
          retention-days: 30
          if-no-files-found: warn

  report:
    name: Report and gate
    needs: [plan, build, suites, measure]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: eval/oracle/uv.lock

      - name: Get the binary, the parts and the suite logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Oracle self-test
        run: |
          chmod +x "$RUNNER_TEMP/artifacts/diffctx-bin/diffctx"
          bin="$RUNNER_TEMP/artifacts/diffctx-bin/diffctx"
          uv run --frozen --directory eval/oracle python run.py selftest --bin "$bin"

      - name: Join the parts, report and gate both budgets
        env:
          ARTIFACTS: ${{ runner.temp }}/artifacts
          OUT: ${{ github.workspace }}/oracle-out
        run: |
          mkdir -p "$OUT"
          cd eval/oracle
          status=0
          for budget in default uncapped; do
            uv run --frozen python run.py merge --out "$OUT/$budget" "$ARTIFACTS"/oracle-part-"$budget"-*
            flags=(--run "$OUT/$budget")
            suites="$ARTIFACTS/oracle-suites"
            if [ "$budget" = default ]; then
              [ -f "$suites/harness.json" ] && flags+=(--harness "$suites/harness.json")
              [ -f "$suites/metamorphic.log" ] && flags+=(--metamorphic "$suites/metamorphic.log")
              [ -f "$suites/faults.log" ] && flags+=(--faults "$suites/faults.log")
            fi
            uv run --frozen python run.py report "${flags[@]}" --gate || status=1
            { echo "## Budget: $budget"; cat "$OUT/$budget/report.md"; } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: oracle-report-${{ needs.plan.outputs.scope }}
          path: |
            oracle-out/**/*.json
            oracle-out/**/*.jsonl
            oracle-out/**/*.md
          retention-days: 30
          if-no-files-found: warn
