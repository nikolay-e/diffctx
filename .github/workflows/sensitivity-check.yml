name: sensitivity-check

# Manual trigger only. Runs the Group-C parameter sensitivity analysis
# (±25% / ±50% perturbation) on a given diff range.
on:
  workflow_dispatch:
    inputs:
      diff_range:
        description: 'Git diff range (e.g. HEAD~5..HEAD)'
        required: false
        default: 'HEAD~5..HEAD'
      budget:
        description: 'Token budget for diffctx'
        required: false
        default: '4096'
      params:
        description: 'Comma-separated param list (empty = all Group-C params)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: '3.12'
          enable-cache: true

      # Installing this package compiles the native extension, so cargo must
      # be on PATH at the pinned version — same as every other job that syncs.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"

      - name: Install diffctx with dev extras
        run: |
          uv sync --locked --no-build --extra dev --extra full
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run sensitivity check
        env:
          DIFF_RANGE: ${{ inputs.diff_range }}
          BUDGET: ${{ inputs.budget }}
          PARAMS: ${{ inputs.params }}
        # `shell: bash` adds pipefail; without it the step took tee's exit
        # status and a crashed run uploaded a green report.
        shell: bash
        run: |
          ARGS=(--diff "${DIFF_RANGE}" --budget "${BUDGET}")
          [[ -n "${PARAMS}" ]] && ARGS+=(--params "${PARAMS}")
          bash scripts/sensitivity_check.sh "${ARGS[@]}" | tee sensitivity_output.txt

      - name: Upload sensitivity report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sensitivity-report-${{ github.run_id }}
          path: sensitivity_output.txt
          retention-days: 30
