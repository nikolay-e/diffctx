name: sensitivity-check

# Manual trigger only. Runs the Group-C parameter sensitivity analysis
# (±25% / ±50% perturbation) on a given diff range.
on:
  workflow_dispatch:
    inputs:
      diff_range:
        description: 'Git diff range (e.g. HEAD~5..HEAD)'
        required: false
        default: 'HEAD~5..HEAD'
      budget:
        description: 'Token budget for diffctx'
        required: false
        default: '4096'
      params:
        description: 'Comma-separated param list (empty = all Group-C params)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install diffctx with dev extras
        run: |
          uv sync --locked --extra dev --extra tree-sitter
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run sensitivity check
        env:
          DIFF_RANGE: ${{ inputs.diff_range }}
          BUDGET: ${{ inputs.budget }}
          PARAMS: ${{ inputs.params }}
        run: |
          ARGS=(--diff "${DIFF_RANGE}" --budget "${BUDGET}")
          [[ -n "${PARAMS}" ]] && ARGS+=(--params "${PARAMS}")
          bash scripts/sensitivity_check.sh "${ARGS[@]}" | tee sensitivity_output.txt

      - name: Upload sensitivity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sensitivity-report-${{ github.run_id }}
          path: sensitivity_output.txt
          retention-days: 30
