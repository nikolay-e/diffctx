name: win-debug (temporary)

'on':
  push:
    branches: [fix/windows-ci]

permissions:
  contents: read

jobs:
  neighbour:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.92.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windbg-${{ hashFiles('Cargo.lock') }}
      - name: Build
        working-directory: crates/diffctx-native
        run: cargo build --release --bin diffctx
      - name: Neighbour scenario
        shell: bash
        run: |
          bin="$PWD/target/release/diffctx.exe"
          d="$RUNNER_TEMP/nb/repo"
          mkdir -p "$d" && cd "$d"
          git init -q && git config user.email t@t && git config user.name t
          printf 'NEIGHBOR_MARKER_INITIAL = 1\n' > neighbor.py
          printf 'import neighbor\n\ndef use():\n    return neighbor.NEIGHBOR_MARKER_INITIAL\n' > app.py
          git add -A && git commit -qm initial
          printf 'import neighbor\n\ndef use():\n    return neighbor.NEIGHBOR_MARKER_INITIAL + 1\n' > app.py
          git commit -qam change
          git config -l --show-origin
          RUST_LOG=_diffctx=debug "$bin" . --diff HEAD~1 -f json 2>&1 | grep -E 'WINDBG|"path"'
          echo "--- via absolute windows root"
          RUST_LOG=_diffctx=debug "$bin" "$(cygpath -w "$d")" --diff HEAD~1 -f json 2>&1 | grep -E 'WINDBG|"path"'
