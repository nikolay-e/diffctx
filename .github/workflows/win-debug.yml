name: win-debug (temporary)

'on':
  push:
    branches: [fix/windows-ci]

permissions:
  contents: read

jobs:
  csharp:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.92.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windbg-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Build
        working-directory: crates/diffctx-native
        run: cargo test --release --test yaml_cases --no-run
      - name: C# cases through the corpus harness
        working-directory: crates/diffctx-native
        shell: bash
        run: |
          for c in csharp_dependency_injection_new csharp_abstract_class_bugfix; do
            cargo test --release --test yaml_cases -- "$c" 2>&1 \
              | grep -E "WINDBG|^test |selected|missing|  src/" | cut -c1-3000 || true
          done
