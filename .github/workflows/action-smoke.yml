# .github/workflows/action-smoke.yml
name: Action smoke

'on':
  pull_request:
    branches: ['**']
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dogfood: run the published composite action against this repository's own
  # diff so a broken flag mapping, a missing output, or a yanked pinned release
  # fails here instead of in a consumer repo.
  action-smoke:
    name: Composite action (${{ matrix.label }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: md-ego
            format: md
            scoring: ego
            budget: '6000'
            full: 'false'
          - label: json-bm25
            format: json
            scoring: bm25
            budget: '3000'
            full: 'false'
          - label: yaml-full
            format: yaml
            scoring: ego
            budget: ''
            full: 'true'
          # The legs above leave tau/alpha/timeout/output-path empty, and every
          # one of those is consumed behind an `if [ -n "$IN_X" ]` guard in
          # action.yml — so renaming --tau in the CLI kept all three green. This
          # leg is the only thing that actually threads them through.
          - label: tuned-inputs
            format: md
            scoring: ppr
            budget: '4000'
            full: 'false'
            tau: '0.05'
            alpha: '0.9'
            timeout: '300'
            output-path: tuned-context.md
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Both endpoints of the analyzed range must exist locally.
          fetch-depth: 0

      - name: Build diff context
        id: diffctx
        uses: ./
        with:
          format: ${{ matrix.format }}
          scoring: ${{ matrix.scoring }}
          budget: ${{ matrix.budget }}
          full: ${{ matrix.full }}
          tau: ${{ matrix.tau }}
          alpha: ${{ matrix.alpha }}
          timeout: ${{ matrix.timeout }}
          output-path: ${{ matrix.output-path }}

      - name: Assert the action produced usable context
        shell: bash
        env:
          CONTEXT_FILE: ${{ steps.diffctx.outputs.context-file }}
          TOKEN_COUNT: ${{ steps.diffctx.outputs.token-count }}
          BYTE_SIZE: ${{ steps.diffctx.outputs.byte-size }}
          DIFF_RANGE: ${{ steps.diffctx.outputs.diff-range }}
          EMPTY: ${{ steps.diffctx.outputs.empty }}
        run: |
          set -euo pipefail

          if [ -z "$DIFF_RANGE" ]; then
            echo "diff-range output is empty"
            exit 1
          fi

          if [ -z "$CONTEXT_FILE" ]; then
            echo "context-file output is empty"
            exit 1
          fi

          if [ ! -s "$CONTEXT_FILE" ]; then
            echo "context file '$CONTEXT_FILE' is missing or empty"
            exit 1
          fi

          case "$TOKEN_COUNT" in
            '' | *[!0-9]*)
              echo "token-count output is not a number: '$TOKEN_COUNT'"
              exit 1
              ;;
          esac

          if [ "$TOKEN_COUNT" -le 0 ]; then
            echo "token-count output must be positive, got $TOKEN_COUNT"
            exit 1
          fi

          case "$BYTE_SIZE" in
            '' | *[!0-9]*)
              echo "byte-size output is not a number: '$BYTE_SIZE'"
              exit 1
              ;;
          esac

          if [ "$EMPTY" != "true" ] && [ "$EMPTY" != "false" ]; then
            echo "empty output must be true or false, got '$EMPTY'"
            exit 1
          fi

          echo "range=$DIFF_RANGE tokens=$TOKEN_COUNT bytes=$BYTE_SIZE empty=$EMPTY"

      - name: Upload context artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: diffctx-context-${{ matrix.label }}
          path: ${{ steps.diffctx.outputs.context-file }}
          if-no-files-found: error
          retention-days: 7

  # Dogfood the *review*, not only the mechanism: the legs above prove the
  # action runs; this job produces the artifact a reviewer of THIS pull
  # request is meant to read instead of the raw diff, and pins it to the PR as
  # one sticky comment. `/qa` reads it (QA.md § Diff-context review), and a
  # selection that looks wrong on our own PRs is a product finding before any
  # consumer sees it.
  pr-review-context:
    name: Review context for this PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Build review context
        id: diffctx
        uses: ./
        with:
          format: md
          scoring: ego
          budget: '8000'

      - name: Upload review context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: diffctx-review-context
          path: ${{ steps.diffctx.outputs.context-file }}
          if-no-files-found: error
          retention-days: 14

      - name: Summarise and pin to the PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT_FILE: ${{ steps.diffctx.outputs.context-file }}
          TOKEN_COUNT: ${{ steps.diffctx.outputs.token-count }}
          DIFF_RANGE: ${{ steps.diffctx.outputs.diff-range }}
          EMPTY: ${{ steps.diffctx.outputs.empty }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker='<!-- diffctx-review-context -->'
          # The changed-files block: from its header to the first blank line
          # after the list starts (the header is followed by one blank line).
          changed=$(awk '/^\*\*Changed files:\*\*/{f=1;next}
                         f&&/^$/{if(seen)exit; next}
                         f{seen=1; print}' "$CONTEXT_FILE")
          files=$(printf '%s\n' "$changed" | grep -c . || true)
          frags=$(grep -cE '^## `' "$CONTEXT_FILE" || true)
          {
            echo "$marker"
            echo "### diffctx review context"
            echo
            echo "Range \`${DIFF_RANGE}\` — **${TOKEN_COUNT} tokens** (o200k_base)," \
                 "${frags} fragments across ${files} changed files. Empty: ${EMPTY}."
            echo
            echo "Review this instead of the raw diff: [download the context](${RUN_URL}#artifacts)" \
                 "(artifact \`diffctx-review-context\`, 14 days)."
            echo
            echo "<details><summary>Changed files as diffctx lists them (omitted = no fragment fit)</summary>"
            echo
            printf '%s\n' "$changed" | head -80
            echo
            echo "</details>"
          } > /tmp/comment.md
          cp /tmp/comment.md "$GITHUB_STEP_SUMMARY"

          # One sticky comment per PR: find ours by marker and edit it, else create.
          api="repos/${GITHUB_REPOSITORY}/issues"
          existing=$(gh api "${api}/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"${marker}\"))] | first | .id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "${api}/comments/${existing}" -F body=@/tmp/comment.md >/dev/null
          else
            gh api -X POST "${api}/${PR_NUMBER}/comments" -F body=@/tmp/comment.md >/dev/null
          fi

  # `fail-on-empty` gates whether a consumer's build breaks when a diff yields
  # no semantic context. It sits behind an `if [ "$empty" = "true" ] && ...`
  # branch in action.yml that no smoke leg ever entered, so the flag could stop
  # working with every job still green. An empty range (HEAD..HEAD) forces the
  # branch; the job passes only when the action actually fails.
  action-fail-on-empty:
    name: Composite action (fail-on-empty)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Build diff context over an empty range
        id: diffctx
        continue-on-error: true
        uses: ./
        with:
          diff-range: HEAD..HEAD
          fail-on-empty: 'true'

      - name: Assert the action reported failure
        shell: bash
        env:
          OUTCOME: ${{ steps.diffctx.outcome }}
          EMPTY: ${{ steps.diffctx.outputs.empty }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "fail-on-empty did not fail the step on an empty range (outcome=$OUTCOME)"
            exit 1
          fi
          if [ "$EMPTY" != "true" ]; then
            echo "expected empty=true on an empty range, got '$EMPTY'"
            exit 1
          fi
          echo "OK: fail-on-empty failed the step as designed"
