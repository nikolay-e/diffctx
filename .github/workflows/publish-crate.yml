# .github/workflows/publish-crate.yml
name: diffctx publish crate

permissions: {}

concurrency:
  group: publish-crate
  cancel-in-progress: false

'on':
  workflow_dispatch:
    inputs:
      version:
        description: 'Crate version to publish (must match crates/diffctx-native/Cargo.toml)'
        required: true
      ref:
        description: 'Git ref to publish from'
        required: false
        default: 'main'

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/diffctx
    permissions:
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Check Cargo.toml version matches the requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          CARGO_VERSION=$(grep -m1 -E '^version = ' crates/diffctx-native/Cargo.toml | cut -d'"' -f2)
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "Error: crates/diffctx-native/Cargo.toml has $CARGO_VERSION, requested $VERSION"
            exit 1
          fi
          echo "Publishing diffctx $VERSION"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          toolchain: '1.92.0'

      - name: Authenticate to crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5

      - name: Publish
        working-directory: ./crates/diffctx-native
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
