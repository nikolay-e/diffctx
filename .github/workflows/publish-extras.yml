# .github/workflows/publish-extras.yml
name: diffctx publish extras

permissions: {}

concurrency:
  group: publish-extras
  cancel-in-progress: false

'on':
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to publish downstream (e.g. 1.12.1)'
        required: true
      publish_npm:
        description: 'Publish the npm wrapper'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      mirror_dockerhub:
        description: 'Mirror the ghcr image to Docker Hub'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  npm:
    name: Publish npm wrapper
    if: github.event.inputs.publish_npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: v${{ github.event.inputs.version }}

      - name: Require npm token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "Error: secret NPM_TOKEN is not set; add it before publishing to npm."
            exit 1
          fi

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          mkdir -p release-binaries
          gh release download "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir release-binaries \
            --pattern 'diffctx-*-*.tar.gz' --pattern 'diffctx-*-*.zip'
          ls -la release-binaries

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Render checksums and package metadata
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          python scripts/render_packaging.py \
            --version "$VERSION" \
            --assets-dir ./release-binaries \
            --npm-checksums packaging/npm/checksums.json
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path("packaging/npm/package.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = os.environ["VERSION"]
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          cp README.md LICENSE packaging/npm/

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # The in-repo version is the literal string "0.0.0-placeholder". If the
      # patch step above is ever refactored or mis-pathed, npm publishes that
      # placeholder and exits 0 — and install.js then derives an asset name
      # with no matching checksum, so every `npx diffctx` dies. Assert before
      # the publish rather than discovering it from user reports.
      - name: Assert package version was set
        working-directory: ./packaging/npm
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          ACTUAL=$(node -p "require('./package.json').version")
          echo "package.json version: $ACTUAL (expected $VERSION)"
          test "$ACTUAL" = "$VERSION"
          test -f checksums.json
          node -e "
            const c = require('./checksums.json');
            const n = Object.keys(c).length;
            if (n === 0) { throw new Error('checksums.json is empty'); }
            for (const k of Object.keys(c)) {
              if (!k.includes(process.env.VERSION)) {
                throw new Error('checksum key does not carry the version: ' + k);
              }
            }
            console.log('checksums.json: ' + n + ' assets, all version-tagged');
          "

      - name: Publish
        working-directory: ./packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      # install.js is the script every `npx diffctx` runs, and nothing executed
      # it before this step existed. --ignore-scripts keeps npm from running
      # lifecycle scripts implicitly; the smoke then invokes install.js
      # explicitly — same script, executed as the deliberate object under test.
      - name: Smoke the published package
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          WORK=$(mktemp -d)
          cd "$WORK"
          npm init -y >/dev/null
          for attempt in 1 2 3 4 5; do
            # Sonar S8543 (unlocked dependency versions) is marked false
            # positive in SonarCloud: VERSION is the exact just-published
            # version and the package has zero dependencies.
            if npm install --ignore-scripts "diffctx@$VERSION"; then break; fi
            echo "npm registry not settled yet (attempt $attempt); retrying"
            sleep 20
          done
          node node_modules/diffctx/install.js
          ./node_modules/.bin/diffctx --version

  dockerhub:
    name: Mirror image to Docker Hub
    if: github.event.inputs.mirror_dockerhub == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Error: secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set."
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c  # v4.5.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy ghcr manifest to Docker Hub
        env:
          VERSION: ${{ github.event.inputs.version }}
          SOURCE: ghcr.io/${{ github.repository_owner }}/diffctx
          TARGET: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/diffctx
        run: |
          docker buildx imagetools create \
            -t "${TARGET}:${VERSION}" \
            -t "${TARGET}:latest" \
            "${SOURCE}:${VERSION}"
          docker buildx imagetools inspect "${TARGET}:${VERSION}"
