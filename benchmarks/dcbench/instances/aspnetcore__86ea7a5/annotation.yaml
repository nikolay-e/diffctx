gold:
  - path: src/Components/Forms/src/ClientValidation/DefaultClientValidationService.cs
    tier: essential
    role: definition
    in_diff: true
    rationale: Defines DefaultClientValidationService.ComputeAttributes/AddAttributes, the reflection-over-ValidationAttribute engine that turns DataAnnotations into data-val-* pairs; every other gold file is a caller or consumer of this logic.
  - path: src/Components/Forms/src/ClientValidation/IClientValidationService.cs
    tier: essential
    role: definition
    in_diff: true
    rationale: Declares GetClientValidationAttributes(FieldIdentifier), the contract InputBase, ValidationMessage and ValidationSummary look up via CurrentEditContext.Properties[typeof(IClientValidationService)].
  - path: src/Components/Forms/src/DataAnnotationsValidator.cs
    tier: essential
    role: config
    in_diff: true
    rationale: New EnableClientValidation parameter stores the resolved IClientValidationService into CurrentEditContext.Properties only when AssignedRenderMode is null (static SSR), which is the switch that turns the whole feature on.
  - path: src/Components/Web/src/Forms/InputBase.cs
    tier: essential
    role: caller
    in_diff: true
    rationale: New MergeClientValidationAttributes() reads the service out of EditContext.Properties and TryAdd-merges the generated data-val-* pairs into AdditionalAttributes for every input component, so developer attributes win.
  - path: src/Components/Web/src/Forms/ValidationMessage.cs
    tier: essential
    role: caller
    in_diff: true
    rationale: RenderForClientValidation() emits data-valmsg-for/data-valmsg-replace markers (using HtmlFieldPrefix.GetFieldName) that the client-side JS validator needs to locate and replace message elements.
  - path: src/Components/Web/src/Forms/ValidationSummary.cs
    tier: helpful
    role: caller
    in_diff: true
    rationale: Parallel RenderForClientValidation() path renders a data-valmsg-summary=\"true\" container with validation-summary-errors/-valid classes for the same JS validator.
  - path: src/Components/Web/src/Forms/InputRadioGroup.cs
    tier: helpful
    role: caller
    in_diff: true
    rationale: ExtractClientValidationAttributes()/InputRadioContext.ClientValidationAttributes special-cases radio groups so data-val-* is emitted on only the first <input type=radio>, mirroring MVC's FormContext behavior without an equivalent mechanism.
  - path: src/Components/Endpoints/src/DependencyInjection/RazorComponentsServiceCollectionExtensions.cs
    tier: essential
    role: config
    in_diff: true
    rationale: Adds the services.AddClientValidation() call that registers IClientValidationService/DefaultClientValidationService in the SSR endpoint's DI container; without this the service DataAnnotationsValidator looks up is never resolvable.
  - path: src/Components/Forms/src/EditContextDataAnnotationsExtensions.cs
    tier: helpful
    role: definition
    in_diff: false
    rationale: Defines EnableDataAnnotationsValidation(IServiceProvider), called unchanged in DataAnnotationsValidator.OnInitialized immediately before the new client-validation wiring, establishing the ordering the new code relies on.
  - path: src/Components/Forms/src/FieldIdentifier.cs
    tier: helpful
    role: definition
    in_diff: false
    rationale: Defines the FieldIdentifier struct (Model, FieldName) that DefaultClientValidationService keys its ConcurrentDictionary<(Type,string),...> cache on and that IClientValidationService.GetClientValidationAttributes takes as its parameter.
  - path: src/Components/Web/src/Forms/HtmlFieldPrefix.cs
    tier: helpful
    role: definition
    in_diff: false
    rationale: Defines GetFieldName(LambdaExpression), the cascaded-parameter helper ValidationMessage.RenderForClientValidation calls to compute a data-valmsg-for name consistent with nested/prefixed input names.
