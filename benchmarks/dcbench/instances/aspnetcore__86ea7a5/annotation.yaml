curation:
  source: TOANALYZE-2026-07-07
  n_files: 16
  description: '.NET side of Blazor SSR client-side validation (companion to #3)'
notes: >-
  Adds a new Microsoft.AspNetCore.Components.Forms.ClientValidation namespace that reflects over DataAnnotations
  ValidationAttributes to emit data-val-* HTML attributes for static SSR Blazor forms (no interactive render mode),
  consumed by InputBase/InputRadioGroup/ValidationMessage/ValidationSummary via a service stashed in
  EditContext.Properties. The linkage from DataAnnotationsValidator to the rendering components is a
  Properties-by-Type-keyed lookup rather than a direct reference, and the feature's whole purpose is emitting
  string-keyed data-val-* HTML attributes consumed by external, not-in-repo client-side JS — hence string indirection
  is set to true above.
