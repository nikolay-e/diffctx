  n_files: 9
  description: Add built-in EnvironmentBoundary component — compact feature
notes: >-
  Adds a Blazor EnvironmentBoundary component that conditionally renders child
  content based on IHostEnvironment.EnvironmentName (Include/Exclude lists),
  plus a WebAssemblyHostEnvironmentAdapter so IHostEnvironment resolves in
  WASM by wrapping IWebAssemblyHostEnvironment. The design and null-handling
  semantics are explicitly modeled on MVC's EnvironmentTagHelper, which is
  the key non-trivial external context. Static DI/type linkage throughout,
  no string-based indirection.
