notes: >
  Mechanically migrates ~16 lib/private classes off the deprecated IServerContainer
  (typed to the app-server-specific interface) onto the generic PSR-11
  Psr\Container\ContainerInterface, replacing ->query() calls with ->get(). Server.php's
  own DI wiring changes too: it registers a new named 'userId' service and switches
  IPreview from an explicit factory closure to registerAlias, which only works because
  PreviewManager's ?string $userId constructor param is resolved by parameter NAME
  against that new named service (Nextcloud SimpleContainer name-based DI) - hence
  string_indirection: true and PreviewManager.php as nontrivial external gold. Gold
  picks Server.php, the shared Coordinator dependency, and two representative migrated
  classes rather than all 16.
