    rationale: Defines GoogleHealthDataUpdateCoordinator/GoogleHealthActivityCoordinator/GoogleHealthBodyCoordinator that __init__.py instantiates and sensor.py subscribes to.
  - path: homeassistant/components/google_health/config_flow.py
    tier: essential
    role: definition
    in_diff: true
    rationale: Defines OAuth2FlowHandler, the config-flow entry point that creates the config entry consumed by __init__.py.
  - path: homeassistant/components/google_health/sensor.py
    tier: essential
    role: definition
    in_diff: true
    rationale: Defines GoogleHealthSensor/GoogleHealthSensorEntityDescription and ACTIVITY_SENSORS/BODY_SENSORS that turn coordinator data into entities — the user-visible payoff of the integration.
  - path: homeassistant/components/google_health/manifest.json
    tier: helpful
    role: config
    in_diff: true
    rationale: Declares domain, dependencies (application_credentials, http, webhook), iot_class and the google-health-api requirement that all other modules assume.
  - path: homeassistant/helpers/config_entry_oauth2_flow.py
    tier: essential
    role: definition
    in_diff: false
    rationale: Defines AbstractOAuth2FlowHandler, OAuth2Session, async_get_config_entry_implementation and ImplementationUnavailableError, the base OAuth machinery config_flow.py and __init__.py build on top of.
  - path: homeassistant/helpers/update_coordinator.py
    tier: helpful
    role: definition
    in_diff: false
    rationale: Defines the DataUpdateCoordinator[_DataT] base class that GoogleHealthDataUpdateCoordinator subclasses for polling/error semantics.
