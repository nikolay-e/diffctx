    tier: essential
    role: definition
    in_diff: true
    rationale: "Mounts the new `namespace` field with `resolver: Resolvers::NamespaceResolver`, the entry point for the whole namespace-query feature."
  - path: app/graphql/types/project_statistics_type.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: New `ProjectStatistics` GraphQL type exposing storage_size/repository_size/lfs_objects_size/build_artifacts_size/packages_size/commit_count.
  - path: app/graphql/types/project_type.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: Adds the `statistics` field resolved via `Gitlab::Graphql::Loaders::BatchProjectStatisticsLoader.new(obj.id).find`, wiring ProjectStatisticsType onto Project.
