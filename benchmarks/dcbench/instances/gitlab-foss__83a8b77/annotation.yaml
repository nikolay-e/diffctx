    tier: essential
    role: definition
    in_diff: false
    rationale: "Defines `all_projects` (`Project.inside_path(full_path)`) that `NamespaceProjectsResolver` calls when `include_subgroups: true`."
  - path: spec/requests/api/graphql/namespace/projects_spec.rb
