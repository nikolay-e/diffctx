notes: 'Adds the BandwidthShare HTTP filter: a per-tenant weighted-fair-share bandwidth
  limiter built on the already-landed FairTokenBucket/TokenBucketSingleton (prior
  PRs), reusing Common::StreamRateLimiter and Common::DualFactoryBase from the shared
  filter-common library. Factory is registered/looked up by the string "envoy.filters.http.bandwidth_share"
  in extensions_build_config.bzl and BandwidthShare::filterName(). The commit message
  explicitly frames BandwidthLimitFilter as the rejected-refactor-target/architectural
  ancestor, motivating its inclusion as nontrivial context despite being untouched
  by the diff.'
