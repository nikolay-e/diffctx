notes: >
  Pure code-motion refactor: ex_trust() moves from ex_cmds.c into new
  src/nvim/lua/secure.c alongside nlua_read_secure()/nlua_trust() pulled out of
  lua/executor.c; executor.c gains a get_global_lstate() accessor and un-statics
  nlua_error()/nlua_pcall() so secure.c can call them. No behavior changes.
  ex_cmds.lua is the one nontrivial (out-of-diff) file: it is the codegen source
  that wires the ':trust' command name to the ex_trust symbol via a string field,
  which is why cmdnames[] in ex_docmd.c can dispatch to the relocated function.
