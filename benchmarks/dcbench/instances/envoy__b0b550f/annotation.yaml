notes: 'Moves sslContextManager()/secretManager() accessors from TransportSocketFactoryContext
  (envoy/server/transport_socket_config.h) to ServerFactoryContext (envoy/server/factory_context.h)
  so both are reachable as server-wide resources via factory_context.serverFactoryContext().*();
  source/server/server.h (InstanceImpl) shows the move is a no-op since both accessors already
  forwarded to the pre-existing Server::Instance interface (envoy/server/instance.h, outside the
  diff). This is a wide mechanical-propagation commit (73 files: 48 test + 16 source + contrib +
  mobile) touching every call site of the old accessors; gold was curated to the ~9 files that
  define or anchor the semantic core (the interface change, its implementation, and the pre-existing
  server-wide interfaces it builds on) plus one representative call-site and one representative
  mock-restructuring file, deliberately excluding the dozens of near-identical mechanical test/BUILD
  edits.'
