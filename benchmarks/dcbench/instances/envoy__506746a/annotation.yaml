gold:
  - path: api/envoy/extensions/filters/http/file_server/v3/file_server.proto
    tier: essential
    role: definition
    in_diff: true
    rationale: Defines FileServerConfig (PathMapping, DirectoryBehavior, content_types) that config.cc/filter_config.cc parse and that filter.cc's runtime behavior implements.
  - path: source/extensions/filters/http/file_server/config.cc
    tier: essential
    role: definition
    in_diff: true
    rationale: FileServerFilterFactory::createFilterFactoryFromProtoTyped validates the proto and registers the filter via REGISTER_FACTORY(FileServerFilterFactory, NamedHttpFilterConfigFactory) — the entry point wiring config to runtime filter.
  - path: source/extensions/filters/http/file_server/filter.cc
    tier: essential
    role: definition
    in_diff: true
    rationale: FileServerFilter::decodeHeaders implements the request-handling logic (path mapping lookup, range header parsing, method checks) that is the core behavior being added.
  - path: source/extensions/filters/http/file_server/filter_config.cc
    tier: essential
    role: definition
    in_diff: true
    rationale: FileServerConfig::applyPathMapping implements the path-escape protection described in the commit message via std::filesystem::path lexically_normal checks, and builds the path_mappings_ RadixTree used by the filter.
  - path: source/extensions/filters/http/file_server/file_streamer.cc
    tier: essential
    role: definition
    in_diff: true
    rationale: FileStreamer::begin/startFile/readBodyChunk implement the async stat/open/read pipeline against AsyncFileManager that produces the streamed HTTP response.
  - path: source/extensions/filters/http/common/factory_base.h
    tier: essential
    role: definition
    in_diff: false
    rationale: Defines DualFactoryBase<ConfigProto, RouteConfigProto>, the base class FileServerFilterFactory (config.h) extends to get createFilterFactoryFromProtoTyped/createRouteSpecificFilterConfigTyped dispatch machinery.
  - path: source/extensions/filters/http/common/pass_through_filter.h
    tier: essential
    role: definition
    in_diff: false
    rationale: Defines Http::PassThroughDecoderFilter, the base class FileServerFilter (filter.h) extends so it only needs to override decodeHeaders/onDestroy.
  - path: source/extensions/common/async_files/async_file_manager.h
    tier: essential
    role: definition
    in_diff: false
    rationale: Defines the AsyncFileManager interface (stat/openExistingFile/read) that FileStreamer and FileServerConfig depend on for all non-blocking filesystem access — the whole filter's async model rests on this pre-existing abstraction.
  - path: source/common/common/radix_tree.h
    tier: helpful
    role: definition
    in_diff: false
    rationale: Defines the RadixTree template used as FileServerConfig::path_mappings_ (findLongestPrefix) for longest-prefix matching of request_path_prefix mappings; not obvious from the diff alone since it's a reused generic component.
  - path: source/extensions/filters/http/file_system_buffer/filter_config.cc
    tier: helpful
    role: cochange
    in_diff: false
    rationale: Sibling HTTP filter already using the same AsyncFileManager/async_files pattern and sharing a CODEOWNERS owner (ravenblackx) with the new filter — the closest existing architectural precedent for how to wire AsyncFileManagerFactory into an HTTP filter.
