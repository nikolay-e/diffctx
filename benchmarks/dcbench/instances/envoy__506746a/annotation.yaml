notes: >-
  Adds a new work-in-progress HTTP file-serving filter (envoy.filters.http.file_server):
  proto config with path-prefix mappings and content-type rules, a filter that resolves
  request paths against those mappings with path-escape protection, and a FileStreamer
  that streams file contents asynchronously via the existing AsyncFileManager
  abstraction. string_indirection=true because runtime filter selection goes through
  the extension/type-url string ("envoy.filters.http.file_server" in
  extensions_build_config.bzl/extensions_metadata.yaml and the proto type URL via
  REGISTER_FACTORY) rather than a static code reference.
