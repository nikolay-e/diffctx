notes: Adds a callback-registration extension point to the usb component (async_register_serial_port_scanner) so integrations like homeassistant_yellow can contribute/override synthetic serial ports (e.g. an onboard radio) merged by device path into async_scan_serial_ports results; backward compatible for the ~10 existing usb.async_scan_serial_ports callers via the preserved re-export in usb/__init__.py.
