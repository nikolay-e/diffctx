gold:
  - path: src/Components/Forms/src/EditContext.cs
    tier: essential
    role: definition
    in_diff: true
    rationale: Defines the new OnValidationRequestedAsync event, ValidateAsync, AddValidationTask, and the field/form IsValidationPending/IsValidationFaulted queries — the core of the async validation pipeline.
  - path: src/Components/Forms/src/EditContextDataAnnotationsExtensions.cs
    tier: essential
    role: caller
    in_diff: true
    rationale: The built-in DataAnnotations validator is rewired from OnValidationRequested to OnValidationRequestedAsync and calls EditContext.AddValidationTask per field via ValidationOptions.TryGetValidatablePropertyInfo — the primary consumer proving the new EditContext API is usable end to end.
  - path: src/Components/Forms/src/FieldState.cs
    tier: essential
    role: definition
    in_diff: true
    rationale: Adds PendingValidationTask, PendingValidationCts, and IsValidationFaulted per field — the storage EditContext.AddValidationTask/IsValidationPending/IsValidationFaulted read and write.
  - path: src/Components/Forms/src/ValidationRequestedEventArgs.cs
    tier: essential
    role: definition
    in_diff: true
    rationale: Adds the CancellationToken property and constructor that EditContext.ValidateAsync passes to OnValidationRequestedAsync handlers.
  - path: src/Components/Web/src/Forms/EditForm.cs
    tier: essential
    role: caller
    in_diff: true
    rationale: Form submission switches from `_editContext.Validate()` to `await _editContext.ValidateAsync()`, the concrete end-user trigger for the new async pipeline.
  - path: src/Components/Web/src/Forms/FieldCssClassProvider.cs
    tier: helpful
    role: caller
    in_diff: true
    rationale: GetFieldCssClass now calls the new EditContext.IsValidationPending/IsValidationFaulted and emits "pending"/"faulted" CSS classes, the visible UI payoff of the field-level async state.
  - path: src/Validation/src/ValidationOptions.cs
    tier: essential
    role: definition
    in_diff: true
    rationale: Adds TryGetValidatablePropertyInfo(type, propertyName, ...), the lookup EditContextDataAnnotationsExtensions uses to find a field's ValidatablePropertyInfo for async per-field validation.
  - path: src/Validation/src/ValidatableTypeInfo.cs
    tier: helpful
    role: definition
    in_diff: true
    rationale: Adds internal FindMember and SuperTypes used by ValidationOptions.TryGetValidatablePropertyInfo to resolve a property, including inherited ones.
  - path: src/Components/Web/src/Forms/Mapping/EditContextFormMappingExtensions.cs
    tier: helpful
    role: caller
    in_diff: false
    rationale: Existing subscriber to the legacy synchronous OnValidationRequested event, left unmodified by this commit — demonstrates why EditContext.cs's new XML docs explicitly say that event "remains supported for existing sync validators" instead of being replaced.
  - path: src/Validation/src/ValidatablePropertyInfo.cs
    tier: helpful
    role: definition
    in_diff: false
    rationale: Defines the ValidateAsync(object?, ValidateContext, CancellationToken) signature that EditContextDataAnnotationsExtensions.ValidateFieldAsync awaits per field; this pre-existing async contract is what makes the new per-field async path possible.
