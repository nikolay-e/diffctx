curation:
  source: TOANALYZE-2026-07-07
  n_files: 17
  description: Add async form validation in Blazor — impl+2 PublicAPI baselines
notes: 'Adds EditContext.ValidateAsync/OnValidationRequestedAsync/AddValidationTask
  so Blazor forms can run async validators (DB lookups, remote calls) per field and
  per form, tracked via FieldState and surfaced as pending/faulted CSS classes;
  wires the built-in DataAnnotations validator through the new ValidationOptions.TryGetValidatablePropertyInfo
  lookup while keeping the old synchronous OnValidationRequested event alive for
  existing subscribers like EditContextFormMappingExtensions. Wide 17-file commit
  (impl + tests + PublicAPI baselines); gold focuses on the EditContext/FieldState/ValidationOptions
  core plus the two real external consumers, excluding the ~8 in-diff test files
  which are covering tests rather than context needed to understand the change.'
