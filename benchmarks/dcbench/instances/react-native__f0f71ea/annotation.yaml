  gradle wrapper, Gemfile, README, App.tsx, etc.) that need no fragment dump at all, just a rename-list
  entry. Only ~16 files carry real path-string edits (CI configs, gitignore, jest config, package.json
  workspaces list, build.gradle relative-path fixes, Xcode project, monorepo scripts). A correct tool
  should have produced a small, cheap result here (mostly rename bookkeeping) — instead it produced nothing,
  which is the more surprising kind of hang since the actual code-comprehension surface is trivial.'
