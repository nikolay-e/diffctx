curation:
  source: TOANALYZE-2026-07-07
  n_files: 16
  description: Remove long-obsolete MVC APIs — API removal + baseline churn
notes: >-
  Removes the .NET-6-era `CompatibilityVersion` enum, `MvcCompatibilityOptions`,
  `ConfigureCompatibilityOptions<TOptions>`, both `SetCompatibilityVersion`
  extension overloads, the obsolete `ModelMetadataIdentity.ForProperty(Type,
  string, Type)` overload, and an obsolete `ImageTagHelper` constructor/props,
  migrating tests to the surviving APIs and recording every removal in
  PublicAPI.Unshipped.txt baselines. Verified via git grep at the pinned commit
  that no production callers of the removed symbols remain and that
  `ConfigureCompatibilityOptions<TOptions>` had exactly one (test-only)
  subclass before deletion, so the removal is self-contained; nontrivial gold
  is thin (1 entry) because this is intentionally dead-code excision with no
  live external consumers left to trace.
