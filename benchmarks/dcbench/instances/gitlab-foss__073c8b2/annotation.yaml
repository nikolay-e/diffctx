notes: "Adds a discussion_id argument to the createNote GraphQL mutation and a reply_id field on DiscussionType, wired through a new Discussion.lazy_find (mirroring the existing BatchModelLoader pattern) so GlobalId.object_from_id can batch-load non-AR Discussion objects; string_indirection=true because the whole mechanism hinges on GlobalID encoding the model class name as a string that object_from_id dynamically dispatches on (respond_to?(:lazy_find))."
