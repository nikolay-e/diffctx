gold:
  - path: app/graphql/gitlab_schema.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: "adds the `elsif gid.model_class.respond_to?(:lazy_find)` branch to `object_from_id`, the dispatch point that routes a Discussion global ID to `Discussion.lazy_find` instead of the AR batch loader."
  - path: app/graphql/mutations/notes/create/note.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: "the mutation itself: adds the `discussion_id` argument and `authorize_discussion!`/`create_note_params` overrides that thread `in_reply_to_discussion_id` into note creation."
  - path: app/graphql/types/notes/discussion_type.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: "adds the `reply_id` GraphQL field, computed via `::Gitlab::GlobalId.build(object, id: object.reply_id)`, which is the value clients pass back as `discussion_id`."
  - path: app/models/discussion.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: "defines `Discussion.lazy_find` (the BatchLoader-backed lookup invoked from gitlab_schema.rb) and `#reply_id`, both consumed by the GraphQL layer added in this patch."
  - path: lib/gitlab/global_id.rb
    tier: essential
    role: definition
    in_diff: true
    rationale: "new module defining `Gitlab::GlobalId.build`, needed because the GlobalID gem is hard-coded to `id`, so `DiscussionType#reply_id` uses this helper to mint a GID from `reply_id` instead."
  - path: app/graphql/mutations/notes/create/base.rb
    tier: essential
    role: definition
    in_diff: false
    rationale: "defines the original `create_note_params(noteable, args)` and `resolve` that `Notes::Create::Note#create_note_params` overrides and calls via `super(noteable, args).merge(...)`."
  - path: app/policies/note_policy.rb
    tier: helpful
    role: definition
    in_diff: false
    rationale: "defines the `:read_note` ability (via `can_read_noteable`/`enable :read_note`) checked by `authorize_discussion!`'s `Ability.allowed?(current_user, :read_note, discussion, scope: :user)`."
  - path: lib/gitlab/graphql/loaders/batch_model_loader.rb
    tier: helpful
    role: cochange
    in_diff: false
    rationale: "the pre-existing `BatchLoader.for(...).batch` pattern for AR records that `Discussion.lazy_find` mirrors for the non-AR `Discussion` class, and that the `object_from_id` `if` branch already calls."
  - path: lib/gitlab/graphql/errors.rb
    tier: helpful
    role: definition
    in_diff: false
    rationale: "defines `Gitlab::Graphql::Errors::ResourceNotAvailable`, the error class raised by `authorize_discussion!` when the user lacks `:read_note` on the discussion."
  - path: spec/requests/api/graphql/mutations/notes/create/note_spec.rb
    tier: helpful
    role: test
    in_diff: true
    rationale: "covering test for the new `discussion_id` mutation argument, exercising both the permission-denied path and the successful reply-in-discussion path end to end."
