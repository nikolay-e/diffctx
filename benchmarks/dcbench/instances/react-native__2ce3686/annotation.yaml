notes: 'A genuinely broad CI/test-infra fix spanning 40 files: renamed xcresult artifact paths in the
  GH action, an extern "C" linkage fix in RCTUtils.mm (needed so a C-linkage test symbol isn''t C++-mangled),
  and dozens of Ruby cocoapods test files with reordered assert_equal arguments plus new ObjC unit/integration
  test files. At 360/297 line changes across 40 files this is a legitimately hard, spread-out diff — but
  the tool produced nothing at all, so recall/precision are moot; the hang itself is the finding, and
  notably it fires on a mid-size diff (40 files, ~660 changed lines), disproving any theory that hangs
  are purely a function of file count or diff size.'
