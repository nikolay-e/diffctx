    rationale: Adds the full C ABI surface for tracing (envoy_dynamic_module_on_tracer_*, envoy_dynamic_module_callback_tracer_* and the metrics-define/increment callbacks) that both the C++ driver and the Rust SDK bind against.
  - path: source/extensions/dynamic_modules/sdk/rust/src/tracer.rs
    tier: essential
    role: definition
    in_diff: true
    rationale: New Rust SDK module implementing the tracer side of the same ABI (TracerConfigContext, metric handles, NewTracerConfigFunction) so Rust dynamic modules can implement tracers.
