  description: New dynamic_modules tracing extension (C++/C/Rust + api + docs + changelog)
notes: >-
  Adds a new "envoy.tracers.dynamic_modules" tracer extension: a proto (DynamicModuleTracer), a
  C++ Driver/Span implementation that bridges to a new tracer section of the dynamic-modules C ABI
  (span lifecycle, trace-context get/set/remove, metrics define/increment), and a matching Rust SDK
  module. string_indirection=true because the metrics_namespace stat-prefix behavior and the
  dynamic_modules_strip_custom_stat_prefix runtime guard are both looked up by string name.
