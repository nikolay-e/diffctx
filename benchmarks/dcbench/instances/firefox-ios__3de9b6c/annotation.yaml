notes: Relocates `URLSessionProtocol`/`URLSessionDataTaskProtocol` from the app target into the BrowserKit `Shared` package (made `public`) and moves `MockURLSession` into a new `TestKit` target, updating `Package.swift` dependencies and pruning the stale Xcode project entries; three ClientTests files gain `import TestKit` to keep using the relocated mock. Linkage throughout is static Swift import/type-checking (protocol conformance, SPM target dependencies) — no string-keyed indirection is load-bearing here, so string_indirection is false despite the project.pbxproj edits (those are Xcode's internal UUID bookkeeping, not a design-level string linkage).
