notes: 'Textbook #65 over-selection: this is a pure deletion commit (removes the OSSLibraryExample sample
  package, 197 insertions/2202 deletions across 59 files) yet diffctx pulled in 128 ctx_files -- more
  than double the files actually in the diff -- and produced 48,556 md tokens. The head of ctx.md correctly
  lists changed/deleted files, but then dumps the ENTIRE 180-line .gitignore and multiple 400-line Podfile.lock
  windows verbatim for what are tiny line-level edits, and beyond that pulls in dozens of files with no
  relation to the change at all (a vendored third-party debugger bundle, unrelated Jest mocks, a community
  popup-menu package, markdownlint config, random C++ test files). Recall on the actually-relevant files
  is fine (they''re all present), but precision is severely damaged -- the bulk of the token budget is
  noise a reader would have to wade through to find the 8 files that matter.'
