curation:
  source: TOANALYZE-2026-07-07
  n_files: 4484
  description: Move connect server and common to builtin module (extreme-stress mega-restructure)
notes: >-
  Moves `connector/connect/server` and `connector/connect/common` to `connect/server`/
  `connect/common` and removes the Maven `-Pconnect` build profile gate, so Spark
  Connect ships built-in and end users no longer need `--packages`/`-Pconnect`. Of
  ~4484 changed paths, all but ~26 are pure 100%-similarity `git mv` directory renames
  with byte-identical content (verified via `git show --summary`); the real semantic
  content is the handful of build/classpath/doc files that stop gating Connect behind
  a profile or auto-discovering its jars at runtime. Deliberately did not gold any of
  the thousands of renamed source files — they carry zero information about *why* or
  *how* the move works, only *that* files moved (already fully captured by `pom.xml`).
  string_indirection is true because module wiring (pom.xml module list,
  AbstractCommandBuilder's project-name list, dev/sparktestsupport's
  `source_file_regexes`) all key on plain path/profile-name strings rather than static
  code references.
