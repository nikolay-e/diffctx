gold:
  - path: pom.xml
    tier: essential
    role: config
    in_diff: true
    rationale: Moves `<module>connect/server</module>`/`<module>connect/common</module>` out from among the optional connector modules into the always-built reactor module list — the actual mechanism making the server "builtin" instead of opt-in.
  - path: assembly/pom.xml
    tier: essential
    role: config
    in_diff: true
    rationale: Deletes the `<profile id="connect">` entirely and makes `spark-connect`/`spark-avro`/`spark-protobuf` plain default dependencies of the assembly jar, so Spark Connect ships in every build instead of requiring `-Pconnect`.
  - path: dev/sparktestsupport/modules.py
    tier: essential
    role: config
    in_diff: true
    rationale: Drops `build_profile_flags=["-Pconnect"]` from the `connect` test `Module`, matching the module no longer being profile-gated, and updates `source_file_regexes` to also match the new `connect` path prefix.
  - path: launcher/src/main/java/org/apache/spark/launcher/AbstractCommandBuilder.java
    tier: essential
    role: definition
    in_diff: true
    rationale: Adds `"connect/common"`/`"connect/server"` to the bootstrap classpath project list, with an explicit skip ("Do not use locally compiled class files for Spark server because it should use shaded dependencies") — the runtime-classpath half of making Connect builtin.
  - path: python/pyspark/sql/connect/session.py
    tier: essential
    role: caller
    in_diff: true
    rationale: Removes the `search_jar("connector/connect/server", ...)`/`addJarToCurrentClassLoader` workaround that used to locate and inject Connect server jars at runtime — no longer needed now that they are always on the classpath.
  - path: repl/src/main/scala/org/apache/spark/repl/Main.scala
    tier: essential
    role: caller
    in_diff: true
    rationale: Removes the `ClassNotFoundException` handler that told shell users "You need to build Spark with -Pconnect", since `SparkConnectPlugin` is now always resolvable.
  - path: docs/building-spark.md
    tier: helpful
    role: doc
    in_diff: true
    rationale: Deletes the "Building with Spark Connect support" section documenting `./build/mvn -Pconnect ...`, the user-facing confirmation that this build flag is obsolete.
  - path: .github/workflows/build_and_test.yml
    tier: helpful
    role: config
    in_diff: true
    rationale: Updates the buf breaking-change-detection `input:` path from `connector/connect/common/src/main` to `connect/common/src/main`, CI's awareness of the new module location.
