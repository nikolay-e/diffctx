gold:
  - path: src/nvim/generators/gen_api_dispatch.lua
    tier: essential
    role: definition
    in_diff: true
    rationale: 'core of the change: instead of emitting only funcs_metadata.generated.h, it now assembles ONE combined msgpack blob (version + functions + ui_events + ui_options + error_types + types) via a hand-rolled fixdict()/put() emitter for reproducible builds, embeds it as `packed_api_metadata`, and extracts `ui_options` by regex-scanning the ui_ext_names array text out of one of the ${API_HEADERS} it is fed.'
  - path: src/nvim/api/private/helpers.c
    tier: essential
    role: definition
    in_diff: true
    rationale: 'api_metadata() changes from building a Dictionary at runtime (piecing together version_dict()/unpack(funcs_metadata)/unpack(ui_events_metadata)/ui_options_metadata()/error_type_metadata()/type_metadata()) to simply unpacking the single `packed_api_metadata` blob; new api_metadata_raw() exposes the raw bytes directly for `--api-info`.'
  - path: src/nvim/CMakeLists.txt
    tier: essential
    role: config
    in_diff: true
    rationale: 'wires FUNCS_METADATA/UI_METADATA build variables and the new NVIM_VERSION_LUA configure_file() step into the dispatch-generator custom command; its UNCHANGED line 347 `file(GLOB API_HEADERS CONFIGURE_DEPENDS api/*.h)` only globs headers directly under src/nvim/api/ — this is the reason ui_ext_names had to move from src/nvim/ui.h into the new src/nvim/api/ui.h for gen_api_dispatch.lua''s regex scan to find it.'
  - path: src/nvim/api/ui.h
    tier: essential
    role: definition
    in_diff: true
    rationale: 'new home of the `ui_ext_names[]` array (moved out of src/nvim/ui.h) precisely so it falls under the `api/*.h` glob that becomes part of ${API_HEADERS}, which gen_api_dispatch.lua text-scans with `string.match(text, ''ui_ext_names%[][^{]+{([^}]+)}'')` to build the `ui_options` metadata list.'
  - path: src/nvim/generators/nvim_version.lua.in
    tier: essential
    role: definition
    in_diff: true
    rationale: 'new CMake-configured template (`{"major", ${NVIM_VERSION_MAJOR}}, ...`) that becomes `require ''nvim_version''` inside gen_api_dispatch.lua, replacing the runtime C version_dict()/#define NVIM_API_LEVEL approach with a build-time-baked Lua version table.'
  - path: src/nvim/main.c
    tier: helpful
    role: caller
    in_diff: true
    rationale: '--api-info handling switches from packing a Dictionary via msgpack_rpc_from_object/msgpack_packer to calling api_metadata_raw() and file_write()-ing the bytes directly, the reason msgpack_file_write() in fileio.c becomes dead code and is deleted.'
  - path: src/nvim/generators/gen_api_ui_events.lua
    tier: helpful
    role: definition
    in_diff: true
    rationale: no longer wraps its output with dump_bin_array()/a named C symbol; now writes the raw mpack.encode(exported_events) bytes directly to ${UI_METADATA}, which gen_api_dispatch.lua later splices verbatim into the combined blob via `io.open(ui_metadata_inputf, ''rb''):read(''*all'')`.
