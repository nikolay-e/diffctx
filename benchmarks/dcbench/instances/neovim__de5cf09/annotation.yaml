notes: 'Consolidates API metadata generation (function signatures, ui_events, ui_options, error_types, types, version info) from several separately-packed C-embedded msgpack blobs assembled at C runtime into a single build-time-assembled blob (packed_api_metadata) emitted by gen_api_dispatch.lua, which C now just unpacks or serves raw. This forces two structural moves: ui_ext_names from src/nvim/ui.h to the new src/nvim/api/ui.h (to fall under the CMakeLists.txt api/*.h glob the generator scans) and version info from a runtime version_dict() into a build-time-configured nvim_version.lua.in template. All 17 touched files were confirmed self-contained via grep for other callers of the removed functions (msgpack_file_write, version_dict, api_metadata) at the base commit.'
