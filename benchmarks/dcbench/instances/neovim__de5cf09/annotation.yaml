  - path: cmake.config/versiondef.h.in
    reason: drops the now-unused NVIM_API_LEVEL/_COMPAT/_PRERELEASE #defines from a C header template; the replacement mechanism (nvim_version.lua.in) is the file that actually explains where those values now live.
