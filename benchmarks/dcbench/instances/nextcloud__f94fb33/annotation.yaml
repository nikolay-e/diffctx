  description: Move IToken and IProvider::getToken to OCP — compact private→public interface promotion
notes: >
  Promotes the app-private Authentication\Token\IToken interface to OCP verbatim (the
  private one becomes a thin 'extends' BC shim) and adds IProvider::getToken() to OCP,
  copying the exact signature/docblock already present on the private IProvider
  interface. Neither the private IProvider interface nor its concrete implementers
  (PublicKeyTokenProvider, Manager) are touched by this diff, but they are essential
  nontrivial context: the private IProvider is the literal source of the copied method
  declaration, and PublicKeyTokenProvider is the class that actually answers getToken()
  calls made through the newly-public interface.
