notes: 'Exposes the existing JVM resource-allocation API (SparkContext.resources / TaskContext.resources(), backing GPU/FPGA-aware scheduling) to Python via a new JavaSparkContext.resources bridge and a matching binary wire protocol between PythonRunner.scala (writer) and worker.py (reader). Linkage is by direct method/name correspondence (py4j attribute calls, positional binary fields), not by dynamic string dispatch, so string_indirection is false. The three pre-existing JVM definitions (ResourceInformation, TaskContext.resources, SparkContext.resources) are the nontrivial external context this new plumbing exposes.'
