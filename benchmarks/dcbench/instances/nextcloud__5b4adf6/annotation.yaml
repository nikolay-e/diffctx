notes: >
  Wide (42-file) but largely mechanical refactor: unifies two ways of accessing theme
  defaults (\OC_Defaults directly vs OCP\Defaults) by extending OCP\Defaults with the
  missing proxy methods and DI-registering it as Defaults::class (wrapping
  getThemingDefaults()/ThemingDefaults, which extends OC_Defaults), then repointing
  ~15 call sites' constructor type-hints from \OC_Defaults to OCP\Defaults. Gold picks
  the semantic core (the two class definitions + Server.php DI wiring) plus a handful
  of representative call sites rather than every renamed file, per the wide-diff rule.
