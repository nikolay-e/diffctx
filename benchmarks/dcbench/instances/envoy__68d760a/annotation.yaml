notes: >-
  Adds a new envoy.filters.listener.set_filter_state listener filter that lets many
  filter chains share one instance for setting connection filter state on accept,
  reusing the existing Filters::Common::SetFilterState::Config machinery already
  used by the http and network set_filter_state filters. It also relocates the
  setListenerInfo() call from ActiveStreamListenerBase::newConnection into the
  ActiveTcpSocket constructor so listener metadata (e.g. %METADATA(LISTENER:...)%)
  is available during listener-filter onAccept, which is the mechanism the new
  filter's integration test exercises.
