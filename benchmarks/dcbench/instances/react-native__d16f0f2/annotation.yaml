  Compounding it, podspec/build files again get full-file dumps (React-RCTFabric.podspec:1-106, build.gradle.kts:401-600)
  for one-line dependency additions. Despite the noise, the actually-relevant EventLogger/EventDispatcher/EventPerformanceLogger/PerformanceEntryReporter
  files are present, so recall on the core semantic change is reasonable even though precision is very
  low.'
