notes: >
  Reworks the preview subsystem's DB layout: drops the per-row storage_id column in
  favor of a shared preview_locations table (bucket/object-store resolved once and
  referenced by id), and simplifies preview migration to just update DB rows instead of
  physically copying/moving files, deleting the now-unneeded
  ObjectStorePreviewCacheMountProvider virtual-mount mechanism entirely. All linkage
  (schema, entity, mapper, the two storage backends, generator, and the migration job)
  is contained within the diff via direct method/property references, no string-keyed
  indirection.
