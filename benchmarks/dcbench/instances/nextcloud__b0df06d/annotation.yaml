notes: >
  Removes jQuery, jQuery UI, select2, snap.js and strengthify entirely from Nextcloud's
  core frontend, deleting core/src/jquery/** and its CSS/vendor assets, dropping the
  npm dependencies and the webpack ProvidePlugin that globally exposed jQuery, and
  switching BeforeTemplateRenderedListener's Util::addScript() call from the deleted
  jQuery-bundling 'merged-template-prepend' script to the pre-existing 'mimetypelist'
  script (a string-keyed script-name match against the build's core.json manifest,
  hence string_indirection). Fully self-contained deletion; no external nontrivial
  context needed beyond noting the pre-existing 'mimetypelist' entry point.
