notes: '0-byte ctx.md/md.err, rc_md=142. This is a pure package rename (src/sentry/performance_issues
  -> src/sentry/issue_detection, 51 file renames touching 74 files) where nearly every file''s diff is
  identical in shape: update a handful of ''from sentry.performance_issues...'' imports to ''from sentry.issue_detection...''
  plus reorder. A correct tool ideally recognizes this repetitive pattern and represents it compactly
  (rename-map + 2-3 representative examples + the handful of files with real non-import changes like pyproject.toml''s
  mypy module list and CODEOWNERS) rather than fragmenting all 74 similarly-shaped diffs — but since nothing
  was produced, that design question is untested here. Nothing in this commit''s content looks large or
  unusual (234 net changed lines across 74 small files), reinforcing that the hang is not obviously diff-content-driven.'
