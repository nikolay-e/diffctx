  description: Move pyspark.ml.remote to pyspark.ml.connect (pure Python package rename)
notes: >-
  Despite the curation label "pure package rename", this is actually a split: `proto.py`/
  `serialize.py`/`readwrite.py` are pure renames from `pyspark.ml.remote` to
  `pyspark.ml.connect`, but `remote/util.py`'s decorator functions
  (`try_remote_fit`, `try_remote_call`, etc.) are merged into the pre-existing
  `pyspark.ml.util`, while only `_extract_id_methods` moves into
  `pyspark.ml.connect.util`. Verified via diff that `wrapper.py`/`classification.py`
  (the two real callers of `try_remote_*`) both switch their import to `pyspark.ml.util`,
  not `pyspark.ml.connect.util`, confirming the asymmetric destination.
  string_indirection is true because `python/packaging/*/setup.py` list packaged
  modules as dotted-path strings (`"pyspark.ml.remote"`), not static imports.
