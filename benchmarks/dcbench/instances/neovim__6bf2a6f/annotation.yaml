notes: 'Removes the two-wrapper try_start()/try_end() vs try_enter()/try_leave() split (the former did not restore trylevel/msg_list, deemed dangerous for api-fast functions) and converts every remaining try_start() call site across api/*.c, ex_getln.c, lua/stdlib.c and option.c to the single TRY_WRAP macro. Grepped the base commit for any try_start/try_end callers outside the 10-file diff and found none, so the change is fully self-contained with no external nontrivial context.'
