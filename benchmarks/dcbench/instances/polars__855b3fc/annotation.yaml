gold:
  - path: py-polars/polars/_utils/serde.py
    tier: essential
    role: definition
    in_diff: true
    rationale: New shared serialize_polars_object() helper (file/StringIO/BytesIO/path dispatch) used identically by DataFrame.serialize, Expr.meta.serialize, and LazyFrame.serialize — the common plumbing this commit factors out.
  - path: py-polars/polars/type_aliases.py
    tier: essential
    role: definition
    in_diff: true
    rationale: Adds the SerializationFormat = Literal["binary", "json"] type alias referenced by every serialize/deserialize signature touched in this commit.
  - path: py-polars/src/dataframe/serde.rs
    tier: essential
    role: definition
    in_diff: true
    rationale: New PyDataFrame serde module splitting the old single serialize()/deserialize() into serialize_binary/serialize_json (ciborium vs serde_json) and deserialize_binary/deserialize_json, with binary now the default; also relocates the pre-existing pickle __getstate__/__setstate__ here.
  - path: py-polars/polars/dataframe/frame.py
    tier: essential
    role: definition
    in_diff: true
    rationale: DataFrame.serialize/deserialize gain a format="binary" (default) parameter and select between self._df.serialize_binary/serialize_json based on it — the representative example of the format-selection pattern applied identically to Expr and LazyFrame.
  - path: crates/polars-core/src/datatypes/_serde.rs
    tier: essential
    role: definition
    in_diff: true
    rationale: Fixes Wrap<Utf8ViewArray>'s Deserialize impl to collect owned String instead of borrowed &str — required for the new ciborium (non-self-describing/streaming) binary deserializer to work, unlike serde_json which could borrow from the input buffer.
  - path: py-polars/tests/unit/dataframe/test_serde.py
    tier: essential
    role: test
    in_diff: true
    rationale: Rewrites DataFrame serde tests to cover both binary (default) and json formats and round-trip through deserialize(format=...).
  - path: py-polars/polars/expr/meta.py
    tier: helpful
    role: definition
    in_diff: true
    rationale: Applies the identical format-selection pattern to Expr.meta.serialize/deserialize (self._pyexpr.serialize_binary/serialize_json), confirming the change is symmetric across DataFrame/Expr/LazyFrame rather than DataFrame-specific.
  - path: py-polars/polars/lazyframe/frame.py
    tier: helpful
    role: definition
    in_diff: true
    rationale: Applies the identical format-selection pattern to LazyFrame.serialize/deserialize, the third of the three symmetric call sites.
