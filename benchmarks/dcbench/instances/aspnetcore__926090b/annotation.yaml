    rationale: "Defines `public class WebHostBuilder : IWebHostBuilder` and is the single symbol the patch decorates with `[Obsolete(\"...\", DiagnosticId = \"ASPDEPR004\")]` — every other file in the diff exists only to react to this attribute."
  - path: src/DefaultBuilder/src/WebHost.cs
    tier: essential
    role: caller
    in_diff: true
    rationale: "`WebHost.CreateDefaultBuilder` — the most widely used entry point in the framework — does `var builder = new WebHostBuilder();` internally, so it needed `#pragma warning disable ASPDEPR004` to keep compiling; shows the obsoletion reaches into first-party framework code, not just tests."
  - path: src/Hosting/TestHost/test/TestServerTests.cs
    tier: essential
    role: test
    in_diff: true
    rationale: "Largest rewritten file (494 lines) demonstrating the dominant migration pattern in this sweep: replacing `new TestServer(new WebHostBuilder()...)` with `new HostBuilder().ConfigureWebHost(wb => wb.UseTestServer()....).Build()` to avoid triggering ASPDEPR004."
  - path: src/Hosting/Hosting/test/WebHostBuilderTests.cs
    tier: essential
    role: test
    in_diff: true
    rationale: "Tests WebHostBuilder itself, so it cannot migrate away from it; instead wraps `new WebHostBuilder()` calls in `#pragma warning disable/restore ASPDEPR004`, illustrating the alternative (suppress-in-place) strategy used where the obsolete type is the thing under test."
  - path: src/Hosting/TestHost/src/WebHostBuilderExtensions.cs
    tier: helpful
    role: definition
    in_diff: false
    rationale: "Defines the `UseTestServer(this IWebHostBuilder builder, ...)` extension method that every migrated test in this patch now calls inside `ConfigureWebHost(...)` instead of constructing `TestServer` from a `WebHostBuilder` directly."
  - path: src/Hosting/TestHost/src/HostBuilderTestServerExtensions.cs
    tier: helpful
    role: definition
    in_diff: false
    rationale: "Defines `GetTestServer(this IHost host)`, the method every migrated test calls after `host.Build()`/`host.StartAsync()` to retrieve the `TestServer` — the other half of the HostBuilder-based replacement pattern for the obsoleted `new TestServer(webHostBuilder)` constructor."
  - path: src/Hosting/TestHost/src/TestServer.cs
    tier: helpful
    role: definition
    in_diff: false
    rationale: "Defines `public TestServer(IWebHostBuilder builder)`, the constructor overload that would now emit ASPDEPR004 when called with `new WebHostBuilder()`; explains precisely why so many TestHost tests were rewritten to go through `HostBuilder`/`GetTestServer` instead of calling this constructor directly."
