notes: "Adds [Obsolete(DiagnosticId=\"ASPDEPR004\")] to WebHostBuilder (part of an established ASPDEPR00x deprecation-attribute convention already used elsewhere in the repo for other APIs) and then updates ~20 dependent files: framework code that constructs WebHostBuilder internally gets #pragma suppression, while most TestHost-based tests are rewritten to use HostBuilder+ConfigureWebHost+UseTestServer+GetTestServer instead of `new TestServer(new WebHostBuilder())`, which is the pattern shown by the three 'helpful' definition files."
