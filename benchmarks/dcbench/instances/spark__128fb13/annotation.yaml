notes: >-
  Kicks off a JDBC driver for Spark Connect: a brand-new `sql/connect/client/jdbc`
  Maven/SBT module with a stub `java.sql.Driver` implementation (`connect` throws
  "TODO(SPARK-53934)"; only URL-acceptance and self-registration are implemented so
  far) plus the Maven/SBT/assembly build wiring to package and ship its jar. Every file
  in the diff is new, so all context needed to understand the change is self-contained
  within it — no_nontrivial_context is set. string_indirection is true because the JDBC
  `ServiceLoader` mechanism (`META-INF/services/java.sql.Driver`) links `DriverManager`
  to `SparkConnectDriver` purely by a fully-qualified class-name string, not a static
  reference.
