notes: 'This RNGP autolinking restructure is a genuine 103-file change (dir move + real Kotlin logic),
  and renames are handled correctly (old->new mapping shown, full content present for renamed files like
  ReactExtension.kt) giving strong recall. However cross-checking file-for-file against truth.diff shows
  real noise: dozens of unrelated package.json files from packages that were never touched (asset-utils,
  community-cli-plugin, debugger-frontend, jest-preset, metro-config, etc.) and unrelated native JSI/TurboModule
  core files (jsi.cpp, TurboModule.h, NativeToJsBridge.cpp) got pulled in alongside the real gradle-plugin
  restructure. Whole-file dumps (e.g. entire 165-line .gitignore for a 1-line deletion) also inflate tokens
  beyond what the actual diff needs.'
