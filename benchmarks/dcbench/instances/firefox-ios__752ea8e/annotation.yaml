notes: Adds 1Password/LastPass/Bitwarden autofill support to focus-ios's share sheet by turning OpenUtils into a stateful UIActivityItemSource wired to WebViewController's OnePasswordExtension calls, plus the Info.plist URL-scheme entry and Carthage/pbxproj plumbing needed to link the new framework. Searched for callers/tests/consumers outside the diff (createPasswordManagerExtensionItem, fillPasswords, the new Telemetry constants, isPasswordManagerActivityType strings) and found none — this repo has no unit tests covering share-sheet/password-manager logic, so all gold is necessarily in-diff, hence nontrivial_gold_count is zero.
