notes: >-
  Purely additive commit introducing the Ecto schemas for SSO on top of a
  migration landed in the immediately preceding commit
  (20250520084130_add_sso_tables_columns.exs): a polymorphic Integration
  schema (config currently only supports :saml via SAMLConfig), a Domain
  schema for per-domain validation tracking, new on_ee fields on User, and
  an embedded team-wide Policy schema on Team. Adds the polymorphic_embed
  hex dependency to support the dynamically-typed :config embed.
  string_indirection is true because polymorphic_embeds_one dispatches on
  the stored __type__ atom (:saml) via the types: [saml: SSO.SAMLConfig]
  keyword list, not a static module reference.
