notes: 'Correctly identifies 62/79 fragments as changed and surfaces the handful of files with real logic
  (RCTAppDelegate.mm removing the @available(iOS 13.0) branch, RCTImageView.mm dropping the #if/@available
  guard) alongside the podspec version bumps. The 48,930-token cost is high relative to an 884-line diff
  (330+/554-) because ~60 near-identical podspec files each get a full boilerplate Pod::Spec dump for
  a single changed line — this is the over-selection pattern (#65) manifesting as repeated near-duplicate
  context rather than unrelated files. md_tokens < yaml_tokens here, and Markdown''s prose framing reads
  more efficiently than YAML for this many small text-only fragments.'
