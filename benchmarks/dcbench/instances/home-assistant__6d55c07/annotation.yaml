gold:
  - path: homeassistant/components/usb/utils.py
    tier: essential
    role: definition
    in_diff: false
    rationale: Defines async_scan_serial_ports/scan_serial_ports, the new shared USB helper that every touched integration now calls instead of serial.tools.list_ports.comports; also folds the removed get_serial_by_id by-id resolution into scan_serial_ports itself.
  - path: homeassistant/components/usb/models.py
    tier: essential
    role: definition
    in_diff: false
    rationale: Defines the USBDevice/SerialDevice dataclasses returned by async_scan_serial_ports that every changed config_flow.py now type-checks against with isinstance(port, usb.USBDevice) instead of using pyserial's ListPortInfo.
  - path: homeassistant/components/aurora_abb_powerone/config_flow.py
    tier: essential
    role: definition
    in_diff: true
    rationale: Simplest representative instance of the sweep - replaces sync scan_comports()/serial.tools.list_ports with async_scan_comports() calling usb.async_scan_serial_ports(hass), and adds usb as a manifest dependency.
  - path: homeassistant/components/dsmr/config_flow.py
    tier: essential
    role: definition
    in_diff: true
    rationale: Representative instance showing the broader simplification - deletes the local get_serial_by_id() helper entirely because /dev/serial/by-id resolution now happens inside usb.async_scan_serial_ports.
  - path: homeassistant/components/crownstone/helpers.py
    tier: helpful
    role: definition
    in_diff: true
    rationale: Shows the type migration beyond the call site - list_ports_as_str is retyped from Sequence[ListPortInfo] to Sequence[USBDevice] and drops manual hex-formatting of vid/pid now that USBDevice stores them pre-formatted.
  - path: tests/components/dsmr/test_config_flow.py
    tier: helpful
    role: test
    in_diff: true
    rationale: Covering test for the pattern - patches homeassistant.components.dsmr.config_flow.usb.async_scan_serial_ports instead of serial.tools.list_ports.comports and deletes test_get_serial_by_id* now that the helper moved into the usb component.
