notes: 'Migrates ~6 integrations off direct pyserial (serial.tools.list_ports) onto the shared homeassistant.components.usb async helper (async_scan_serial_ports returning USBDevice/SerialDevice), which also absorbs the get_serial_by_id by-id resolution previously duplicated per-integration. Gold picks the semantic core (usb helper definitions + 2 representative integrations) rather than all ~15 near-identical call sites, per protocol guidance for wide diffs.'
