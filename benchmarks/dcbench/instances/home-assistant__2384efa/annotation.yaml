notes: 'Scaffolding commit: introduces the homeassistant.components.llm integration whose whole job is discovering per-integration `<domain>/llm.py` platform modules (via LazyIntegrationPlatforms, string_indirection true) and merging their Tool lists/prompts, built on the pre-existing helpers/llm.py (Tool, LLMContext) and helpers/integration_platform.py (LazyIntegrationPlatforms) modules. No integration implements the `llm.py` platform hook yet in this commit — it is pure framework wiring.'
