notes: 'Adds [Obsolete(..., DiagnosticId = "ASPDEPR003")] to the five public
  types in Mvc.Razor.RuntimeCompilation (AssemblyPartExtensions,
  RazorRuntimeCompilationMvcBuilderExtensions,
  RazorRuntimeCompilationMvcCoreBuilderExtensions, FileProviderRazorProjectItem,
  MvcRazorRuntimeCompilationOptions) and wraps every internal/test reference to
  them in #pragma warning disable/restore ASPDEPR003 to suppress the resulting
  CS0618. All real consumers of the obsoleted symbols are already covered by the
  19-file diff (verified via git grep for each symbol name); no external file
  needs to change for the sweep to compile, and no doc/config file references
  ASPDEPR003, so this is a genuinely self-contained mechanical change with no
  nontrivial gold beyond the diff itself - no_nontrivial_context is set
  accordingly and gold is limited to the semantic core (5 obsoleted
  definitions + 2 representative internal-caller pragma sites) rather than all
  19 touched files.'
