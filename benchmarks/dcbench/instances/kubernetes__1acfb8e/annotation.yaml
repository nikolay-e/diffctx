notes: 'Promotes DeviceTaintRule to the resource.k8s.io/v1 API, splitting REST-storage construction into a v1-only NewRESTv1 (ResourceVersion required on update) and a NewRESTLegacy (kept unconditional for backward compatibility) dispatched by string APIVersion/resource-name comparisons in strategy.go and storage_resource.go. Deliberately does not touch the generated v1 client-go/openapi files (that is a separate paired commit), so `c.clientSet.ResourceV1().DeviceTaintRules()` in client.go references a method that does not yet exist at this commit alone.'
