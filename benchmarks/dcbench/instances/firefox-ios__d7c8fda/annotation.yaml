curation:
  source: TOANALYZE-2026-07-07
  n_files: 15
  description: New TestKit SwiftPM library, move XCTestExtension into it — package birth + source relocation
notes: >-
  Birth of a new local SwiftPM library TestKit (BrowserKit/Package.swift)
  holding a single file, XCTestExtension.swift, that consolidates the
  trackForMemoryLeaks/unwrapAsync/assertAsyncThrows/assertAsyncThrowsEqual
  XCTestCase helpers previously duplicated verbatim across 4 BrowserKit test
  targets and the main ClientTests Xcode target; project.pbxproj wires the
  same product into the non-SPM ClientTests target. Only one representative
  caller per target actually got "import TestKit" added, so the two
  nontrivial-gold caller files were chosen to make that partial-migration
  blast radius visible rather than to enumerate all affected callers (there
  are well over a hundred in ClientTests alone). No selector/notification/
  string-keyed DI is involved -- linkage is entirely via SwiftPM target
  dependencies and Swift module imports, so string_indirection is false.
