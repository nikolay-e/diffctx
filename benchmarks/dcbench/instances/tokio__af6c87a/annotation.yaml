notes: 'Completes the edition-2021 rollout (companion to #5571 which handled tokio-stream/tokio-test/tokio-util) for the remaining 7 non-published/dev crates: benches, examples, stress-test, tests-build, tests-integration, tokio-macros, and the two fuzz crates. The workspace-wide rustfmt CI check is bumped once in ci.yml (mirrored in CONTRIBUTING.md), which is why all lagging crates had to move together. Two crates have real code fallout — examples/tinyhttp.rs and tests-integration/tests/process_stdio.rs drop now-redundant TryFrom/TryInto imports since 2021''s prelude includes them; the other 5 Cargo.toml bumps are mechanical duplicates.'
