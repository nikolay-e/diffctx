patch_stored: true
gold:
  - path: .github/workflows/ci.yml
    tier: essential
    role: config
    in_diff: true
    rationale: '`rustfmt --check --edition 2018` becomes `--edition 2021` in the workspace-wide rustfmt CI job — the driver forcing every remaining 2018-edition crate to be bumped in this same commit, since rustfmt is invoked once across all crates.'
  - path: examples/Cargo.toml
    tier: essential
    role: config
    in_diff: true
    rationale: 'bumps `edition = "2018"` to `"2021"` for the examples crate, the direct cause of the TryFrom-import removal in examples/tinyhttp.rs.'
  - path: examples/tinyhttp.rs
    tier: essential
    role: cochange
    in_diff: true
    rationale: '`use std::{convert::TryFrom, env, error::Error, fmt, io};` drops `convert::TryFrom` since Rust 2021''s prelude re-exports TryFrom, making the explicit import an unused-import lint.'
  - path: tests-integration/Cargo.toml
    tier: essential
    role: config
    in_diff: true
    rationale: 'bumps `edition = "2018"` to `"2021"` for the tests-integration crate, the direct cause of the TryInto-import removal in tests/process_stdio.rs.'
  - path: tests-integration/tests/process_stdio.rs
    tier: essential
    role: cochange
    in_diff: true
    rationale: 'drops `use std::convert::TryInto;`, same 2021-prelude reasoning as tinyhttp.rs''s TryFrom removal.'
  - path: CONTRIBUTING.md
    tier: helpful
    role: doc
    in_diff: true
    rationale: 'documents the same `rustfmt --check --edition 2018/2021` command bumped in ci.yml, keeping contributor-facing instructions in sync with the CI job.'
forbidden:
  - path: benches/Cargo.toml
    reason: sibling workspace crate manifest bumping the same edition field mechanically, redundant with examples/Cargo.toml for understanding the change
  - path: stress-test/Cargo.toml
    reason: sibling workspace crate manifest, same mechanical edition bump, no accompanying code fallout
  - path: tokio-macros/Cargo.toml
    reason: sibling workspace crate manifest, same mechanical edition bump, no accompanying code fallout
  - path: tokio/fuzz/Cargo.toml
    reason: sibling fuzz-target manifest, same mechanical edition bump, no accompanying code fallout
