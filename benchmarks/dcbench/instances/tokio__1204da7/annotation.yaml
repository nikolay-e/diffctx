notes: 'Pure module-split refactor of runtime::context into blocking.rs/current.rs/runtime.rs/runtime_mt.rs, plus one deliberate behavior change: enter_runtime now takes a closure and swaps the RNG seed on entering the runtime (not in set_current), matching the docstring intent that Handle::enter() should not perturb the seed. All 4 caller sites (handle.rs, current_thread.rs, multi_thread/mod.rs, worker.rs) are updated to the closure-based API; two external callers of moved functions (blocking/shutdown.rs, task/local.rs) are added as helpful, out-of-diff context.'
