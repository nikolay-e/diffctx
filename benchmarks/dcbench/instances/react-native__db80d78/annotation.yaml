notes: 'diff.stat is 261 insertions/233 deletions across 31 files (merging .so libraries into one), and
  the ctx_files count (59) shows meaningful expansion beyond the 31 touched files. Unlike the react-native/004
  and /014 cases I could not pin exact noise filenames from the 60-line head sample, but the pathology
  is visible directly: CMakeLists.txt files (coarse build-config, no fine-grained tree-sitter grammar)
  are rendered as single whole-file ''chunk'' fragments (e.g. a 138-line Kotlin file for what is likely
  a handful of changed lines), so token cost tracks file size rather than diff size. Recall is good since
  the touched build files legitimately need cross-referencing to understand the merge, but precision suffers
  from full-file rather than hunk-scoped rendering.'
