curation:
  source: TOANALYZE-2026-07-07
  n_files: 16
  description: 'rt: split internal `runtime::Handle` concerns — struct split threaded through schedulers'
notes: Splits the internal concerns previously bundled into runtime::HandleInner (spawner, driver,
  blocking_spawner, seed_generator) into a new scheduler::Handle enum with per-scheduler-variant Handle
  structs (current_thread::Handle, multi_thread::Handle — the latter in a brand-new file), deletes the
  old top-level runtime::Spawner enum entirely, and moves the `scheduler` module to compile
  unconditionally (outside cfg_rt!) since scheduler::Handle now underlies the public runtime::Handle in
  all feature configurations. Every caller that used to reach through
  handle.as_inner().{spawner,driver,...} now goes through handle.inner.{spawn(),driver(),blocking_spawner(),...}.
