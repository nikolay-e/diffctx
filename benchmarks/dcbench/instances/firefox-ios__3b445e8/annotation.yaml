curation:
  source: TOANALYZE-2026-07-07
  n_files: 6
  description: 'Translations: add bridge between webviews — new bridge component wired into project'
notes: >-
  Adds a generic Bridge/BridgeEndpoint abstraction plus a concrete WKWebView-backed
  WebViewBridgeEndpoint that forwards JSON messages between two WKScriptMessageHandler
  ports; ships with unit tests and a fake endpoint, and is registered in
  project.pbxproj. At the pinned commit no Swift call site instantiates Bridge yet (git
  log shows FXIOS-13784 has only this one commit), so the essential context proving the
  design is not another Swift caller but the pre-existing paired JS user scripts
  (TranslationsEntrypoint.js using messageHandlers.left/window.receive,
  TranslationsEngine.js using messageHandlers.right/window.receive) that define exactly
  the handlerName/receiveFunction contract WebViewBridgeEndpoint implements.
  string_indirection: true because the whole mechanism is keyed by string handler names
  ("left"/"right") and a string-invoked JS function name ("window.receive"), not a
  static Swift reference.
