notes: >-
  Adds a new opt-in envoy.filters.http.upstream_rbac upstream HTTP filter that is a thin subclass of
  the downstream RBAC filter, running RBAC evaluation from the onHostSelected() callback (added by
  prerequisite #43764) instead of decodeHeaders(), so the upstream_ip_port matcher's required
  FilterState (StreamInfo::UpstreamAddress, key "envoy.stream.upstream_address") is populated for
  every cluster type, not just dynamic_forward_proxy dns_cache mode, enabling SSRF default-deny
  policies. No new proto is introduced; it reuses the existing rbac.v3.RBAC and upstream_ip_port_matcher
  protos, so the string-keyed FilterState linkage between the new filter, the reused matcher proto, and
  dynamic_forward_proxy's proxy_filter.cc is the crux of the non-obvious context.
