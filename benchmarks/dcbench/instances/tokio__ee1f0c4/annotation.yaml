    tier: essential
    role: definition
    in_diff: true
    rationale: 'replaces `use tokio_stream::Stream;` with `use futures_core::Stream;` in the shared FramedImpl::poll_next state machine that both FramedRead and FramedWrite build on.'
  - path: tokio-util/src/codec/framed.rs
    tier: essential
    role: definition
    in_diff: true
    rationale: 'public Framed<T, U> struct swaps its Stream import from tokio_stream::Stream to futures_core::Stream and updates four doc-comment links to match.'
  - path: tokio-util/src/codec/framed_read.rs
    tier: helpful
    role: definition
    in_diff: true
    rationale: 'same tokio_stream::Stream -> futures_core::Stream import/doc-link substitution applied to the read-half of the codec split.'
  - path: tokio-util/src/codec/framed_write.rs
    tier: helpful
    role: definition
    in_diff: true
    rationale: 'same tokio_stream::Stream -> futures_core::Stream import substitution applied to the write-half of the codec split.'
  - path: tokio-util/src/udp/frame.rs
    tier: essential
    role: definition
    in_diff: true
    rationale: 'UdpFramed''s impl Stream for UdpFramed<C> swaps its use tokio_stream::Stream for use futures_core::Stream, showing the same decoupling applied outside the codec module (the udp part of the curation description).'
  - path: tokio-util/src/io/reader_stream.rs
    tier: helpful
    role: doc
    in_diff: true
    rationale: 'only the [Stream]: tokio_stream::Stream doc-comment links change here (the code already imports futures_core::stream::Stream), confirming the io part of the decoupling was purely cosmetic in this file.'
