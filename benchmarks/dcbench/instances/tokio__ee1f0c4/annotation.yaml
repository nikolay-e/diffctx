    tier: essential
    role: definition
    in_diff: false
    rationale: 'line 105 `pub use futures_core::Stream;` proves tokio_stream::Stream is nothing but a re-export of futures_core::Stream, so replacing every use tokio_stream::Stream with use futures_core::Stream in tokio-util is behavior-preserving, not just a rename of convenience.'
