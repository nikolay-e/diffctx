  description: 'util: remove tokio-stream dependency from tokio-util — inter-crate dependency decoupling
    across codec/io/udp'
notes: 'Cargo.toml demotes tokio-stream to a dev-dependency and every use tokio_stream::Stream
  in tokio-util is swapped for use futures_core::Stream (plus matching doc links); the swap is
  behavior-preserving because tokio-stream/src/lib.rs just re-exports futures_core::Stream. Two of
  the ten diffed files (reader_stream.rs, stream_reader.rs) only touch doc comments since their code
  already imported futures_core::Stream directly; stream_reader.rs was folded out of gold in favor
  of reader_stream.rs as the io-domain representative to avoid padding near-duplicate entries.'
