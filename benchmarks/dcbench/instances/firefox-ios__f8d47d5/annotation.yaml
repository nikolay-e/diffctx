gold:
  - path: Client.xcodeproj/project.pbxproj
    tier: essential
    role: config
    in_diff: true
    rationale: Flips every target from SWIFT_VERSION 3.0 to 4.0 and adds SWIFT_SWIFT3_OBJC_INFERENCE = Off/On per target — this build-setting flip is the root cause forcing every explicit @objc addition in the diff.
  - path: Client/Frontend/Browser/BrowserViewController.swift
    tier: essential
    role: definition
    in_diff: true
    rationale: Central file with the widest set of newly @objc-annotated selectors (appWillResignActiveNotification, appDidBecomeActiveNotification, tappedTopArea, dynamicFontChanged), each reached only via NotificationCenter.addObserver(selector:) or UIControl.addTarget(action:) string-selector lookups defined a few lines below in the same file.
  - path: Client/Frontend/Intro/IntroViewController.swift
    tier: essential
    role: definition
    in_diff: true
    rationale: 'Defines IntroCard.buttonSelector as a String ("Selector is a string that is synthisized into a Selector via NSSelectorFromString (for LeanPlum''s sake)") and resolves it at runtime with `self.responds(to: NSSelectorFromString(selectorString))` / `cardView.button.addTarget(self, action: NSSelectorFromString(selectorString), ...)` — the purest string_indirection instance in the diff: @objc func login()/startBrowsing() are invoked purely by a string name, not a static #selector reference at the call site.'
  - path: Client/Frontend/Browser/URLBarView.swift
    tier: helpful
    role: cochange
    in_diff: true
    rationale: Adds @objc to `dynamic var locationBorderColor/locationActiveBorderColor/cancelTintColor/showQRButtonTintColor` — `dynamic` properties backing UIAppearance's KVC-based appearance-proxy mechanism, which look up properties by name via the ObjC runtime and now require explicit @objc since inference is off.
  - path: Client/Frontend/Browser/TabToolbar.swift
    tier: helpful
    role: definition
    in_diff: true
    rationale: 'Changes `@objc / open class TabToolbarHelper: NSObject` to `@objcMembers`, illustrating the alternate fix (blanket-expose all members) used alongside the per-method @objc sweep once implicit inference stopped covering the class''s target-action methods.'
  - path: Client/Application/LeanplumIntegration.swift
    tier: helpful
    role: caller
    in_diff: false
    rationale: 'Not touched by this commit but is the actual consumer that requires IntroViewController''s buttonSelector strings to resolve: `var introScreenVars = LPVar.define("IntroScreen", with: IntroCard.defaultCards().flatMap({ $0.asDictonary() }))` ships each card''s String selector name to the remote LeanPlum config, which IntroViewController later reconstitutes via NSSelectorFromString(selectorString) — the round-trip only works if the target methods are @objc-visible.'
