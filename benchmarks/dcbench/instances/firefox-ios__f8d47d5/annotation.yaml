  description: Disable ObjC inference, add `@objc` to all runtime-exposed selectors — cross-cutting Swift/ObjC
    interop sweep
notes: Disables implicit Swift3 ObjC inference (SWIFT_VERSION 3.0->4.0, SWIFT_SWIFT3_OBJC_INFERENCE=Off/On per target in project.pbxproj) and adds explicit @objc to every method/property reached via #selector, NotificationCenter selectors, UIControl target-action, dynamic UIAppearance properties, and — the strongest case — IntroViewController's NSSelectorFromString(card.buttonSelector) runtime lookup fed by LeanplumIntegration.swift's remote-config serialization. Verified via git grep across the full repo at the pinned commit that no out-of-diff file calls #selector() against a newly-@objc'd symbol except two already-explicit pre-existing cases (now listed as forbidden distractors).
