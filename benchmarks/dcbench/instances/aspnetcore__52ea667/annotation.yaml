notes: >
  Adds scenario-based filtering (RestoreContext: InitialValue/LastSnapshot/ValueUpdate,
  RestoreOptions.RestoreBehavior/AllowUpdates) so [PersistentState] parameters can skip
  restoring on startup/resume and can receive live updates pushed during enhanced
  navigation, wiring it through ComponentStatePersistenceManager, CircuitHost, and the
  Web.JS WebRootComponentManager/ComponentDescriptorDiscovery HTML-comment marker
  protocol. Very wide diff (62 files); gold set picked as the semantic core plus the one
  clearly load-bearing out-of-diff definition (ComponentDescriptorDiscovery.ts) rather than
  every touched file (many touched files are trivial one-line signature/plumbing changes
  or renames, e.g. WebAssemblyHost.cs, ComponentHub.cs, CircuitFactory.cs).
