notes: 'Renames the onboarding checkbox image pair (onboardingCheckmarkEmpty/Filled -> radioButtonNotSelected/Selected),
  moving the identifiers from ImageIdentifiers.Onboarding.MultipleChoiceButtonImages to top-level ImageIdentifiers
  and relocating/renaming the matching .imageset asset-catalog folders. Both Swift consumers
  (MicrosurveyTableViewCell, OnboardingMultipleChoiceButtonView) are updated in the same commit. Exhaustive git grep
  at the pinned commit found no other consumers, no covering tests, and no project.pbxproj entries to update
  (Images.xcassets is folder-referenced, not per-file) -- the change is fully self-contained in its own diff, so
  no_nontrivial_context is set and gold is limited to the 5 diff files. string_indirection is true because the
  Swift constant value must textually match the .imageset folder/filename for UIImage(named:) to resolve it; nothing
  enforces that match at compile time.'
