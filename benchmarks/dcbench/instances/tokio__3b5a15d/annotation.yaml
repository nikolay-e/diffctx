notes: 'Replaces the ad hoc `--cfg tokio_uring` RUSTFLAGS convention with a proper (still unstable, tokio_unstable-gated) Cargo feature `io-uring`, so `cargo add tokio --features io-uring` works instead of requiring out-of-band RUSTFLAGS. The rename touches every cfg predicate and the `cfg_tokio_uring!` -> `cfg_io_uring!` macro rename in macros/cfg.rs, which is the hub every other touched file keys off; all needed context is within the diff.'
