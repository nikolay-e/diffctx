notes: Adds a new envoy.clusters.composite cluster type whose CompositeClusterLoadBalancer maps the retry attempt count (read from StreamInfo::attemptCount(), set by the router on each retry) to an index into an ordered sub-cluster list, routing each retry to a different upstream cluster. Its class structure (Cluster/LoadBalancer/LoadBalancerFactory/ThreadAwareLoadBalancer/ClusterFactory) closely mirrors the pre-existing aggregate cluster named explicitly in the commit message, though aggregate selects by sub-cluster health/priority while composite selects purely by attempt count; factory registration is string-keyed ("envoy.clusters.composite") both in the C++ REGISTER_FACTORY macro and in extensions_build_config.bzl.
