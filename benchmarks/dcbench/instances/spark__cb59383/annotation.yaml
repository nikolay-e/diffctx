notes: 'Adds a new `spark.tvf` / `session.tvf` DataFrame-API namespace exposing existing SQL table-valued functions (explode, posexplode, inline, json_tuple, stack, collations, sql_keywords, variant_explode, range) programmatically, implemented in parallel across classic Scala, Connect Scala client+server, and Python classic+Connect, with matching proto messages. Classic-side dispatch goes through `UnresolvedTableValuedFunction(name: String, args)`, resolved later purely by string match against FunctionRegistry.logicalPlans -- a genuine string_indirection link entirely outside the diff, hence essential gold despite being untouched.'
