notes: >
  Full rewrite of the theming app's admin/personal settings UI from Vue 2 (JS, options
  API, webpack) to Vue 3 (TypeScript, composables, Vite): 54 files touched including many
  pure renames/deletes of superseded components. Gold picks the architectural backbone —
  PHP settings classes providing initial state, the template mount points, the new Vue 3
  entry scripts and top-level views, and the ThemingController endpoints the new save/reset
  composable calls — rather than every migrated leaf component. Linkage is entirely
  string-keyed (initial-state keys, DOM element ids, ajax setting names), hence
  string_indirection: true. Fully self-contained within the diff.
