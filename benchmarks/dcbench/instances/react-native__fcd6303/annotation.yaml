notes: 'Worst file-count blowup observed in the sample: 13 files actually changed (a cross-platform ''Dismiss''
  button added to the dev-loading overlay) but diffctx surfaces content from 120 files (ctx_files=120),
  a >9x multiplier. The ''Changed files'' header in ctx.md correctly lists only the 13 real files, so
  the extra ~107 are appended later as ''supporting'' context we did not page into — this is issue #65
  (co-located/whole-tree over-selection) in its most extreme observed form here. md_tokens=26827 for a
  ~256-line diff (203+/53-) is also individually bloated even before counting the file-count explosion.'
