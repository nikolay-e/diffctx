gold:
  - path: src/nvim/message.c
    tier: essential
    role: definition
    in_diff: true
    rationale: 'largest diff (55 lines) and the core mechanism: msg_multihl() gains an `err` parameter that routes each chunk through emsg_multiline() instead of msg_multiline() when set, and a new `is_multihl` static flag is threaded through msg_keep()/msg_source() to suppress duplicate msg_start()/msg_end()/history calls while inside a multi-chunk echoerr; emsg_multiline() itself gains `kind`/`hl_id` parameters (previously hardcoded to "emsg"/HLF_E) so nvim_echo can pass "echoerr".'
  - path: src/nvim/api/vim.c
    tier: essential
    role: definition
    in_diff: true
    rationale: 'nvim_echo() passes `opts->err` into parse_hl_msg() and picks `opts->err ? "echoerr" : history ? "echomsg" : "echo"` as the msg_multihl() kind, directly implementing "add err field ... that directly maps to :echoerr" from the commit message.'
  - path: src/nvim/api/keysets_defs.h
    tier: essential
    role: definition
    in_diff: true
    rationale: 'adds `Boolean err;` to `Dict(echo_opts)`, the opts struct nvim_echo''s new `opts->err` field is typed against.'
  - path: src/nvim/api/private/helpers.c
    tier: essential
    role: definition
    in_diff: true
    rationale: 'parse_hl_msg() gains an `is_err` parameter and defaults each chunk''s highlight to HLF_E when set (instead of 0/no-highlight) unless an explicit highlight group is given — this is why passing `err=true` with an unstyled chunk renders it in |hl-ErrorMsg| by default.'
  - path: test/functional/api/vim_spec.lua
    tier: helpful
    role: test
    in_diff: true
    rationale: adds the "can print error message" screen test asserting nvim_echo({...}, false, {err=true}) triggers the press-ENTER prompt and renders chunks in error highlight, pinning the :echoerr-equivalent behavior.
  - path: test/functional/ui/messages_spec.lua
    tier: helpful
    role: test
    in_diff: true
    rationale: 'asserts the ext_messages event for `nvim_echo(..., {err:1})` carries `kind = ''echoerr''`, the UI-facing contract of the new opts.err mapping.'
