notes: 'Adds an `err` field to nvim_echo()''s opts, making it emit `:echoerr`-equivalent output (kind="echoerr", HLF_E highlight, routed through emsg_multiline) as a Lua-callable alternative ahead of deprecating nvim_err_write(ln)() (done in the child commit 5c92b40b4b17, also in this benchmark). All emsg_multiline()/msg_multihl() call sites needing the new parameters are confirmed updated within the 13-file diff via grep at the base commit; semsg_multiline()''s own signature is unchanged so its many other callers elsewhere in the tree require no updates.'
