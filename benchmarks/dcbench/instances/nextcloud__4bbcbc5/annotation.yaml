notes: >
  Promotes files_sharing's private ISharedStorage to a public OCP interface
  (lib/public/Files/Storage/ISharedStorage.php), deprecates the app-private copy, and
  migrates every consumer (dav Node/ViewOnlyPlugin/PublicShareWrapper, files_versions
  LegacyVersionsBackend) from method_exists()/hardcoded-class instanceOfStorage() checks
  to the new interface. instanceOfStorage() resolves via PHP is_a() on a ::class constant,
  a compile-time-resolved reference rather than free-form string DI, so string_indirection
  is false. Change is fully self-contained in the diff; no external nontrivial context found.
