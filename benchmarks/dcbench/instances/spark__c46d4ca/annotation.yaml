notes: 'Pure deduplication commit: moves four classes (SaveMode, FlatMapGroupsWithStateFunction, MapGroupsWithStateFunction, GroupState) that existed as byte-identical duplicates in sql/core and connector/connect into the shared sql/api module, deleting the Connect-side copies (100%-similarity renames plus straight deletions) and updating MimaExcludes for the resulting binary-compat exclusions. The nontrivial context is the build-graph reason the move is possible: connector/connect/common/pom.xml already depends on spark-sql-api, so relocating the shared classes there removes the duplication without adding a new dependency edge.'
