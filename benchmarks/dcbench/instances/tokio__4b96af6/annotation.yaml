notes: 'Adds `flavor = "local"` to #[tokio::main] (tokio_unstable-gated), which expands to the pre-existing `Builder::build_local(LocalOptions::default())` rather than `.build()`, giving spawn_local() access without manually constructing a LocalRuntime. The Local variant reuses CurrentThread scheduling logic (see the `F::CurrentThread | F::Local` match arms in entry.rs) but requires a compile-time tokio_unstable check since build_local/LocalRuntime are unstable APIs defined outside this diff.'
