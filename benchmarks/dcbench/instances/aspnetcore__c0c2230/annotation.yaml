curation:
  source: TOANALYZE-2026-07-07
  n_files: 16
  description: SupplyParameterFromSession support for Blazor — src+razor+PublicAPI.Unshipped+tests
notes: >-
  Adds [SupplyParameterFromSession] for Blazor SSR, following the existing
  [SupplyParameterFromTempData] pattern: a new SessionCascadingValueSupplier
  (JSON-serializes property values into ISession by key, persisted on
  Response.OnStarting) is registered via the generic
  TryAddCascadingValueSupplier<TAttribute> DI helper and dispatched at
  runtime through CascadingParameterValueProvider<TAttribute>.CanSupplyValue
  using a static `is TAttribute` check, not a string-keyed lookup — session
  keys (attribute.Name ?? property name) are an internal storage detail of
  the new supplier, not the attribute-to-resolver linkage, hence
  string_indirection: false. RazorComponentEndpointsNoInteractivityStartup.cs
  test-asset changes (renaming the UseSessionStorageTempDataProvider flag
  gating to a new UseSession flag) were judged test-harness plumbing, not
  gold.
