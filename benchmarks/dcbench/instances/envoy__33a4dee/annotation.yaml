notes: 'Removes the envoy.restart_features.use_eds_cache_for_ads runtime guard and its associated legacy (cache-disabled) code paths: the MuxFactory::create() interface drops its bool use_eds_resources_cache parameter, callers stop gating EDS-cache construction/lookup behind Runtime::runtimeFeatureEnabled, and tests/docs/changelog are updated to match. The guard is looked up by string name (Runtime::runtimeFeatureEnabled("envoy.restart_features.use_eds_cache_for_ads") / RUNTIME_GUARD macro), so string_indirection is true. Caveat: the RUNTIME_GUARD registration in runtime_features.cc is not touched by this commit (removed later in a separate commit), included as nontrivial gold since it defines the very flag this commit describes as removed.'
