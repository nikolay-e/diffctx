curation:
  source: TOANALYZE-2026-07-07
  n_files: 29
  description: Move ArtifactManager from Spark Connect into SparkSession (sql/core)
notes: >-
  Renames `SparkConnectArtifactManager` to `ArtifactManager`, moves it from the connect
  module into sql/core so any `SparkSession` (not just Spark Connect ones) can use
  session-scoped artifacts, and exposes it via `SparkSession.artifactManager` /
  `SessionState.artifactManager`. Legacy (non-Connect) behavior is preserved because the
  new `withResources` method (context classloader + `JobArtifactState` propagation) is
  opt-in; `SessionHolder` now calls it explicitly. `CacheId`/`BlockManager.removeCache`
  are simplified from (userId, sessionId) to a single `sessionUUID` to match. All ~29
  files are direct consequences of this one move; the semantic core is 7 essential files
  plus tests/config. string_indirection is true because `project/MimaExcludes.scala`
  keys its breaking-change acknowledgment on fully-qualified name strings, and
  `ArtifactManager.uploadArtifactToFs` falls back to reading the deprecated
  `spark.connect.copyFromLocalToFs.allowDestLocal` key by string when the new SQLConf
  entry is unset.
