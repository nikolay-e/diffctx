    rationale: the vim.wait() doc-comment/type stub is removed from builtin.lua (since it is no longer a C-registered global) and replaced with @nodoc stubs for the new vim._core.loop_poll/ui_flush/check_interrupt helpers, documenting the new C-Lua boundary.
  - path: runtime/lua/vim/_core/shared.lua
    tier: essential
    role: definition
    in_diff: false
    rationale: '`function vim.validate(name, value, validator, optional, message)` (line ~1297) is what now raises "callback: expected callable, got number" when vim.wait''s new `vim.validate(''callback'', callback, ''callable'', true)` call fails — the reason test/functional/lua/vim_spec.lua''s expected error string changes from the old hand-written "vim.wait: callback must be callable" to a vim.validate()-shaped message.'
  - path: test/functional/lua/vim_spec.lua
