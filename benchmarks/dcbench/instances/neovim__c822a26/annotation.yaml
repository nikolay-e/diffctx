notes: 'Moves vim.wait() from a monolithic C implementation (nlua_wait + dummy libuv timer in executor.c) into pure Lua in _core/editor.lua, exposing only three narrow C primitives (vim._core.loop_poll/ui_flush/check_interrupt) as the new C-Lua boundary. The test-expectation change for the "callback must be callable" error is explained by vim._core/shared.lua''s pre-existing vim.validate() implementation, which the new Lua vim.wait() now calls instead of raising a hand-written C error string.'
