  - path: runtime/lua/vim/_core/editor.lua
    tier: essential
    role: definition
    in_diff: true
    rationale: gains the full `function vim.wait(time, callback, interval, fast_only)` implementation, ported from C, using vim._core.ui_flush()/check_interrupt()/loop_poll() and a Lua-side uv timer to keep the polling interval semantics.
  - path: src/nvim/lua/executor.c
    tier: essential
    role: definition
    in_diff: true
    rationale: 'the old nlua_wait() C entrypoint and its dummy-timer machinery are deleted (166 lines removed) and replaced by three narrow C helpers exposed as vim._core.loop_poll/ui_flush/check_interrupt that the new Lua vim.wait() calls into.'
  - path: runtime/lua/vim/_meta/builtin.lua
    tier: essential
    role: doc
