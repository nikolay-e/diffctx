    rationale: replaces `PassThroughFilterFactory` with a `TemplatedPassThroughFilterFactory<Proto>` and drops the constructor's forced `no_extension_lookup_by_name=false` override, because tests must now register a distinct proto type per filter for type-URL-based lookup to succeed.
