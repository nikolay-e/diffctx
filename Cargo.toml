[workspace]
members = ["crates/diffctx-native"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# unwind, NOT abort. This crate ships as a pyo3 extension, and pyo3 turns a
# Rust panic into a Python exception by unwinding across the boundary. Under
# `panic = "abort"` the compute deadline (`deadline.rs`) — which is a panic on
# purpose, because the phases it guards do not return `Result` — killed the
# whole interpreter with SIGABRT instead: measured on a released wheel, and
# fatal for the MCP server, which abandons a timed-out worker thread and
# expects to keep serving every other request. An earlier release had already
# removed every user-reachable `unwrap()` for this exact reason; #210 then
# reintroduced the abort path as a feature.
#
# It also means the test profile IS the shipped profile. The old split (tests
# on a `release-unwind` clone) is what let a mechanism pass its own test while
# aborting in production.
panic = "unwind"
debug = "line-tables-only"
split-debuginfo = "packed"
