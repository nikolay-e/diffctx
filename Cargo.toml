[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "2.0.0-dev.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/nikolay-e/diffctx"

# Dependencies two or more crates of the workspace share: one version, one feature set.
[workspace.dependencies]
diffctx-base = { path = "crates/diffctx-base", version = "2.0.0-dev.0" }
diffctx-config = { path = "crates/diffctx-config", version = "2.0.0-dev.0" }
diffctx-snapshot = { path = "crates/diffctx-snapshot", version = "2.0.0-dev.0" }
dunce = "1"
libc = "0.2"
once_cell = "1"
rayon = "1.10"
regex = "1"
rustc-hash = "2"
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
tiktoken-rs = "=0.12.1"
toml = "1.1"
tracing = "0.1"
wait-timeout = "0.2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_closure_for_method_calls = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
items_after_statements = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
non_std_lazy_statics = "allow"
implicit_hasher = "allow"
manual_let_else = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
unnested_or_patterns = "allow"
unused_self = "allow"
cargo_common_metadata = "allow"
type_complexity = "allow"
should_implement_trait = "allow"
multiple_crate_versions = "allow"
single_match_else = "allow"
new_without_default = "allow"
# `mul_add` is FMA: one rounding instead of two. Every site clippy flags is on
# a scoring path, so taking the suggestion changes selection output and
# invalidates the calibration — a Q-class edit disguised as a lint fix.
suboptimal_flops = "allow"
# The ban on `Result::ok` and its kin is configured in clippy.toml and holds in
# `snapshot` alone, which denies it in its own `mod.rs`.
disallowed_methods = "allow"
# Contradicts `unreachable_pub`: an item no outside crate can name is `pub(crate)`
# by rule, and this nursery lint asks for `pub` back.
redundant_pub_crate = "allow"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# unwind, NOT abort. This crate ships as a pyo3 extension, and pyo3 turns a
# Rust panic into a Python exception by unwinding across the boundary. Under
# `panic = "abort"` the compute deadline (`deadline.rs`) — which is a panic on
# purpose, because the phases it guards do not return `Result` — killed the
# whole interpreter with SIGABRT instead: measured on a released wheel, and
# fatal for the MCP server, which abandons a timed-out worker thread and
# expects to keep serving every other request. An earlier release had already
# removed every user-reachable `unwrap()` for this exact reason; #210 then
# reintroduced the abort path as a feature.
#
# It also means the test profile IS the shipped profile. The old split (tests
# on a `release-unwind` clone) is what let a mechanism pass its own test while
# aborting in production.
panic = "unwind"
debug = "line-tables-only"
split-debuginfo = "packed"
