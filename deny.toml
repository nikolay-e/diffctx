# `cargo deny check` (ci.yml) over the whole workspace. The licenses are the free ones the tree
# carries today (every dual-licensed crate has one of them as an alternative); a crate under any
# other terms fails until the owner's word, with the issue naming why and its replacement
# (AGENTS.md: free software). What a layer may not depend on is that layer's own deny.toml
# (crates/diffctx-base/deny.toml).

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
