# `cargo deny check` (ci.yml) over the whole workspace. Third-party dependencies stay on the free
# SPDX licenses below (every dual-licensed crate has one of them as an alternative); a dependency
# under any other terms fails until the owner's word, with the issue naming why and its replacement
# (AGENTS.md: free software). Our own workspace crates carry PolyForm Shield 1.0.0 in LICENSE.md
# and get crate-scoped clarifications and exceptions so no outside crate can ride that allowance.
# What a layer may not depend on is that layer's own deny.toml (crates/diffctx-base/deny.toml).

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[[licenses.clarify]]
crate = "diffctx"
expression = "LicenseRef-PolyForm-Shield-1.0.0"
license-files = [{ path = "../../LICENSE.md", hash = 0xe190e5e3 }]

[[licenses.clarify]]
crate = "diffctx-answer"
expression = "LicenseRef-PolyForm-Shield-1.0.0"
license-files = [{ path = "../../LICENSE.md", hash = 0xe190e5e3 }]

