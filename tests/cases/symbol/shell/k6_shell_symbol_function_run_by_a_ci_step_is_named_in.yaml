name: k6_shell_symbol_function_run_by_a_ci_step_is_named_in
mode: symbol
source: synthetic
tags: [shell, literal-name, ci]
repo:
  initial_files:
    scripts/lib/common.sh: |
      #!/usr/bin/env bash
      log_step() {
        echo "==> $*"
      }
    scripts/release.sh: |
      #!/usr/bin/env bash
      DIR="$(cd "$(dirname "$0")" && pwd)"
      . "$DIR/lib/common.sh"
      log_step "release"
    .github/workflows/ci.yml: |
      jobs:
        e2e:
          runs-on: ubuntu-latest
          steps:
            - run: |
                source scripts/lib/common.sh
                log_step e2e
  commit_message: "base"
query:
  symbol: log_step
expect:
  exact: false
  discloses: true
  no_negative_claims: true
  definitions:
    - scripts/lib/common.sh::log_step
  relations:
    - {from: scripts/release.sh, to: scripts/lib/common.sh::log_step, kind: calls, resolution: resolved}
    - {from: .github/workflows/ci.yml, to: scripts/lib/common.sh::log_step, kind: calls, resolution: unresolved}
