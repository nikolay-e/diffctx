name: shell_symbol_sourced_variable_is_a_definition
mode: symbol
source: gh#659
issue_state: open
tags:
- shell
- variables
- source
repo:
  initial_files:
    lib.sh: |
      FOO='a|b'
    user.sh: |
      . ./lib.sh
      echo "$FOO"
