tags: [python, symbol, global, nested-function]
# `def handler` under `global handler` binds a module name: it is no local of `install`,
# and the call on line 8 reaches it once `install` has run.
repo:
  initial_files:
    main.py: |
      def install():
          global handler

          def handler():
              pass


      install()
      handler()
  commit_message: init
