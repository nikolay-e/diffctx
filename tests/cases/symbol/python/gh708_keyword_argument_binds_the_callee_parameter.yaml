      def refresh(user_id: int) -> dict:
          return build_context(user_id, tz_offset_hours=SETTINGS.tz_offset_hours)
    record/__init__.py: ""
    record/tools.py: |
      from datetime import timedelta, timezone
      from record.zones import person_zone


      def _zone(tz_offset_hours: float | None):
          if tz_offset_hours is None:
              return person_zone()
          return timezone(timedelta(hours=tz_offset_hours))


      def build_context(user_id: int, tz_offset_hours: float | None = None) -> dict:
          return {"user": user_id, "zone": str(_zone(tz_offset_hours))}
    record/zones.py: |
      from datetime import timezone


      def person_zone():
          return timezone.utc
