name: py_def_under_a_global_declaration_is_a_definition_its_callers_a_gap
mode: symbol
source: synthetic
issue_state: open
tags: [python, symbol, global, nested-function]
# `def handler` under `global handler` binds a module name: it is a definition, no local
# of `install`, though it ends where `install` ends. Whether `install` has run when the
# call on line 9 happens is no static fact: the callers stay a named gap, not zero.
repo:
  initial_files:
    main.py: |
      def install():
          global handler

          def handler():
              pass


      install()
      handler()
  commit_message: init
query:
  symbol: handler
expect:
  exact: false
  definitions: [main.py::handler]
  partial:
    main.py::handler:
      calls: unlanded
