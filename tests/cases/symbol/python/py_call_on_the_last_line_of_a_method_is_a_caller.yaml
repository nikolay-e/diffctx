repo:
  initial_files:
    pkg/__init__.py: ""
    pkg/pgc.py: |
      class PGC:
          def apply_result(self, node, tick, inbox, result):
              return (node, tick, inbox, result)

          def _drain_local(self, node, tick, inbox, result):
              with self.store.tx():
                  self.apply_result(node, tick, inbox, result)

          def apply_for(self, node, tick, inbox, result):
              with self.store.tx():
                  return self.apply_result(node, tick, inbox, result)
