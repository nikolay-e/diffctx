name: erlang_symbol_type_alias_is_a_definition
mode: symbol
source: gh#616
issue_state: open
tags:
- tier3
- erlang
- types
repo:
  initial_files:
    shop.erl: |
      -module(shop).
      -export([total/1]).

      -type price() :: non_neg_integer().

      -spec total([price()]) -> price().
      total(Items) ->
          lists:sum(Items).
    cart.erl: |
      -module(cart).
      -export([sum/1]).

      -spec sum([shop:price()]) -> shop:price().
      sum(Xs) ->
          shop:total(Xs).
  commit_message: Change erlang symbol type alias is a definition
query:
  symbol: price
expect:
  relations:
  # Both `shop:price()` of the spec are one read at line 4; the type is not in an
  # `-export_type`, so a remote use of it is a candidate, as the sibling case reads
  # the qualified call.
  - from: cart.erl::sum
    to: shop.erl::price
    kind: reads
    resolution: candidate
    site: 4
  definitions:
  - shop.erl::price
  no_negative_claims: true
  partial:
    shop.erl::price:
      calls: not_traced
      reads: not_traced
