repo:
  initial_files:
    Cargo.toml: |
      [package]
      name = "fixture"
      version = "0.1.0"
      edition = "2021"
    src/lib.rs: |
      pub mod git;
      pub mod impact;
      pub mod kotlin_bindings;
      pub mod locate;
      pub mod parsers;
      pub mod pipeline;
      pub mod signatures;
    src/signatures.rs: |
      pub fn generate_signature_variants(s: &str) -> Vec<String> {
          vec![s.to_string()]
      }
    src/parsers.rs: |
      pub fn unanalysed_reason(path: &str) -> Option<&'static str> {
          if path.is_empty() { Some("empty") } else { None }
      }
    src/git.rs: |
      pub fn grep_lines_matching(pat: &str) -> Vec<String> {
          vec![pat.to_string()]
      }
    src/pipeline.rs: |
      use crate::signatures::generate_signature_variants;

      pub fn variants_a(s: &str) -> usize {
          generate_signature_variants(s).len()
      }

      pub fn variants_b(s: &str) -> usize {
          generate_signature_variants(s).len() + 1
      }

      pub fn reason(p: &str) -> Option<&'static str> {
          crate::parsers::unanalysed_reason(p)
      }
    src/impact.rs: |
      pub fn why(p: &str) -> Option<&'static str> {
          crate::parsers::unanalysed_reason(p)
      }
    src/locate.rs: |
      use crate::parsers::unanalysed_reason;

      pub fn build_coverage(p: &str) -> bool {
          unanalysed_reason(p).is_some()
      }
    src/kotlin_bindings.rs: |
      pub fn files_declaring(name: &str) -> Vec<String> {
          crate::git::grep_lines_matching(name)
      }
