name: web_symbol_css_class_composed_in_a_script_keeps_its_reads_open
mode: symbol
source: gh#631
issue_state: open
tags:
- web
- css
- astro
- classes
- symbol
- coverage
repo:
  initial_files:
    src/layouts/Base.astro: |
      <nav><a href="/" class="btn btn-outline">Home</a></nav>
      <img src="/portrait.jpg" alt="me" />
      <script>
        const kind = document.body.dataset.kind;
        document.querySelector("nav a").classList.add("btn-" + kind);
      </script>
    src/layouts/Other.astro: |
      <a class="btn-outlined">Other</a>
      <img src="/portrait.png" alt="other" />
    src/styles/global.css: |
      .btn { display: inline-block; }
      .btn-outline { border: 1px solid black; }
    public/portrait.jpg: |
      jpg-bytes
    public/portrait.png: |
      png-bytes
  commit_message: Change web symbol css class composed in a script
query:
  symbol: btn-outline
expect:
  relations:
  - from: src/layouts/Base.astro
    to: src/styles/global.css::btn-outline
    kind: reads
    resolution: resolved
    site: 1
  exact: true
  decoys:
    src/styles/global.css::btn-outline:
    - src/layouts/Other.astro
  definitions:
  - src/styles/global.css::btn-outline
  # Base.astro's script builds `"btn-" + kind` at run time: it can add this class
  # (or any other `btn-*`) to an element, and no search of the text names that
  # reader. Only the reads stay open; a class is never called, so its calls are
  # complete.
  partial:
    src/styles/global.css::btn-outline:
      reads: not_traced
