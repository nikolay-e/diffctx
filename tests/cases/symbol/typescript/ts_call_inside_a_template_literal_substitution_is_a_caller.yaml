      }
    src/ui/Template.tsx: |
      import { formatBytes } from '../lib/fmt';

      export function Template({ n }: { n: number }) {
        return <p>{n > 0 && ` · ${formatBytes(n)}`}</p>;
      }
    src/ui/Direct.tsx: |
      import { formatBytes } from '../lib/fmt';

      export function Direct({ n }: { n: number }) {
        return <p>{formatBytes(n)}</p>;
      }
