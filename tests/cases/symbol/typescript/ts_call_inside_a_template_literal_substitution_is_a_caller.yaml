    src/lib/fmt.ts: |
      export function formatBytes(bytes: number): string {
        return `${bytes} B`;
      }
    src/lib/plain.ts: |
      import { formatBytes } from './fmt';

      export function plainTemplate(n: number): string {
        return `size ${formatBytes(n)}`;
      }
