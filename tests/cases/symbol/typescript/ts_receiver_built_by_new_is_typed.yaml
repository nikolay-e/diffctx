repo:
  initial_files:
    src/items.ts: |
      export class ItemsService {
        constructor(private base: string) {}

        async byIds(ids: string[]): Promise<string[]> {
          return ids.map((i) => this.base + i);
        }
      }
    src/use.ts: |
      import { ItemsService } from './items';

      const items = new ItemsService('/x/');

      export async function load(ids: string[]) {
        return items.byIds(ids);
      }

      export async function loadFresh(ids: string[]) {
        return new ItemsService('/y/').byIds(ids);
      }

      export async function loadTyped(svc: ItemsService, ids: string[]) {
        return svc.byIds(ids);
      }
