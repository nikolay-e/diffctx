name: secrets_001_env_provider_key_redacted
tags:
- lang:dotenv
- change:single_file
- security:redaction
repo:
  initial_files:
    .env: |
      STORAGE_BUCKET=invoices-prod
      STORAGE_REGION=us-east-1
    app/storage.py: |
      import os


      def storage_client_config():
          return {
              "bucket": os.environ["STORAGE_BUCKET"],
              "region": os.environ["STORAGE_REGION"],
          }
  changed_files:
    .env: |
      STORAGE_BUCKET=invoices-prod
      STORAGE_REGION=us-east-1
      AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
  commit_message: Add storage credentials
fragments:
- id: env_variable
  selector:
    path: .env
    anchor: AWS_ACCESS_KEY_ID=
- id: no_raw_key
  selector:
    anchor: AKIAIOSFODNN7EXAMPLE
oracle:
  required:
  - env_variable
  forbidden:
  - no_raw_key
