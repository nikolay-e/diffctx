name: xlang_tech_005_decoy_redis_password_identifier
tags:
- xlang:decoy
- xlang:tech
- lang:python
- lang:yaml
- change:single_file
- context:cross_module
- difficulty:hard
repo:
  initial_files:
    deploy/compose.yml: |
      services:
        redis:
          image: redis:7-alpine
          command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
        web:
          build: .
          environment:
            REDIS_URL: redis://redis:6379/0
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    app/config.py: |
      import os

      REDIS_URL = os.environ.get("REDIS_URL", "redis://localhost:6379/0")
      REDIS_PASSWORD = os.environ.get("REDIS_PASSWORD") or None
    .env.example: |
      REDIS_URL=redis://redis:6379/0
      REDIS_PASSWORD=
    tests/conftest.py: |
      import pytest

      redis_password = "test-only"


      @pytest.fixture
      def fake_redis(monkeypatch):
          monkeypatch.setattr("app.config.REDIS_PASSWORD", redis_password)
    worker/settings.py: |
      import os

      REDIS_URL = os.environ.get("REDIS_URL", "redis://localhost:6379/1")
  changed_files:
    deploy/compose.yml: |
      services:
        redis:
          image: redis:7-alpine
          command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "${REDIS_PASSWORD}"
        web:
          build: .
          environment:
            REDIS_URL: redis://redis:6379/0
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  commit_message: The cache requires the password the app already sends
fragments:
- id: compose_requirepass
  selector:
    path: deploy/compose.yml
    anchor: --requirepass "${REDIS_PASSWORD}"
- id: config_password
  selector:
    path: app/config.py
    anchor: os.environ.get("REDIS_PASSWORD")
- id: dotenv_password
  selector:
    path: .env.example
    anchor: REDIS_PASSWORD=
- id: no_conftest
  selector:
    path: tests/conftest.py
- id: no_worker_settings
  selector:
    path: worker/settings.py
oracle:
  required:
  - compose_requirepass
  - config_password
  - dotenv_password
  allowed: []
  forbidden:
  - no_conftest
  - no_worker_settings
