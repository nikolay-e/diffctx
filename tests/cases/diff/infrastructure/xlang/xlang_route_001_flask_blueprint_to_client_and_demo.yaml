name: xlang_route_001_flask_blueprint_to_client_and_demo
tags:
- xlang:route
- lang:python
- lang:typescript
- change:single_file
- context:cross_module
- difficulty:hard
repo:
  initial_files:
    backend/api/data.py: |
      from flask import Blueprint, jsonify, request
      from flask_login import current_user, login_required

      from data_loaders import get_race_predictions_data, get_tracker_activities_data, load_range

      data_bp = Blueprint("data", __name__, url_prefix="/data")


      @data_bp.route("/range", methods=["GET"])
      @login_required
      def api_range():
          start_date, end_date = _parse_date_range(request.args.get("start_date"), request.args.get("end_date"))
          return jsonify(load_range(start_date, end_date, current_user.id))


      @data_bp.route("/activities/tracker", methods=["GET"])
      @login_required
      def api_tracker_activities():
          start_date, end_date = _parse_date_range(request.args.get("start_date"), request.args.get("end_date"))
          result = get_tracker_activities_data(start_date, end_date, current_user.id)
          return jsonify(result)


      @data_bp.route("/race-predictions", methods=["GET"])
      @login_required
      def api_race_predictions():
          start_date, end_date = _parse_date_range(request.args.get("start_date"), request.args.get("end_date"))
          return jsonify(get_race_predictions_data(start_date, end_date, current_user.id))
