name: keys_env_015_renamed_compose_key
tags:
- xkeys:env
- xkeys:rename
- lang:python
- lang:yaml
repo:
  initial_files:
    services/api/Dockerfile: |
      FROM python:3.12-slim
      COPY . /srv
    services/api/docker-compose.yml: |
      services:
        app:
          build: .
          environment:
            - CACHE_HOST=redis:6379
    services/api/app.py: |
      import os

      HOST = os.environ["CACHE_HOST"]
    services/worker/Dockerfile: |
      FROM python:3.12-slim
      COPY . /srv
    services/worker/.env.example: |
      CACHE_HOST=redis-worker
  changed_files:
    services/api/docker-compose.yml: |
      services:
        app:
          build: .
          environment:
            - CACHE_ENDPOINT=redis:6379
  commit_message: Rename the api cache host
fragments:
- id: compose
  selector:
    path: services/api/docker-compose.yml
    anchor: 'CACHE_ENDPOINT'
- id: api_app
  selector:
    path: services/api/app.py
    anchor: 'CACHE_HOST'
- id: worker_env
  selector:
    path: services/worker/.env.example
oracle:
  required:
  - compose
  - api_app
  forbidden:
  - worker_env
min_score: 60
