name: keys_image_003_helm_values_to_ci_build
tags:
- xkeys:image
- xkeys:decoy
- lang:yaml
repo:
  initial_files:
    .github/workflows/release.yml: |
      name: release
      on:
        push:
          tags: ["v*"]
      jobs:
        api:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - run: docker build -t ghcr.io/acme-org/api:${GITHUB_REF_NAME} -f api/Dockerfile api
            - run: docker push ghcr.io/acme-org/api:${GITHUB_REF_NAME}
    api/Dockerfile: |
      FROM python:3.12-slim
      COPY . /srv
    charts/api/Chart.yaml: |
      apiVersion: v2
      name: api
      version: 0.1.0
    charts/api/values.yaml: |
      image:
        repository: ghcr.io/acme-org/api
        tag: "1.0.0"
    charts/web/Chart.yaml: |
      apiVersion: v2
      name: web
      version: 0.1.0
    charts/web/values.yaml: |
      image:
        repository: ghcr.io/acme-org/web
        tag: "1.0.0"
  changed_files:
    charts/api/values.yaml: |
      image:
        repository: ghcr.io/acme-org/api
        tag: "1.1.0"
  commit_message: Release the api chart at 1.1.0
fragments:
- id: values
  selector:
    path: charts/api/values.yaml
    anchor: 'tag: "1.1.0"'
- id: release
  selector:
    path: .github/workflows/release.yml
    anchor: 'docker build -t ghcr.io/acme-org/api'
- id: dockerfile
  selector:
    path: api/Dockerfile
- id: web_values
  selector:
    path: charts/web/values.yaml
oracle:
  required:
  - values
  - release
  forbidden:
  - web_values
min_score: 60
