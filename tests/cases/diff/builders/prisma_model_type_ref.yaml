name: prisma_model_type_ref
tags:
- lang:prisma
- change:single_file
- context:cross_module
- builder:prisma
repo:
  initial_files:
    db/schema.prisma: |
      model Po {
        id   Int @id
        tier Qzk
        size Int
      }
    enums/qzk.prisma: |
      enum Qzk {
        GOLD
        SILVER
        BRONZE
      }
    enums/ledger.prisma: |
      enum Ledger {
        OPENED
        CLOSED
        FROZEN
      }
    enums/courier.prisma: |
      enum Courier {
        POST
        DRONE
        BIKE
      }
    enums/voyage.prisma: |
      enum Voyage {
        HARBOR
        OPEN_SEA
        DOCKED
      }
  changed_files:
    db/schema.prisma: |
      model Po {
        id   Int @id
        tier Qzk?
        size Int
      }
  commit_message: Tier becomes optional
fixtures:
  auto_garbage: true
fragments:
- id: qzk
  selector:
    path: enums/qzk.prisma
    anchor: enum Qzk
- id: no_ledger
  selector:
    path: enums/ledger.prisma
- id: no_courier
  selector:
    path: enums/courier.prisma
- id: no_voyage
  selector:
    path: enums/voyage.prisma
oracle:
  required:
  - qzk
  forbidden:
  - no_ledger
  - no_courier
  - no_voyage
