name: lua_dofile_only_edge
tags:
- lang:lua
- change:single_file
- context:cross_module
- builder:lua
repo:
  initial_files:
    game/boot.lua: |
      tints = dofile("vendor/palette.lua")

      window_width = 800
      window_height = 600

      print("starting", window_width, window_height)
    vendor/palette.lua: |
      return {
        crimson = {0.86, 0.08, 0.24},
        teal = {0.0, 0.5, 0.5},
        amber = {1.0, 0.75, 0.0},
      }
    vendor/archive.lua: |
      local archive = {}
      function archive.compress(folder)
        return os.execute("tar -czf " .. folder .. ".tgz " .. folder)
      end
      function archive.extract(bundle, target)
        return os.execute("tar -xzf " .. bundle .. " -C " .. target)
      end
      function archive.checksum(bundle)
        return os.execute("sha256sum " .. bundle .. " > " .. bundle .. ".sha256")
      end
      function archive.verify(bundle)
        local handle = io.open(bundle .. ".sha256", "r")
        if not handle then return false end
        local expected = handle:read("*l")
        handle:close()
        return expected ~= nil and #expected == 64
      end
      function archive.prune(folder, days)
        return os.execute("find " .. folder .. " -name '*.tgz' -mtime +" .. days .. " -delete")
      end
      return archive
    vendor/network.lua: |
      local network = {}
      function network.wait_for_port(host, port)
        for attempt = 1, 10 do
          if os.execute("nc -z " .. host .. " " .. port) then return true end
        end
        return false
      end
      function network.fetch_with_retry(url, target)
        for attempt = 1, 3 do
          if os.execute("curl -fsSL " .. url .. " -o " .. target) then return true end
        end
        return false
      end
      function network.resolve_address(host)
        local handle = io.popen("getent hosts " .. host)
        if not handle then return nil end
        local line = handle:read("*l")
        handle:close()
        return line and line:match("^(%S+)")
      end
      function network.is_reachable(host)
        return os.execute("ping -c 1 -W 1 " .. host) == true
      end
      return network
    vendor/journal.lua: |
      local journal = {}
      journal.threshold = "info"
      function journal.write(level, message)
        io.stderr:write(os.date("!%Y-%m-%dT%H:%M:%SZ") .. " [" .. level .. "] " .. message .. "\n")
      end
      function journal.info(message)
        journal.write("INFO", message)
      end
      function journal.warn(message)
        journal.write("WARN", message)
      end
      function journal.fail(message)
        journal.write("FAIL", message)
        os.exit(1)
      end
      function journal.rotate(directory, keep)
        return os.execute("ls -1t " .. directory .. "/*.log | tail -n +" .. (keep + 1) .. " | xargs -r rm -f")
      end
      function journal.tail_since(file, marker)
        local handle = io.open(file, "r")
        if not handle then return {} end
        local found, lines = false, {}
        for line in handle:lines() do
          if found then lines[#lines + 1] = line end
          if line:find(marker, 1, true) then found = true end
        end
        handle:close()
        return lines
      end
      return journal
  changed_files:
    game/boot.lua: |
      tints = dofile("vendor/palette.lua")

      window_width = 1024
      window_height = 768

      print("starting", window_width, window_height)
  commit_message: Larger default window
fixtures:
  auto_garbage: true
fragments:
- id: palette
  selector:
    path: vendor/palette.lua
    anchor: crimson =
- id: no_archive
  selector:
    path: vendor/archive.lua
- id: no_network
  selector:
    path: vendor/network.lua
- id: no_journal
  selector:
    path: vendor/journal.lua
oracle:
  required:
  - palette
  forbidden:
  - no_archive
  - no_network
  - no_journal
