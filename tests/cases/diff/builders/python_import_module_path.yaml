name: python_import_module_path
tags:
- lang:python
- change:single_file
- context:cross_module
- builder:python
repo:
  initial_files:
    src/boot.py: |
      import vendor.palette as tints

      WIDTH = 800
      HEIGHT = 600
      print("starting", WIDTH, HEIGHT, tints)
    vendor/__init__.py: ''
    vendor/palette.py: |
      crimson = 0xDC143C
      teal = 0x008080
      amber = 0xFFBF00
    vendor/archive.py: |
      import subprocess


      def compress_folder(folder):
          return subprocess.call(["tar", "-czf", folder + ".tgz", folder])
    vendor/network.py: |
      import subprocess


      def wait_for_port(host, port):
          return subprocess.call(["nc", "-z", host, str(port)]) == 0
  changed_files:
    src/boot.py: |
      import vendor.palette as tints

      WIDTH = 1024
      HEIGHT = 768
      print("starting", WIDTH, HEIGHT, tints)
  commit_message: Larger default window
fixtures:
  auto_garbage: true
fragments:
- id: gold
  selector:
    path: vendor/palette.py
    anchor: crimson =
- id: no_0
  selector:
    path: vendor/archive.py
- id: no_1
  selector:
    path: vendor/network.py
oracle:
  required:
  - gold
  forbidden:
  - no_0
  - no_1
