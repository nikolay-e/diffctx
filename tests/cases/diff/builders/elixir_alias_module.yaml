name: elixir_alias_module
tags:
- lang:elixir
- change:single_file
- context:cross_module
- builder:elixir
repo:
  initial_files:
    lib/boot.ex: |
      defmodule Boot do
        alias Vendor.Palette

        def size, do: {800, 600}
        def tint, do: Palette.crimson()
      end
    lib/vendor/palette.ex: |
      defmodule Vendor.Palette do
        def crimson, do: 0xDC143C
        def teal, do: 0x008080
      end
    lib/vendor/archive.ex: |
      defmodule Vendor.Archive do
        def compress(folder), do: System.cmd("tar", ["-czf", folder <> ".tgz", folder])
      end
    lib/vendor/network.ex: |
      defmodule Vendor.Network do
        def wait(host, port), do: System.cmd("nc", ["-z", host, to_string(port)])
      end
  changed_files:
    lib/boot.ex: |
      defmodule Boot do
        alias Vendor.Palette

        def size, do: {1024, 768}
        def tint, do: Palette.crimson()
      end
  commit_message: Larger default window
fixtures:
  auto_garbage: true
fragments:
- id: gold
  selector:
    path: lib/vendor/palette.ex
    anchor: def crimson
- id: no_0
  selector:
    path: lib/vendor/archive.ex
- id: no_1
  selector:
    path: lib/vendor/network.ex
oracle:
  required:
  - gold
  forbidden:
  - no_0
  - no_1
