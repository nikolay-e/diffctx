# `_missing_` and `_generate_next_value_` are run by the `enum` library, never by a call
# in the project: an edit to either is no change "nothing calls".
repo:
  initial_files:
    main.py: |
      from enum import Enum, auto


      class Status(Enum):
          ACTIVE = "active"
          UNKNOWN = "unknown"

          @classmethod
          def _missing_(cls, value):
              return cls.UNKNOWN


      class Color(Enum):
          @staticmethod
          def _generate_next_value_(name, start, count, last_values):
              return name.lower()

          RED = auto()
          GREEN = auto()


      def parse(value):
          return Status(value)
  changed_files:
    main.py: |
      from enum import Enum, auto


      class Status(Enum):
          ACTIVE = "active"
          UNKNOWN = "unknown"

          @classmethod
          def _missing_(cls, value):
              return cls.UNKNOWN if value else cls.ACTIVE


      class Color(Enum):
          @staticmethod
          def _generate_next_value_(name, start, count, last_values):
              return name.upper()

          RED = auto()
          GREEN = auto()


      def parse(value):
          return Status(value)
