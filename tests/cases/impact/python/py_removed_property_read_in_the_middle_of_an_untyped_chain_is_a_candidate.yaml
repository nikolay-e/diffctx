      class HTTPError(Exception):
          def __init__(self, message, request=None):
              super().__init__(message)
              self._request = request

          @property
          def request(self):
              return self._request
    tests/test_errors.py: |
      import pytest

      from pkg.errors import HTTPError


      def test_raise_through_the_context_manager():
          with pytest.raises(HTTPError) as exc_info:
              raise HTTPError("boom", request="r")
          assert exc_info.value.request.upper() == "R"


      def test_error_handed_in_by_a_fixture(error):
          assert error.request.lower() == "r"
