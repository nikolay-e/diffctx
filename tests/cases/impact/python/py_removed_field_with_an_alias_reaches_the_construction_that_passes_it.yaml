          return Payload(type="x")
  changed_files:
    svc/model.py: |
      from pydantic import BaseModel, Field


      class Payload(BaseModel):
          name: str = ""
  commit_message: "model: drop the kind field"
expect:
  removed: [kind]
  # A construction passes a field by its alias, not its name: the keyword of
  # the call does not say whether it reaches the removed field.
  relations:
    - {from: "svc/make.py::build", to: "svc/model.py::Payload", kind: instantiates, resolution: resolved, site: 5}
