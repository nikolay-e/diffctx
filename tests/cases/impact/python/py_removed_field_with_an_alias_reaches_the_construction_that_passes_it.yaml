name: py_removed_field_with_an_alias_reaches_the_construction_that_passes_it
mode: impact
source: gh#400
issue_state: closed
tags: [python, removed-field, construction, control]
repo:
  initial_files:
    svc/__init__.py: ""
    svc/model.py: |
      from pydantic import BaseModel, Field


      class Payload(BaseModel):
          name: str = ""
          kind: str = Field(default="", alias="type")
    svc/make.py: |
      from svc.model import Payload


