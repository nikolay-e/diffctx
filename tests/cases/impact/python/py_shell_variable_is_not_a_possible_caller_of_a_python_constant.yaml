    scripts/check-prom-rules.py: |
      import re

      NAMESPACES = re.compile(r"^(app|infra)_")


      def check(name):
          return bool(NAMESPACES.match(name))
    ansible/roles/k3s/templates/k3s-bootstrap-images.sh.j2: |
