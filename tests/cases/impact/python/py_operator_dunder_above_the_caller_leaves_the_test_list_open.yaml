      class Span:
          def __init__(self, n):
              self.n = n

          def index(self, value):
              return self._near(value)

          def _near(self, value):
              return value % self.n

          def __contains__(self, value):
              try:
                  self.index(value)
              except ValueError:
                  return False
              return True
