repo:
  initial_files:
    tool.py: |
      import sys


      def shout(text):
          return text.upper()


      def main():
          print(shout(sys.argv[1]))


      if __name__ == "__main__":
          main()
    test_tool.py: |
      import subprocess
      import sys
      import tempfile
      import unittest
      from pathlib import Path

      TOOL = Path(__file__).resolve().parent / "tool.py"


      class ToolTest(unittest.TestCase):
          def setUp(self):
              self.workdir = tempfile.mkdtemp()

          def run_tool(self, *args):
              return subprocess.run([sys.executable, str(TOOL), *args], capture_output=True, text=True)

          def test_shouts(self):
              self.assertEqual(self.run_tool("hi").stdout, "HI\n")

          def test_shouts_twice(self):
              self.assertEqual(self.run_tool("yo").stdout, "YO\n")
