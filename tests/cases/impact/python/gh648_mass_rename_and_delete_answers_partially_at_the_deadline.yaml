name: gh648_mass_rename_and_delete_answers_partially_at_the_deadline
mode: impact
source: gh#648
issue_state: open
# The field shape (465 R100 renames + 1,000 deletions past 300 s) does not
# reproduce synthetically (fx/648: 1.20 40 s, 2.0 21 s). The case pins the
# contract instead: with the deadline already expired the answer is partial,
# says so, and still names the one edited file; R100 renames are no change.
