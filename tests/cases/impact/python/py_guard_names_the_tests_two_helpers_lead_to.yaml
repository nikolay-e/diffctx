name: py_guard_names_the_tests_two_helpers_lead_to
mode: impact
source: synthetic
issue_state: closed
tags: [python, tests-reach]
repo:
  initial_files:
    shop/__init__.py: ""
    shop/pricing.py: |
      def total(price, qty):
          return price * qty
    shop/checkout.py: |
      from shop.pricing import total


      def charge(price, qty):
          return total(price, qty)
    shop/quote.py: |
      from shop.checkout import charge


      def quote(price, qty):
          return charge(price, qty)
    shop/refund.py: |
      from shop.checkout import charge


      def refund(price, qty):
          return -charge(price, qty)
    tests/test_quote.py: |
      from shop.quote import quote


      def test_quote():
          assert quote(2, 3) == 6
    tests/test_refund.py: |
      from shop.refund import refund


      def test_refund():
          assert refund(2, 3) == -6
  changed_files:
    shop/pricing.py: |
      def total(price, qty):
          return round(price * qty, 2)
  commit_message: "pricing: round the total"
expect:
  relations:
    - {from: "shop/checkout.py::charge", to: "shop/pricing.py::total", kind: calls, resolution: resolved, site: 5}
    - from: "tests/test_quote.py::test_quote"
      to: "shop/checkout.py::charge"
      kind: tests_reach
      resolution: resolved
    - from: "tests/test_refund.py::test_refund"
      to: "shop/checkout.py::charge"
      kind: tests_reach
      resolution: resolved
