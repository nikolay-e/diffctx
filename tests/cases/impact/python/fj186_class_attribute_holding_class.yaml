name: fj186_class_attribute_holding_class
mode: impact
source: fj#186
issue_state: open
tags:
- python
- callers
- class-attribute
- alias
repo:
  initial_files:
    shop/highlight.py: |
      class Highlighter:
          pass


      class ReprHighlighter(Highlighter):
          highlights = [r"(?P<url>https?://[a-z]*)"]

          def highlight(self, text):
              return text

          @classmethod
          def default(cls):
              return cls()
    shop/handler.py: |
      from typing import ClassVar, Type

      from shop.highlight import Highlighter, ReprHighlighter


      class Handler:
          HIGHLIGHTER_CLASS: ClassVar[Type[Highlighter]] = ReprHighlighter

          def __init__(self):
              self.highlighter = self.HIGHLIGHTER_CLASS()

          def run(self, text):
              return self.highlighter.highlight(text)

          @classmethod
          def make(cls):
              return cls.HIGHLIGHTER_CLASS.default()
    tests/test_handler.py: |
      from shop.handler import Handler


      def test_handler_runs():
          assert Handler().run("x") == "x"
  changed_files:
    shop/highlight.py: |
      class Highlighter:
          pass


      class ReprHighlighter(Highlighter):
          highlights = [r"(?P<url>https?://[a-z~]*)"]

          def highlight(self, text):
              return text.strip()

          @classmethod
          def default(cls):
              return cls() or None
  commit_message: Strip the text and allow a tilde in a url
