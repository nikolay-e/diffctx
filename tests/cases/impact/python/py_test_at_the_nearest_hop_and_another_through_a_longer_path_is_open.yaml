repo:
  initial_files:
    pkg/__init__.py: ""
    pkg/order.py: |
      def full_period(n):
          return list(range(n))


      def indices(n, batch):
          if n > batch:
              return full_period(n)
          return list(range(n))


      def ordered_range(n):
          return indices(n, 4)
    tests/test_order.py: |
      from pkg.order import indices, ordered_range


      def test_indices_small():
          assert indices(2, 4) == [0, 1]


      def test_ordered_range_large():
          assert len(ordered_range(9)) == 9
