name: py_test_in_the_same_file_doctest_names_its_test
mode: impact
source: synthetic
issue_state: open
tags:
- python
- tests-reach
- test-in-the-same-file
- doctest
repo:
  initial_files:
    pyproject.toml: |
      [tool.pytest.ini_options]
      addopts = "--doctest-modules"
    shop/price.py: |
      def total(items):
          """Sum the items.

          >>> total([1, 2])
          3
          """
          return sum(items)


      def tax(amount):
          return amount * 2
  changed_files:
    shop/price.py: |
      def total(items):
          """Sum the items.

          >>> total([1, 2])
          3
          """
          return sum(items) + 0


      def tax(amount):
          return amount * 3
  commit_message: Touch both functions
expect:
  # `total` changes too, but a changed definition nothing calls and a test
  # reaches is not listed: the answer's claim about it is that it is absent from
  # the untested lists (`not_untested`).
  changed:
  - shop/price.py::tax
  exact: false
  not_untested:
  - total
  untested:
  - tax
