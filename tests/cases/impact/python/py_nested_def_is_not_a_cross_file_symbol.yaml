      import pytest


      def _cache_control(status: int, uri: str, upstream: str = "") -> str:
          headers = {}

          def value(variable: str) -> str:
              return headers.get(variable, "")

          return value("cache-control") + upstream


      @pytest.mark.parametrize("status", [200, 404])
      def test_cache_control(status):
          assert _cache_control(status, "/x") == ""
