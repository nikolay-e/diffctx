    shop/price.py: |
      import unittest


      def total(items):
          return sum(items)


      def tax(amount):
          return amount * 2


      class TotalTest(unittest.TestCase):
          def test_total(self):
              self.assertEqual(total([1, 2]), 3)


      if __name__ == "__main__":
          unittest.main()
