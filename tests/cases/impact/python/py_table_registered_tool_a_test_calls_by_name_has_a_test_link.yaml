repo:
  initial_files:
    tools.py: |
      def get_x():
          return 1


      def get_unlisted():
          return 2


      TOOLS = (("get_x", get_x, False),)


      def register(tool):
          for name, fn, mutating in TOOLS:
              tool(name, mutating=mutating)(fn)
    server.py: |
      import tools

      TABLE = {}


      def tool(name, mutating=False):
          def deco(fn):
              TABLE[name] = fn
              return fn

          return deco


      def make_server():
          tools.register(tool)
          return TABLE


      async def call_tool(server, name, args):
          return server[name](**args)
    tests/test_tools.py: |
      from server import call_tool, make_server


      async def test_get_x():
          server = make_server()
          await call_tool(server, "get_x", {})
