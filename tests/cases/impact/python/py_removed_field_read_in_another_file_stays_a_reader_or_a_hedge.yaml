name: py_removed_field_read_in_another_file_stays_a_reader_or_a_hedge
mode: impact
source: gh#400
issue_state: closed
tags: [python, removed-field, reads, control, dataclass]
repo:
  initial_files:
    svc/__init__.py: ""
    svc/model.py: |
      from dataclasses import dataclass


      @dataclass
      class Item:
          id: int
          size: int = 0
          note: str = ""
    svc/use.py: |
      import dataclasses

      from svc.model import Item


      def total(item: Item):
          return item.size + 1


      def bump(item: Item):
          return dataclasses.replace(item, size=2)


      def keep(item: Item):
          return item.note
  changed_files:
