name: au_py_call_in_unread_files_is_named_not_empty
mode: impact
source: synthetic
tags: [python, au-unread, unread-file, literal-name]
repo:
  initial_files:
    shop/pricing.py: |
      def total(items):
          return sum(items)
    notes.xyz: |
