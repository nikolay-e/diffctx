repo:
  initial_files:
    cli.py: |
      import click


      @click.group()
      def cli():
          pass


      @cli.command("sync")
      def sync_command():
          return 1


      @cli.command("prune")
      def prune_command():
          return 2
    tests/test_cli.py: |
      from click.testing import CliRunner

      from cli import cli


      def test_sync():
          result = CliRunner().invoke(cli, ["sync"])
          assert result.exit_code == 0
