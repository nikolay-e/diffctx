name: py_same_stem_modules_do_not_cross_attribute
mode: impact
source: gh#343
issue_state: closed
tags: [python, same-stem, decoy, smoke, body-only]
repo:
  initial_files:
    shop/__init__.py: ""
    shop/pricing.py: |
      def total(items):
          return sum(i.price for i in items)
    shop/checkout.py: |
      from shop.pricing import total


      def charge(cart):
          return cart.pay(total(cart.items))
    shop/report.py: |
      from shop.pricing import total


      def summarize(orders):
          return [total(o.items) for o in orders]
