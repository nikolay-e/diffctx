name: py_guard_keeps_a_second_test_file_beside_a_file_of_many_tests
mode: impact
source: synthetic
issue_state: closed
tags: [python, tests-reach]
repo:
  initial_files:
    shop/__init__.py: ""
    shop/pricing.py: |
      def total(price, qty):
          return price * qty
    shop/checkout.py: |
      from shop.pricing import total


      def charge(price, qty):
          return total(price, qty)
    tests/test_a.py: |
      from shop.checkout import charge


      def test_a1():
          assert charge(2, 3) == 6


      def test_a2():
          assert charge(2, 3) == 6


      def test_a3():
          assert charge(2, 3) == 6


      def test_a4():
          assert charge(2, 3) == 6
    tests/test_z.py: |
      from shop.checkout import charge


      def test_z():
          assert charge(2, 3) == 6
  changed_files:
    shop/pricing.py: |
      def total(price, qty):
          return round(price * qty, 2)
  commit_message: "pricing: round the total"
