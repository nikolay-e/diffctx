name: py_changed_main_block_is_named_not_absent
mode: impact
source: synthetic
issue_state: closed
tags: [python, oracle, fcn, main-block, module-variable]
repo:
  initial_files:
    tool.py: |
      def f(n):
          return n


      if __name__ == "__main__":
          x = f(
              1,
          )
          print(x)
  changed_files:
    tool.py: |
      def f(n):
          return n


      if __name__ == "__main__":
          x = f(
              2,
          )
          print(x)
  commit_message: "tool: run with 2"
expect:
  # Python has no block scope: `x` bound in the main guard is a module variable,
  # so the change of the block is the change of that definition, named with its
  # reader, not a stretch of code outside every definition.
  changed: [tool.py::x]
  no_negative_claims: true
  never_empty: true
