name: py_class_held_in_a_class_attribute_is_referenced_by_its_holder
mode: impact
source: fj#186
issue_state: open
tags:
- python
- references
- class-attribute
repo:
  initial_files:
    shop/highlight.py: |
      class Highlighter:
          pass


      class ReprHighlighter(Highlighter):
          highlights = [r"(?P<url>https?://[a-z]*)"]
    shop/handler.py: |
      from typing import ClassVar, Type

      from shop.highlight import Highlighter, ReprHighlighter


      class Handler:
          HIGHLIGHTER_CLASS: ClassVar[Type[Highlighter]] = ReprHighlighter

          def __init__(self):
              self.highlighter = self.HIGHLIGHTER_CLASS()
    tests/test_handler.py: |
      from shop.handler import Handler


      def test_handler_builds_a_highlighter():
          assert Handler().highlighter is not None
  changed_files:
    shop/highlight.py: |
      class Highlighter:
          pass


      class ReprHighlighter(Highlighter):
          highlights = [r"(?P<url>https?://[a-z~]*)"]
  commit_message: Allow a tilde in a url
expect:
  changed:
  - shop/highlight.py::ReprHighlighter
  - shop/highlight.py::highlights
  relations:
  - from: shop/handler.py::Handler
    to: shop/highlight.py::ReprHighlighter
    kind: passes_as_value
    resolution: resolved
  untested:
  - highlights
