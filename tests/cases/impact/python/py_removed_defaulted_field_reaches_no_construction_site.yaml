name: py_removed_defaulted_field_reaches_no_construction_site
mode: impact
source: gh#400
issue_state: closed
tags: [python, removed-field, reads, construction, decoy]
repo:
  initial_files:
    svc/__init__.py: ""
    svc/config.py: |
      from pydantic_settings import BaseSettings


      class AppSettings(BaseSettings):
          alpha: str = ""
          bravo: str = ""
          charlie: bool = False


      settings = AppSettings()
    svc/app.py: |
