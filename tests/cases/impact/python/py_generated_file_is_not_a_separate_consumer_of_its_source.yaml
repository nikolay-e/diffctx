name: py_generated_file_is_not_a_separate_consumer_of_its_source
mode: impact
source: fj#110
issue_state: open
tags: [python, named-by, generated-file, decoy]
repo:
  initial_files:
    tools/run.py: |
      import sys


      def greet(name):
          return "hello " + name


      def main():
          print(greet("a"))
          return 0


      if __name__ == "__main__":
          sys.exit(main())
    src/dash.jsonnet: |
      // source of the dashboard
      // reads tools/run.py output
      {}
    out/dash.yaml: |
      # GENERATED from src/dash.jsonnet - do not edit
      # reads tools/run.py output
      {}
  changed_files:
    tools/run.py: |
      import sys


      def greet(name):
          return "hi " + name


      def main():
          print(greet("a"))
          return 0


      if __name__ == "__main__":
          sys.exit(main())
  commit_message: "run: shorter greeting"
expect:
  named_by: [src/dash.jsonnet]
  not_named_by: [out/dash.yaml]
