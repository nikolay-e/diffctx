name: py_getattr_with_a_computed_name_hedges_the_methods_it_can_reach
mode: impact
source: synthetic
issue_state: open
tags: [python, getattr, dynamic-name, coverage]
repo:
  initial_files:
    main.py: |
      class Service:
          def start(self):
              pass

          def stop(self):
              pass


      name = "stop"
      service = Service()
      getattr(service, name)()
  changed_files:
    main.py: |
      class Service:
          def start(self):
              pass

          def stop(self):
              return 1


      name = "stop"
      service = Service()
      getattr(service, name)()
  commit_message: "service: stop returns one"
expect:
  changed: [main.py::stop]
  discloses: true
  no_negative_claims: true
  partial:
    main.py::stop:
      calls: not_traced
      reads: not_traced
