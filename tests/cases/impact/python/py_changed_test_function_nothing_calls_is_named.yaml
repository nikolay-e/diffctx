name: py_changed_test_function_nothing_calls_is_named
mode: impact
source: synthetic
issue_state: open
tags:
- python
- tests-reach
- silent-loss
repo:
  initial_files:
    shop/price.py: |
      def total(items):
          return sum(items)
    tests/test_price.py: |
      from shop.price import total


      def test_total():
          assert total([1, 2]) == 3
  changed_files:
    tests/test_price.py: |
      from shop.price import total


      def test_total():
          assert total([1, 2, 3]) == 6
  commit_message: The test sums three
expect:
  # A test is run by its runner and called by nothing: the definition the diff
  # changed is named, with its role, never dropped from the answer.
  changed:
  - tests/test_price.py::test_total
  entry_not_tested:
  - tests/test_price.py::test_total
