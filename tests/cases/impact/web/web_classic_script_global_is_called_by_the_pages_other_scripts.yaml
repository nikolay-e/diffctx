repo:
  initial_files:
    lib.js: |
      function greet(name) {
        return "hi " + name;
      }
    app.js: |
      function boot() {
        document.title = greet("app");
      }
      boot();
    index.html: |
      <!doctype html>
      <html>
      <body>
      <script src="lib.js"></script>
      <script src="app.js"></script>
      <script>
        document.body.textContent = greet("page");
      </script>
      </body>
      </html>
    other.js: |
      const x = { greet() {} };
      x.greet();
      // greet("c")
      const s = "greet(1)";
    standalone.html: |
      <!doctype html>
      <html>
      <body>
      <script src="other.js"></script>
      <script>
        greet("p");
      </script>
      </body>
      </html>
  changed_files:
    lib.js: |
      function greet(name) {
        return "hello " + name;
      }
