name: swift_method_answering_a_protocol_requirement_is_an_implementation
mode: impact
source: synthetic
tags: [swift, protocol, implementation]
repo:
  initial_files:
    Sources/Demo/Shape.swift: |
      protocol Shape {
          func area() -> Double
      }
    Sources/Demo/Square.swift: |
      struct Square: Shape {
          func area() -> Double { return 1.0 }
      }
  changed_files:
    Sources/Demo/Shape.swift: |
      protocol Shape {
          func area() throws -> Double
      }
  commit_message: "shape: area may throw"
expect:
  exact: false
  relations:
    # A conforming type states no override for what it implements: it answers the requirement by its name.
    - from: Sources/Demo/Square.swift::Square.area
      to: Sources/Demo/Shape.swift::Shape.area
      kind: overrides
      resolution: resolved
      site: 2
