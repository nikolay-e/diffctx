      extension Int {
          func nickel() -> Int { return self + 6 }
          static func fromWords(_ s: String) -> Int { return s.count + 1 }
      }

      extension String {
          var shouty: String { return uppercased() + "!" }
      }
  commit_message: "kit: bump the builtin extensions"
