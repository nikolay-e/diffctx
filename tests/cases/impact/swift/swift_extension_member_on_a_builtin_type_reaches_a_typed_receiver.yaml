name: swift_extension_member_on_a_builtin_type_reaches_a_typed_receiver
mode: impact
source: synthetic
issue_state: closed
tags: [swift, extension]
repo:
  initial_files:
    Package.swift: |
      // swift-tools-version:5.9
      import PackageDescription
      let package = Package(name: "Kit", targets: [.target(name: "Kit")])
    Sources/Kit/Defs.swift: |
      import Foundation

      extension Int {
          func nickel() -> Int { return self + 5 }
          static func fromWords(_ s: String) -> Int { return s.count }
      }

      extension String {
          var shouty: String { return uppercased() }
      }
    Sources/Kit/Uses.swift: |
      func useInt(n: Int) -> Int {
          return n.nickel()
      }

      func useStatic() -> Int {
          return Int.fromWords("x")
      }

      func useString(s: String) -> String {
          return s.shouty
      }
  changed_files:
