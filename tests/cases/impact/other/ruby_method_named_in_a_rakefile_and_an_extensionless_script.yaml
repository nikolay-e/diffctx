name: ruby_method_named_in_a_rakefile_and_an_extensionless_script
mode: impact
source: synthetic
tags: [ruby, literal-name, mention-scan]
repo:
  initial_files:
    lib/pricing.rb: |
      module Pricing
        def self.compute_price(x)
          x
        end
      end
    Rakefile: |
      Pricing.compute_price(1)
    exe/price: |
      #!/usr/bin/env ruby
      Pricing.compute_price(1)
