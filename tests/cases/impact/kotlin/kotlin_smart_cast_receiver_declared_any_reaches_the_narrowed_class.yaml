          fun load(): Int {
              return 1
          }
      }
    src/main/kotlin/com/acme/app/Use.kt: |
      package com.acme.app

      import com.acme.lib.Repo

      class Use {
          fun viaIf(x: Any): Int {
              if (x is Repo) return x.load()
              return 0
          }

          fun viaAnd(x: Any?): Boolean = x is Repo && x.load() > 0

          fun viaWhen(x: Any): Int = when (x) {
              is Repo -> x.load()
              else -> 0
          }

          fun viaSubjectless(x: Any): Int = when {
              x is Repo -> x.load()
              else -> 0
          }

          fun viaEarlyReturn(x: Any): Int {
              if (x !is Repo) return 0
              return x.load()
          }

          fun viaCast(x: Any): Int {
              x as Repo
              return x.load()
          }

          fun viaRequire(x: Any): Int {
              require(x is Repo)
              return x.load()
          }

          fun viaEquals(other: Any?): Boolean {
              if (other is Repo) return other.load() > 0
              return false
          }
      }
