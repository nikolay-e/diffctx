name: kotlin_block_body_only_change_reaches_callers
mode: impact
source: synthetic
issue_state: closed
tags: [kotlin, body-only, block-body, smoke]
repo:
  initial_files:
    src/main/kotlin/shop/Pricing.kt: |
      package shop

      object Pricing {
          fun total(items: List<Int>): Int {
              var sum = 0
              for (item in items) {
                  sum += item
              }
              return sum
          }
      }
    src/main/kotlin/shop/Checkout.kt: |
      package shop

      class Checkout {
          fun charge(items: List<Int>): Int = Pricing.total(items) + 1
      }
    src/main/kotlin/shop/Report.kt: |
