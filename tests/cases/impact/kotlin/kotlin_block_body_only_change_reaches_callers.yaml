      object Pricing {
          fun total(items: List<Int>): Int = items.size
      }

      fun legacySum(items: List<Int>): Int = Pricing.total(items)
    src/main/kotlin/shop/Notes.kt: |
      package shop

      // Pricing.total(items) is documented here
      val note = "Pricing.total(items)"
  changed_files:
    src/main/kotlin/shop/Pricing.kt: |
      package shop

      object Pricing {
          fun total(items: List<Int>): Int {
              var sum = 0
              for (item in items) {
                  sum += item * 2
              }
              return maxOf(sum, 0)
          }
      }
  commit_message: "pricing: double each item and never go negative"
