  changed_files:
    src/main/kotlin/dev/example/streaming/adapters/shared/Playlist.kt: |
      package shop

      class Section(val lines: String, val longest: Long)

      object Playlist {
          fun render(n: Int): String = document(listOf(section(n)))

          fun section(n: Int): Section = Section("#EXTINF:" + n, n.toLong())

          fun document(s: List<Section>): String = "#EXTM3U\n" + s.joinToString("") { it.lines }
      }
    src/main/kotlin/dev/example/streaming/adapters/shared/LabController.kt: |
      package shop

      import org.springframework.web.bind.annotation.GetMapping
      import org.springframework.web.bind.annotation.RestController

      @RestController
      class LabController {
          fun helper0(x: Int): Int = x + LIMIT0

          fun helper1(x: Int): Int = x + LIMIT1

          fun helper2(x: Int): Int = x + LIMIT2

          fun helper3(x: Int): Int = x + LIMIT3

          fun helper4(x: Int): Int = x + LIMIT4

          fun helper5(x: Int): Int = x + LIMIT5

          @GetMapping("/lab/queue")
          fun queue(): String =
              Playlist.document(
                  listOf(
                      Playlist.section(helper0(1)),
                      Playlist.section(helper1(1)),
                      Playlist.section(helper2(1)),
                      Playlist.section(helper3(1)),
                      Playlist.section(helper4(1)),
                      Playlist.section(helper5(1)),
                  ),
              )

          companion object {
              const val LIMIT0 = 0
              const val LIMIT1 = 1
              const val LIMIT2 = 2
              const val LIMIT3 = 3
              const val LIMIT4 = 4
              const val LIMIT5 = 5
          }
      }
  commit_message: Refactor the shared playlist renderer and add a lab controller
