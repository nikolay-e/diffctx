repo:
  initial_files:
    src/main/kotlin/shop/Pricing.kt: |
      package shop

      object Pricing {
          fun total(items: List<Int>): Int = items.sum()
      }
    src/main/kotlin/shop/Checkout.kt: |
      package shop

      class Checkout {
          fun charge(items: List<Int>): Int = Pricing.total(items) + 1
      }
    src/main/kotlin/shop/Report.kt: |
      package shop

      fun build(items: List<Int>): String = "total=" + Pricing.total(items)
    src/main/kotlin/legacy/Pricing.kt: |
      package legacy

      object Pricing {
          fun total(items: List<Int>): Int = items.size
      }

      fun legacySum(items: List<Int>): Int = Pricing.total(items)
    src/test/kotlin/shop/CheckoutTest.kt: |
      package shop

      import kotlin.test.Test
      import kotlin.test.assertEquals

      class CheckoutTest {
          @Test
          fun chargeAddsOne() {
              assertEquals(4, Checkout().charge(listOf(1, 2)))
          }
      }
    src/main/kotlin/shop/Notes.kt: |
      package shop

      // Pricing.total(items) is documented here
      val note = "Pricing.total(items)"
    other/src/main/kotlin/other/Pricing.kt: |
      package other

      object Pricing {
          fun total(items: List<Int>): Int = items.size
      }

      fun caller(): Int = Pricing.total(listOf(1))
  changed_files:
    src/main/kotlin/shop/Pricing.kt: |
      package shop

      object Pricing {
          fun total(items: List<Int>): Int = items.fold(0) { acc, n -> acc + n }
      }
