    src/main/kotlin/com/acme/app/Use.kt: |
      package com.acme.app

      import com.acme.lib.Repo

      class Use(private val held: Any) {
          fun viaOr(x: Any): Int {
              if (x !is Repo || x.load() > 0) return 1
              return 0
          }

          fun viaNegated(x: Any): Int {
              if (!(x is Repo)) {
                  return 0
              } else {
                  return x.load()
              }
          }

          fun viaThisProperty(): Int {
              if (this.held is Repo) return this.held.load()
              return 0
          }

          fun viaIt(items: List<Any>) {
              items.forEach { if (it is Repo) it.load() }
          }

          fun viaPlainAny(x: Any): Int = (x as Repo).load()

          fun <T> viaTypeParameter(x: T): Int = (x as Repo).load()
      }
