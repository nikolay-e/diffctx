name: k7_bats_test_that_runs_a_function_by_name_is_named_in
mode: impact
source: synthetic
tags: [shell, bats, word-scan, false-absence]
repo:
  initial_files:
    lib/strings.sh: |
      #!/usr/bin/env bash
      slugify() { echo "$1" | tr 'A-Z ' 'a-z-'; }
      shout() { echo "$1" | tr 'a-z' 'A-Z'; }
    bin/release: |
      #!/usr/bin/env bash
      source "$(dirname "$0")/../lib/strings.sh"
      shout "release"
    test/strings.bats: |
      #!/usr/bin/env bats
      setup() { source "$BATS_TEST_DIRNAME/../lib/strings.sh"; }
      @test "slugify lowercases" {
        run slugify "Hello World"
        [ "$output" = "hello-world" ]
      }
  changed_files:
    lib/strings.sh: |
      #!/usr/bin/env bash
      slugify() { echo "$1" | tr 'A-Z ' 'a-z_'; }
      shout() { echo "$1" | tr 'a-z' 'A-Z'; }
  commit_message: "strings: slugify joins with underscores"
expect:
  exact: false
  discloses: true
  no_negative_claims: true
  relations:
    - {from: test/strings.bats, to: lib/strings.sh::slugify, kind: calls, resolution: unresolved}
