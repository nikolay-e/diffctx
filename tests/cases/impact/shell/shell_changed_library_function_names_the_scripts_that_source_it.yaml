name: shell_changed_library_function_names_the_scripts_that_source_it
mode: impact
source: gh#533
issue_state: closed
tags:
- shell
- source
- hyphen
repo:
  initial_files:
    scripts/lib.sh: |
      fetch() {
        curl -s "$1"
      }
    scripts/my-lib.sh: |
      login() {
        echo ticket
      }
    scripts/plain.sh: |
      . ./lib.sh
      fetch x
    scripts/dyn.sh: |
      source "$(dirname "$0")/lib.sh"
      fetch y
    scripts/run.sh: |
      source "$(dirname "${BASH_SOURCE[0]}")/lib.sh"
      source "$(dirname "${BASH_SOURCE[0]}")/my-lib.sh"
      main() {
        fetch "https://example.org"
      }
      login
      main "$@"
    scripts/plain2.sh: |
      . ./my-lib.sh
      login
    scripts/var.sh: |
      #!/bin/bash
      SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
      source "$SCRIPT_DIR/my-lib.sh"
      if login; then echo ok; fi
    scripts/env.sh: |
      source "$LIB_HOME/my-lib.sh"
      ticket=$(login)
    scripts/other.sh: |
      fetch() {
        wget "$1"
      }
      fetch z
    scripts/standalone.sh: |
      fetch q
    scripts/words.sh: |
      . ./lib.sh
      . ./my-lib.sh
      echo fetch login
      # fetch it, then login
      printf '%s\n' "fetch"
      msg="login"
    scripts/config.sh: |
      source "$CONFIG_FILE"
      login
    tests/test_lib.sh: |
      source "$(dirname "$0")/../scripts/lib.sh"
      fetch t
  changed_files:
    scripts/my-lib.sh: |
      login() {
        echo session
      }
  commit_message: Change shell changed library function names the scripts that source it
expect:
  changed:
  - scripts/my-lib.sh::login
  relations:
  - from: scripts/env.sh
    to: scripts/my-lib.sh::login
    kind: calls
    resolution: resolved
    site: 2
  - from: scripts/plain2.sh
    to: scripts/my-lib.sh::login
    kind: calls
    resolution: resolved
    site: 2
  - from: scripts/run.sh
    to: scripts/my-lib.sh::login
    kind: calls
    resolution: resolved
    site: 6
  - from: scripts/var.sh
    to: scripts/my-lib.sh::login
    kind: calls
    resolution: resolved
    site: 4
  - from: scripts/config.sh
    to: scripts/my-lib.sh::login
    kind: calls
    resolution: candidate
    site: 2
  exact: true
  decoys:
    scripts/my-lib.sh::login:
    - scripts/words.sh
