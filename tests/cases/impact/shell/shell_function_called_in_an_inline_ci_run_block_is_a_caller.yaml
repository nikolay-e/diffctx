name: shell_function_called_in_an_inline_ci_run_block_is_a_caller
mode: impact
source: synthetic
tags: [shell, literal-name, ci-inline-run]
repo:
  initial_files:
    scripts/lib/common.sh: |
      #!/usr/bin/env bash
      log_step() {
        echo "==> $*"
      }
    scripts/release.sh: |
      #!/usr/bin/env bash
      DIR="$(cd "$(dirname "$0")" && pwd)"
      . "$DIR/lib/common.sh"
      log_step "release"
    .github/workflows/ci.yml: |
      jobs:
        e2e:
          runs-on: ubuntu-latest
          steps:
            - run: |
                source scripts/lib/common.sh
                log_step e2e
  changed_files:
    scripts/lib/common.sh: |
      #!/usr/bin/env bash
      log_step() {
        printf '==> %s\n' "$*" >&2
      }
  commit_message: "common: log_step prints to stderr"
expect:
  exact: false
  discloses: true
  no_negative_claims: true
  relations:
    - {from: scripts/release.sh, to: scripts/lib/common.sh::log_step, kind: calls}
    - {from: .github/workflows/ci.yml, to: scripts/lib/common.sh::log_step, kind: calls, resolution: unresolved}
