name: shell_function_named_in_a_method_called_run_is_no_command
mode: impact
source: synthetic
tags: [shell, literal-name, decoy]
repo:
  initial_files:
    lib/strings.sh: |
      #!/usr/bin/env bash
      slugify() {
        echo "${1,,}"
      }
    app.py: |
      class Cli:
          def run(self, line):
              return line


      def main(app):
          app.run("slugify --help")
  changed_files:
    lib/strings.sh: |
      #!/usr/bin/env bash
      slugify() {
        printf '%s\n' "${1,,}"
      }
  commit_message: "strings: slugify prints through printf"
expect:
  exact: true
  callers: {slugify: []}
  decoys:
    lib/strings.sh::slugify: [app.py]
