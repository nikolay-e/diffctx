name: shell_function_named_as_a_ruby_method_call_is_no_command
mode: impact
source: synthetic
tags: [shell, literal-name, decoy, ruby]
repo:
  initial_files:
    lib/strings.sh: |
      #!/usr/bin/env bash
      slugify() {
        echo "${1,,}"
      }
    lib/app.rb: |
      def main(obj, x)
        obj.slugify(x)
      end
  changed_files:
    lib/strings.sh: |
      #!/usr/bin/env bash
      slugify() {
        printf '%s\n' "${1,,}"
      }
  commit_message: "strings: slugify prints through printf"
expect:
  exact: true
  callers: {slugify: []}
  decoys:
    lib/strings.sh::slugify: [lib/app.rb]
