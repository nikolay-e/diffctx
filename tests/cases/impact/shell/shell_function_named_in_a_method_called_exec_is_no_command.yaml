name: shell_function_named_in_a_method_called_exec_is_no_command
mode: impact
source: synthetic
tags: [shell, literal-name, decoy, javascript]
repo:
  initial_files:
    lib/strings.sh: |
      #!/usr/bin/env bash
      slugify() {
        echo "${1,,}"
      }
    scripts/cache.js: |
      function warm(cache) {
        return cache.exec("slugify --warm");
      }
      module.exports = { warm };
  changed_files:
    lib/strings.sh: |
      #!/usr/bin/env bash
      slugify() {
        printf '%s\n' "${1,,}"
      }
  commit_message: "strings: slugify prints through printf"
expect:
  exact: true
  callers: {slugify: []}
  decoys:
    lib/strings.sh::slugify: [scripts/cache.js]
