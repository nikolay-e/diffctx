  discloses: true
  no_negative_claims: true
  relations:
    - {from: lib/system.rb, to: lib/strings.sh::slugify, kind: calls, resolution: unresolved}
    - {from: lib/ticks.rb, to: lib/strings.sh::slugify, kind: calls, resolution: unresolved}
