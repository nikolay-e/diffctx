name: go_strict_body_only_change_reaches_callers
mode: impact
source: synthetic
issue_state: closed
tags: [go, body-only, smoke]
repo:
  initial_files:
    go.mod: |
      module example.com/app

      go 1.22
    pricing/pricing.go: |
      package pricing

      func Total(items []int) int {
          sum := 0
          for _, n := range items {
              sum += n
          }
          return sum
      }
    checkout/checkout.go: |
      package checkout

      import "example.com/app/pricing"

      func Charge(items []int) int {
          return pricing.Total(items) + 1
      }
    report/report.go: |
      package report

      import (
          "strconv"

          "example.com/app/pricing"
      )

      func Build(items []int) string {
          return "total=" + strconv.Itoa(pricing.Total(items))
      }
    legacy/pricing.go: |
      package legacy

      func Total(items []int) int {
          return len(items)
      }

      func LegacySum(items []int) int {
          return Total(items)
      }
    notes/notes.go: |
      package notes

      // pricing.Total(items) is documented here
      const Note = "pricing.Total(items)"
  changed_files:
    pricing/pricing.go: |
      package pricing

      func Total(items []int) int {
          sum := 0
          for _, n := range items {
              sum += 2 * n
          }
          if sum < 0 {
              return 0
          }
          return sum
      }
  commit_message: "pricing: double each item and never go negative"
expect:
  changed: [pricing/pricing.go::Total]
  relations:
    - from: "checkout/checkout.go::Charge"
      to: "pricing/pricing.go::Total"
      kind: calls
      resolution: resolved
      site: 6
    - {from: "report/report.go::Build", to: "pricing/pricing.go::Total", kind: calls, resolution: resolved, site: 10}
  decoys:
    pricing/pricing.go::Total: [legacy/pricing.go, notes/notes.go]
