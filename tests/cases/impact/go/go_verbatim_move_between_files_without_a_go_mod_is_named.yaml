name: go_verbatim_move_between_files_without_a_go_mod_is_named
mode: impact
source: synthetic
tags: [go, silent-loss, move]
repo:
  initial_files:
    binding_test.go: |
      package binding

      import "testing"

      func TestKeep(t *testing.T) {}

      func TestBindingMsgPack(t *testing.T) {
      	testMsgPackBodyBinding(t, "msgpack", "/")
      }

      func testMsgPackBodyBinding(t *testing.T, name, path string) {
      	if name == "" || path == "" {
      		t.Fatal("x")
      	}
      }
  changed_files:
    binding_test.go: |
      package binding

      import "testing"

      func TestKeep(t *testing.T) {}
    binding_msgpack_test.go: |
      // +build !nomsgpack

      package binding

      import "testing"

      func TestBindingMsgPack(t *testing.T) {
      	testMsgPackBodyBinding(t, "msgpack", "/")
      }

      func testMsgPackBodyBinding(t *testing.T, name, path string) {
      	if name == "" || path == "" {
      		t.Fatal("x")
      	}
      }

      func TestBindingDefaultMsgPack(t *testing.T) {}
  commit_message: "move the msgpack tests behind a build tag"
# The control of the case with a go.mod: each file is a module of its own, and the move is named.
expect:
  exact: false
  changed:
    - binding_msgpack_test.go::TestBindingMsgPack
    - binding_msgpack_test.go::testMsgPackBodyBinding
    - binding_msgpack_test.go::TestBindingDefaultMsgPack
