name: tf_changed_output_reaches_the_callers_of_its_module
mode: impact
source: synthetic
issue_state: closed
tags:
- terraform
- module
- body-only
repo:
  initial_files:
    main.tf: |
      module "net" {
        source = "./modules/net"
        cidr   = "10.0.0.0/16"
      }

      module "other" {
        source = "./modules/other"
      }

      output "net_vpc" {
        value = module.net.vpc
      }

      output "other_vpc" {
        value = module.other.vpc
      }
    modules/net/main.tf: |
      variable "cidr" {
        type = string
      }

      output "vpc" {
        value = "net-${var.cidr}"
      }
    modules/other/main.tf: |
      output "vpc" {
        value = "other"
      }
  changed_files:
    modules/net/main.tf: |
      variable "cidr" {
        type = string
      }

      output "vpc" {
        value = "vpc-${var.cidr}"
      }
  commit_message: tf changed output reaches the callers of its module
expect:
  changed:
  - modules/net/main.tf::output.vpc
  relations:
  - from: main.tf::output.net_vpc
    to: modules/net/main.tf::output.vpc
    kind: reads
    resolution: resolved
    site: 11
  exact: true
  decoys:
    modules/net/main.tf::output.vpc:
    - modules/other/main.tf
