name: php_magic_call_of_a_typed_receiver_never_reaches_another_class
mode: impact
source: synthetic
issue_state: closed
tags:
- php
- magic
- absence-claim
repo:
  initial_files:
    src/Ghost.php: |
      <?php

      class Ghost
      {
          public function __call(string $name, array $arguments)
          {
              return null;
          }
      }
    src/Real.php: |
      <?php

      class Real
      {
          public function boo(): int
          {
              return 1;
          }
      }
    src/Haunt.php: |
      <?php

      function haunt(Ghost $g)
      {
          return $g->boo();
      }
  changed_files:
    src/Real.php: |
      <?php

      class Real
      {
          public function boo(): int
          {
              return 2;
          }
      }
  commit_message: Change magic call catches a call and is never a verified zero
expect:
  # `haunt` declares `Ghost $g`, which PHP enforces: `$g->boo()` lands in
  # Ghost::__call, and Real is no Ghost, so nothing calls Real::boo.
  changed:
  - src/Real.php::Real.boo
  callers:
    src/Real.php::Real.boo: []
