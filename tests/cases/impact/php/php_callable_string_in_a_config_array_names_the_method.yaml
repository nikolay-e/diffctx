name: php_callable_string_in_a_config_array_names_the_method
mode: impact
source: synthetic
tags: [php, literal-name, callable-string, array-value, config]
repo:
  initial_files:
    composer.json: |
      {"autoload": {"psr-4": {"App\\": "src/"}}}
    src/Setup.php: |
      <?php

      namespace App;

      class Setup
      {
          public static function postInstall(): int
          {
              return 1;
          }
      }
    config/hooks.php: |
      <?php

      return [
          'post_install' => 'App\Setup::postInstall',
      ];
  changed_files:
    src/Setup.php: |
      <?php

      namespace App;

      class Setup
      {
          public static function postInstall(): int
          {
              return 2;
          }
      }
  commit_message: "setup: postInstall returns two"
expect:
  exact: false
  discloses: true
  no_negative_claims: true
  relations:
    - {from: config/hooks.php, to: src/Setup.php::postInstall, kind: calls, resolution: unresolved}
