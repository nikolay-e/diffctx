    src/Slug.php: |
      <?php

      namespace App;

      use Illuminate\Support\Facades\Facade;

      class Slug extends Facade
      {
          protected static function getFacadeAccessor(): string
          {
              return Slugger::class;
          }
      }
    src/Slugger.php: |
      <?php

      namespace App;

      class Slugger
      {
          public function slugify(string $s): string
          {
              return str_replace(' ', '_', $s);
          }
      }
    src/Client.php: |
      <?php

      namespace App;

      class Client
      {
          public function title(string $t): string
          {
              return Slug::slugify($t);
          }
      }
  changed_files:
