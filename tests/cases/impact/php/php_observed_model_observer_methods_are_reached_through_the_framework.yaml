name: php_observed_model_observer_methods_are_reached_through_the_framework
mode: impact
source: synthetic
tags: [php, laravel, framework-registration]
repo:
  initial_files:
    composer.json: |
      {"autoload": {"psr-4": {"App\\": "app/"}}}
    app/Observers/UserObserver.php: |
      <?php

      namespace App\Observers;

      class UserObserver
      {
          public function created($user): int
          {
              return 1;
          }
