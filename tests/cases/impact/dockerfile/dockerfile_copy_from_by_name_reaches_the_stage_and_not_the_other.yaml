name: dockerfile_copy_from_by_name_reaches_the_stage_and_not_the_other
mode: impact
source: synthetic
issue_state: closed
tags:
- dockerfile
- copy-from
- stage
repo:
  initial_files:
    Dockerfile: |
      FROM golang:1.22 AS build
      WORKDIR /src
      RUN go build -o /out/app ./cmd

      FROM golang:1.22 AS tools
      RUN go install example.com/lint@latest

      FROM alpine:3.20 AS final
      COPY --from=build /out/app /usr/local/bin/app
  changed_files:
    Dockerfile: |
      FROM golang:1.22 AS build
      WORKDIR /src
