repo:
  initial_files:
    include/lib.h: |
      int alias_target(int a);
      int public_alias(int a);
      int weak_target(int a);
      int weak_alias(int a);
    src/lib.c: |
      #include "../include/lib.h"

      int alias_target(int a) { return a + 1; }

      int public_alias(int a) __attribute__((alias("alias_target")));

      int weak_target(int a) { return a + 1; }

      int weak_alias(int a) __attribute__((weak, alias("weak_target")));
