name: c_removed_field_read_in_the_middle_of_a_chain_is_not_absent
mode: impact
source: synthetic
issue_state: closed
tags: [c, removed-definition, absence-claim, chain]
repo:
  initial_files:
    src/err.h: |
      struct req {
          const char *url;
      };

      struct api_error {
          struct req *request;
          int code;
      };
    src/report.c: |
      #include "err.h"

      const char *describe(struct api_error *e)
      {
          return e->request->url;
      }

      const char *loose(void *p)
      {
          return p->request->url;
      }
  changed_files:
    src/err.h: |
      struct req {
          const char *url;
      };

      struct api_error {
          int code;
      };
  commit_message: "drop the request field"
expect:
  removed: [src/err.h::request]
  relations:
  - from: src/report.c::describe
    to: src/err.h::request
    kind: reads
    resolution: resolved
  - from: src/report.c::loose
    to: src/err.h::request
    kind: reads
    resolution: candidate
  exact: false
  never_empty: true
