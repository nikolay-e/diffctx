      use std::process::Command;

      #[test]
      fn greets() {
          let out = Command::new(env!("CARGO_BIN_EXE_tool")).arg("x").output().unwrap();
          assert_eq!(String::from_utf8_lossy(&out.stdout), "hi x\n");
      }
  commit_message: Change rust binary run test reaches main
