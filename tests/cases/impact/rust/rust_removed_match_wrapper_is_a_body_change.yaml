repo:
  initial_files:
    Cargo.toml: |
      [package]
      name = "fixture"
      version = "0.1.0"
      edition = "2021"
    src/lib.rs: |
      pub mod other;
      pub mod resolver;
      pub mod user;
    src/resolver.rs: |
      pub struct Resolver {
          pub depth: u32,
      }

      impl Resolver {
          pub fn bind(&self, a: Option<u32>, b: Option<u32>) -> u32 {
              match (a, b) {
                  (Some(x), Some(y)) => x + y,
                  _ => self.depth,
              }
          }
      }
    src/user.rs: |
      use crate::resolver::Resolver;

      pub fn run() -> u32 {
          let r = Resolver { depth: 1 };
          r.bind(Some(1), None)
      }
    src/other.rs: |
      pub fn pick(a: Option<u32>) -> u32 {
          match a {
              Some(x) => x,
              None => 0,
          }
      }
  changed_files:
    src/resolver.rs: |
      pub struct Resolver {
          pub depth: u32,
      }

      impl Resolver {
          pub fn bind(&self, a: Option<u32>, b: Option<u32>) -> u32 {
              a.unwrap_or(0) + b.unwrap_or(self.depth)
          }
      }
