repo:
  initial_files:
    Cargo.toml: |
      [package]
      name = "fixture"
      version = "0.1.0"
      edition = "2021"
    src/lib.rs: |
      pub mod other;
      pub mod panel;
    src/panel.rs: |
      const PANEL_LINE: &str = "Mixer panel:";
      const PANEL_KEYS: [&str; 2] = ["tone", "mix"];

      fn knobs(line: &str) -> usize {
          if line.starts_with(PANEL_LINE) { PANEL_KEYS.len() } else { 0 }
      }

      pub fn read_panel(line: &str) -> usize {
          knobs(line)
      }

      #[cfg(test)]
      mod tests {
          #[test]
          fn reads_knobs() {
              assert!(super::read_panel("Mixer panel: {}") > 0);
          }
      }
    src/other.rs: |
      const PANEL_LINE: &str = "other";

      pub fn own() -> usize {
          PANEL_LINE.len()
      }
