    src/main/java/shop/Hooks.java: |
      package shop;

      import com.example.bus.Subscribe;
      import com.example.di.Provides;
      import com.example.json.JsonCreator;
      import org.springframework.beans.factory.annotation.Autowired;

      public class Hooks {
          private int state;

          @Subscribe
          public void onTick(Object event) {
              state = 1;
          }

          @Provides
          public Object clock() {
              return state + 1;
          }

          @JsonCreator
          public static Hooks of(String raw) {
              return new Hooks();
          }

          @Autowired
          public void wire(Object other) {
              state = 1;
          }

          public void plain() {
              state = 1;
          }
      }
