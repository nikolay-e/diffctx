      package com.acme.app;

      import org.springframework.boot.autoconfigure.condition.ConditionalOnExpression;
      import org.springframework.security.access.prepost.PreAuthorize;
      import org.junit.jupiter.params.provider.MethodSource;

      public class Ctl {
          @PreAuthorize("hasRole('ADMIN') and @authz.canView(#id)")
          public String view(long id) {
              return "v";
          }

          @ConditionalOnExpression("@authz.enabled() > 0")
          public String gated() {
              return "g";
          }

          @ConditionalOnExpression("#{authz.limited() > 0}")
          public String bounded() {
              return "b";
          }

          @MethodSource({"first", "provide"})
          public void many() {
          }

          @MethodSource({"selected"})
          public void single() {
          }
      }
