name: gh731_untracked_data_file_is_one_bounded_fragment
mode: impact
source: gh#731
issue_state: open
# mode=diff: the defect is pack mode (`--diff --mode pack`): 1.20 emits 731 fragments of an
# untracked JSON, 2.0 one. Impact mode never exploded; this case pins that the code change
# and the untracked test stay the answer beside the data file.
tags: [java, untracked, data-file, pack]
repo:
  initial_files:
    src/App.java: |
      package demo;

      public class App {
          public int total(int a, int b) {
              return a + b;
          }
      }
  changed_files:
    src/App.java: |
      package demo;

      public class App {
          public int total(int a, int b) {
              return a + b + 1;
          }
      }
