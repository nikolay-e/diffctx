name: ts_namespace_merged_into_a_class_in_another_file_reads_its_member_bare
mode: impact
source: synthetic
issue_state: open
tags: [typescript, bare-name, declaration-merging, absence-claim]
repo:
  initial_files:
    package.json: |
      {"name":"app","version":"1.0.0"}
    tsconfig.json: |
      {"compilerOptions":{"strict":true}}
    src/foo.ts: |
      export class Foo {
        id = 1;
      }

      export namespace Foo {
        export const defaults = { retries: 1 };
      }
    src/foo.more.ts: |
      import { Foo } from './foo';

      export namespace Foo {
        export function retries(): number {
          return defaults.retries;
        }
      }
  changed_files:
    src/foo.ts: |
      export class Foo {
        id = 1;
      }

      export namespace Foo {
        export const defaults = { retries: 2 };
      }
