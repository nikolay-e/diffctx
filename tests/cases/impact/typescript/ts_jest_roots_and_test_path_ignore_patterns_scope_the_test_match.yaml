name: ts_jest_roots_and_test_path_ignore_patterns_scope_the_test_match
mode: impact
source: fj#216
issue_state: open
tags:
- typescript
- tests-reach
- jest-config
- decoy
repo:
  initial_files:
    jest.config.ts: |
      import type { Config } from "jest";

      const config: Config = {
        roots: ["<rootDir>/src"],
        testMatch: ["**/*.check.ts"],
        testPathIgnorePatterns: ["/node_modules/", "<rootDir>/src/fixtures/"],
      };
      export default config;
    src/header.check.ts: |
      import { header } from "./header";

      it("header", () => expect(header()).toBe("B"));
    src/fixtures/legend.check.ts: |
      import { legend } from "../legend";

      it("legend", () => expect(legend()).toBe("b"));
    tools/footer.check.ts: |
      import { footer } from "../src/footer";

      it("footer", () => expect(footer()).toBe("b"));
    src/format.ts: |
      export function shout(s: string): string {
        return s.toUpperCase();
      }

      export function whisper(s: string): string {
        return s.toLowerCase();
      }

      export function mutter(s: string): string {
        return s.trim();
      }
    src/header.ts: |
      import { shout } from "./format";

      export function header() {
        return shout("b");
      }
    src/footer.ts: |
      import { whisper } from "./format";

      export function footer() {
        return whisper("B");
      }
    src/legend.ts: |
      import { mutter } from "./format";

      export function legend() {
        return mutter(" b ");
      }
    tests/unit/other.test.ts: |
      it("s", () => expect(1).toBe(1));
  changed_files:
    src/format.ts: |
      export function shout(s: string): string {
        return s.toLocaleUpperCase();
      }

      export function whisper(s: string): string {
        return s.toLocaleLowerCase();
      }

      export function mutter(s: string): string {
        return s.trimStart();
      }
  commit_message: change all three
expect:
  changed:
