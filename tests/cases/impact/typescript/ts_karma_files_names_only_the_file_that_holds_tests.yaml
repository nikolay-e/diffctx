name: ts_karma_files_names_only_the_file_that_holds_tests
mode: impact
source: synthetic
tags:
- typescript
- tests-reach
- karma-config
repo:
  initial_files:
    karma.conf.js: |
      module.exports = (config) => config.set({ files: ["src/**/*.ts", "qa/**/*.check.ts"] });
    qa/page.check.ts: |
      import { page } from "../src/page";

      describe("page", () => it("works", () => { if (page() !== "B") throw new Error("x"); }));
    qa/note.helper.ts: |
      import { note } from "../src/note";

      export const noted = () => note();
    src/format.ts: |
      export function shout(s: string): string {
        return s.toUpperCase();
      }

      export function whisper(s: string): string {
        return s.toLowerCase();
      }

      export function mutter(s: string): string {
        return s.trim();
      }
    src/page.ts: |
      import { shout } from "./format";

      export function page() {
        return shout("b");
      }
    src/note.ts: |
      import { whisper } from "./format";

      export function note() {
        return whisper("B");
      }
    src/rumble.ts: |
      import { mutter } from "./format";

      export function rumble() {
        return mutter(" b ");
      }
    libs/core/test/other.test.ts: |
      test("s", () => expect(1).toBe(1));
  changed_files:
    src/format.ts: |
      export function shout(s: string): string {
        return s.toLocaleUpperCase();
      }

      export function whisper(s: string): string {
        return s.toLocaleLowerCase();
      }

      export function mutter(s: string): string {
        return s.trimStart();
      }
  commit_message: change all three
expect:
  changed:
  - src/format.ts::shout
  - src/format.ts::whisper
  - src/format.ts::mutter
  exact: false
  tested_by:
    src/page.ts: qa/page.check.ts
  not_untested:
  - shout
  untested:
  - whisper
