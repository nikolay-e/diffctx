      import { expect, test } from '@playwright/test';

      test('shows the sync state', async ({ page }) => {
        await page.goto('/inbox');
        await expect(page.getByTestId('sync-banner')).toHaveText(/^Syncing your inbox in the background/);
      });
    tests/e2e/settings.spec.ts: |
      import { expect, test } from '@playwright/test';

      test('shows the preferences', async ({ page }) => {
        await page.goto('/settings');
        await expect(page.getByText('Preferences')).toBeVisible();
      });
  changed_files:
    src/SyncBanner.tsx: |
      const MESSAGES: Record<string, string> = {
        idle: 'Everything is up to date',
        busy: 'Syncing your inbox in the background',
      };

      export function SyncBanner({ pending }: { pending: number }) {
        return <p data-testid="sync-banner">{MESSAGES[pending > 0 ? 'busy' : 'idle']} · {pending} waiting</p>;
      }
