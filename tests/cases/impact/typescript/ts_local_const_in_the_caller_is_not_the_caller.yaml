name: ts_local_const_in_the_caller_is_not_the_caller
mode: impact
source: gh#452
issue_state: closed
tags: [javascript, local-binding, tests-reach, smoke]
repo:
  initial_files:
    tools/rows.mjs: |
      export function rows(xs) {
