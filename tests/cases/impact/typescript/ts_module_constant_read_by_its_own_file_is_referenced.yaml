      const PANEL_LINE = /^DJ panel: (\{.*\})\s*$/;
      const PANEL_KEYS = new Set(['tempo', 'key', 'mood']);

      function knobs(text: string): string[] {
        const match = PANEL_LINE.exec(text);
        return match ? [...PANEL_KEYS] : [];
      }

      export function readPanel(text: string): string[] {
        return knobs(text);
      }
