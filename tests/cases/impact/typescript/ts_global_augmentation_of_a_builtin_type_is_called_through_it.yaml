name: ts_global_augmentation_of_a_builtin_type_is_called_through_it
mode: impact
source: synthetic
issue_state: open
tags: [typescript, builtin, augmentation, absence-claim]
repo:
  initial_files:
    package.json: |
      {"name":"app","version":"1.0.0"}
    tsconfig.json: |
      {"compilerOptions":{"strict":true}}
    src/ext.ts: |
      declare global {
        interface String {
          shout(): string;
        }
      }

      String.prototype.shout = function (this: string): string {
        return this.toUpperCase();
      };

      export {};
    src/use.ts: |
      import './ext';

      export function go(s: string): string {
        return s.shout();
      }
  changed_files:
    src/ext.ts: |
      declare global {
        interface String {
          shout(): string;
        }
      }

      String.prototype.shout = function (this: string): string {
        return this.toUpperCase() + '!';
      };

      export {};
  commit_message: change
expect:
  changed: ['src/ext.ts::shout']
  relations:
  - {from: 'src/use.ts::go', to: 'src/ext.ts::shout', kind: calls, resolution: resolved}
  exact: false
  never_empty: true
  no_negative_claims: true
