name: ts_unresolved_call_on_the_line_of_a_resolved_one_stays_a_candidate
mode: impact
source: synthetic
issue_state: open
tags: [typescript, candidate, same-line, coverage]
repo:
  initial_files:
    src/box.ts: |
      export class Box {
        area(): number {
          return 1;
        }
      }
    src/total.ts: |
      import { Box } from "./box";

      export function total(other) {
        const mine = new Box();
        return mine.area() + other.area();
      }
  changed_files:
    src/box.ts: |
      export class Box {
        area(): number {
          return 2;
        }
      }
  commit_message: "box: area is two"
# `other.area()` is a candidate use of the same definition on the resolved call's line: the
# answer counts it as unlanded and lists the line once, the resolver reports it as a
# candidate too, so the relation list is not exact.
expect:
  exact: false
  relations:
    - {from: "src/total.ts::total", to: "src/box.ts::Box.area", kind: calls, resolution: resolved, site: 5}
  partial:
    src/box.ts::Box.area:
      calls: unlanded
