name: ts_class_method_constructing_its_own_class_is_a_caller
mode: impact
source: synthetic
issue_state: closed
tags: [typescript, oracle, fcn, own-class-use]
repo:
  initial_files:
    src/foo.ts: |
      export class Foo {
        v: number;
        constructor(o: { v?: number } = {}) {
          this.v = o.v ?? 1;
        }
        clone(): Foo {
          return new Foo({});
        }
      }
    src/use.ts: |
      import { Foo } from "./foo";

      export function make(): Foo {
        return new Foo();
      }
