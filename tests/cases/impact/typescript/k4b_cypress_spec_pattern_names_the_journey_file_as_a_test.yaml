    cypress.config.ts: |
      import { defineConfig } from "cypress";

      export default defineConfig({ e2e: { specPattern: "journeys/**/*.journey.ts" } });
    journeys/page.journey.ts: |
      import { page } from "../src/page";

      describe("page", () => it("works", () => expect(page()).to.eq("B")));
