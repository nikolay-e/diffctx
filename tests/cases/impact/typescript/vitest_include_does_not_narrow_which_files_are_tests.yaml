name: vitest_include_does_not_narrow_which_files_are_tests
mode: impact
source: synthetic
issue_state: open
tags:
- typescript
- tests-reach
- vitest-config
repo:
  initial_files:
    vitest.config.ts: |
      import { defineConfig } from "vitest/config";

      export default defineConfig({
        plugins: [],
        test: { include: ["qa/**/*.check.ts"] },
      });
    qa/page.check.ts: |
      import { page } from "../src/page";

      it("page", () => { if (page() !== 2) throw new Error("x"); });
    src/core.ts: |
      export function widget(x: number): number {
        return x + 1;
      }
    src/page.ts: |
      import { widget } from "./core";

      export function page() {
        return widget(1);
      }
    scripts/widget.spec.ts: |
      import { page } from "../src/page";

      it("widget", () => { if (page() !== 2) throw new Error("y"); });
  changed_files:
    src/core.ts: |
      export function widget(x: number): number {
        return x + 2;
      }
  commit_message: change widget
expect:
  changed:
  - src/core.ts::widget
  exact: false
  tested_by:
    src/page.ts: scripts/widget.spec.ts
